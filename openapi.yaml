      description: |
        Resets every item with status `failed` back to queued and re-dispatches it; takes no body. Succeeded, cancelled
        and skipped items are never re-run. If the job was terminal it goes back to `queued` and `finished_at` is
        cleared; if it is still running, the reset items join the current run. Item `attempts` is NOT reset.
        No items failed → a no-op returning the job unchanged with `items_reset: 0`. A failed item whose hold was already
        returned to the monthly allowance holds its price again first; `402` if the allowance cannot cover it, and then
        nothing is reset.
