openapi: 3.1.0
info:
  title: Spicrawl API
  version: 1.0.0
  summary: Turn any URL into clean content or structured data with one request.
  description: |
    Spicrawl retrieves, renders and extracts web pages. One request shape serves every
    capability; you say what you want with flags and the platform chooses the engine,
    the proxy exit and the retries.

    Rules an agent should hold on to:

    - **Two statuses.** The HTTP status is the platform's. The target site's status is
      `X-Target-Status` (and `status` inside the JSON envelope, `target_status` on an
      error). A site that refused you is still a successful API call.
    - **Switch on `code`, retry on `retryable`.** Every error is `application/problem+json`
      with a stable `code` (`ERR::FAMILY::NAME`) and the server's own `retryable` verdict.
      Honour `Retry-After` / `retry_after_seconds`. Read `diagnostics.hint` when present:
      it names the parameter to change.
    - **Failures cost 0 credits.** `X-Credits-Charged` is what was billed;
      `X-Request-Cost` is what it would have cost; `X-Credits-Remaining` is the monthly
      allowance left after it.
    - **Not idempotent.** Retrying `POST /v1/scrape` performs and bills a second scrape.
    - **Unknown fields are rejected.** JSON bodies are decoded strictly; a misspelled
      field is a `400`, never silently ignored.
  contact:
    name: Spicrawl support
    url: https://docs.spicrawl.com
externalDocs:
  description: Guides and error reference
  url: https://docs.spicrawl.com
servers:
- url: https://api.spicrawl.com
  description: Production
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
tags:
- name: Scrape
  description: Fetch, render and extract one URL synchronously.
- name: Batch
  description: Scrape many URLs as one asynchronous job.
- name: Sessions
  description: Reuse cookies, storage and an exit IP across requests.
- name: Browser
  description: Drive a hosted browser over the Chrome DevTools Protocol.
- name: Requests
  description: Inspect the history of requests made in this key's project, or with the `read` scope in
    every project of its organization.
- name: Usage
  description: Credits and volume over time. Requires the `read` scope.
- name: Fleet
  description: Deployment capacity and readiness.
- name: Health
  description: Liveness and readiness probes.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: spicrawl_live_… | spicrawl_test_…
      description: |
        `Authorization: Bearer <key>`. Read the key from the `SPICRAWL_API_KEY` environment
        variable; never hard-code or log it. `spicrawl_test_…` keys can never spend live
        credits. Scopes: `scrape`, `batch`, `sessions` (granted by default), `browser`
        and `read` (granted deliberately). A missing scope is `403
        ERR::AUTH::INSUFFICIENT_SCOPE` naming the scope.
    apiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: |
        The key as a query parameter. Only for clients that cannot set headers, such as
        a WebSocket upgrade from Puppeteer or Playwright. Prefer `bearerAuth` everywhere
        else, because URLs end up in logs.
  headers:
    Retry-After:
      description: Seconds to wait before retrying. Present on retryable errors.
      schema:
        type: integer
        minimum: 0
    X-Request-Id:
      description: ULID of this request. Quote it in support requests and use it with `GET /v1/requests/{id}`.
      schema:
        type: string
    X-RateLimit-Limit:
      description: Requests allowed in the current window.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Seconds until the window resets.
      schema:
        type: integer
  schemas:
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code, `ERR::FAMILY::NAME`. Switch on this, not on
        `title` or `detail`. `x-spicrawl-errors` lists each code's HTTP status and
        whether it is retryable.
      enum:
      - ERR::AUTH::MISSING_KEY
      - ERR::AUTH::INVALID_KEY
      - ERR::AUTH::REVOKED_KEY
      - ERR::AUTH::EXPIRED_KEY
      - ERR::AUTH::FORBIDDEN
      - ERR::AUTH::INSUFFICIENT_SCOPE
      - ERR::AUTH::INVALID_TOKEN
      - ERR::AUTH::INVALID_CREDENTIALS
      - ERR::AUTH::ENGINE_NOT_ENTITLED
      - ERR::REQUEST::INVALID
      - ERR::REQUEST::MISSING_PARAMETER
      - ERR::REQUEST::INVALID_PARAMETER
      - ERR::REQUEST::INCOMPATIBLE_FLAGS
      - ERR::REQUEST::NOT_FOUND
      - ERR::REQUEST::BEYOND_RETENTION
      - ERR::REQUEST::CONFLICT
      - ERR::REQUEST::PAYLOAD_TOO_LARGE
      - ERR::SECURITY::SSRF_BLOCKED
      - ERR::SECURITY::URL_BLOCKED
      - ERR::SECURITY::INVALID_URL
      - ERR::SESSION::NOT_FOUND
      - ERR::SESSION::EXPIRED
      - ERR::SESSION::RELEASED
      - ERR::SESSION::BUSY
      - ERR::SESSION::STATE_CORRUPT
      - ERR::LIMIT::RATE_LIMITED
      - ERR::LIMIT::CONCURRENCY_EXCEEDED
      - ERR::LIMIT::QUOTA_EXCEEDED
      - ERR::LIMIT::MAX_COST_EXCEEDED
      - ERR::LIMIT::SESSIONS_EXCEEDED
      - ERR::UPSTREAM::TIMEOUT
      - ERR::UPSTREAM::DNS_FAILED
      - ERR::UPSTREAM::TLS_FAILED
      - ERR::UPSTREAM::CONNECTION_RESET
      - ERR::UPSTREAM::TOO_MANY_REDIRECTS
      - ERR::UPSTREAM::ERROR
      - ERR::UPSTREAM::CHALLENGE
      - ERR::PROXY::EXHAUSTED
      - ERR::PROXY::UNREACHABLE
      - ERR::PROXY::AUTH_FAILED
      - ERR::PROXY::RATE_LIMITED
      - ERR::ENGINE::RENDER_FAILED
      - ERR::ENGINE::UNAVAILABLE
      - ERR::EXTRACT::FAILED
      - ERR::EXTRACT::INVALID_RULES
      - ERR::INTERNAL::ERROR
      - ERR::INTERNAL::UNAVAILABLE
      x-spicrawl-errors:
        ERR::AUTH::MISSING_KEY:
          status: 401
          retryable: false
          title: No API key supplied
        ERR::AUTH::INVALID_KEY:
          status: 401
          retryable: false
          title: API key not recognised
        ERR::AUTH::REVOKED_KEY:
          status: 401
          retryable: false
          title: API key has been revoked
        ERR::AUTH::EXPIRED_KEY:
          status: 401
          retryable: false
          title: API key has expired
        ERR::AUTH::FORBIDDEN:
          status: 403
          retryable: false
          title: Not permitted for this organization
        ERR::AUTH::INSUFFICIENT_SCOPE:
          status: 403
          retryable: false
          title: API key lacks the required scope
        ERR::AUTH::INVALID_TOKEN:
          status: 401
          retryable: false
          title: Session token is invalid or expired
        ERR::AUTH::INVALID_CREDENTIALS:
          status: 401
          retryable: false
          title: Email or password is incorrect
        ERR::AUTH::ENGINE_NOT_ENTITLED:
          status: 403
          retryable: false
          title: The organization's plan does not include this engine
        ERR::REQUEST::INVALID:
          status: 400
          retryable: false
          title: Request could not be understood
        ERR::REQUEST::MISSING_PARAMETER:
          status: 400
          retryable: false
          title: A required parameter is missing
        ERR::REQUEST::INVALID_PARAMETER:
          status: 400
          retryable: false
          title: A parameter has an invalid value
        ERR::REQUEST::INCOMPATIBLE_FLAGS:
          status: 400
          retryable: false
          title: Incompatible flag combination
        ERR::REQUEST::NOT_FOUND:
          status: 404
          retryable: false
          title: Resource not found
        ERR::REQUEST::BEYOND_RETENTION:
          status: 410
          retryable: false
          title: Beyond the request-log retention window
        ERR::REQUEST::CONFLICT:
          status: 409
          retryable: false
          title: Resource already exists
        ERR::REQUEST::PAYLOAD_TOO_LARGE:
          status: 413
          retryable: false
          title: Request body is too large
        ERR::REQUEST::CAPABILITY_UNSUPPORTED:
          status: 400
          retryable: false
          title: The chosen engine cannot do what the request asks
        ERR::SECURITY::SSRF_BLOCKED:
          status: 400
          retryable: false
          title: Target resolves to a private address
        ERR::SECURITY::URL_BLOCKED:
          status: 400
          retryable: false
          title: Target URL is blocked by policy
        ERR::SECURITY::INVALID_URL:
          status: 400
          retryable: false
          title: Target URL is not a valid http(s) URL
        ERR::SESSION::NOT_FOUND:
          status: 404
          retryable: false
          title: No such session
        ERR::SESSION::EXPIRED:
          status: 410
          retryable: false
          title: Session has expired and its context was purged
        ERR::SESSION::RELEASED:
          status: 410
          retryable: false
          title: Session was released and its context was purged
        ERR::SESSION::BUSY:
          status: 409
          retryable: true
          title: Session is in use by a running task
        ERR::SESSION::STATE_CORRUPT:
          status: 500
          retryable: false
          title: Stored session context could not be read
        ERR::LIMIT::RATE_LIMITED:
          status: 429
          retryable: true
          title: Rate limit exceeded
        ERR::LIMIT::CONCURRENCY_EXCEEDED:
          status: 429
          retryable: true
          title: Concurrency limit exceeded
        ERR::LIMIT::QUOTA_EXCEEDED:
          status: 402
          retryable: false
          title: Credit quota exhausted
        ERR::LIMIT::MAX_COST_EXCEEDED:
          status: 400
          retryable: false
          title: Request would exceed max_cost
        ERR::LIMIT::SESSIONS_EXCEEDED:
          status: 429
          retryable: true
          title: Too many live sessions
        ERR::UPSTREAM::TIMEOUT:
          status: 504
          retryable: true
          title: Target did not respond in time
        ERR::UPSTREAM::DNS_FAILED:
          status: 502
          retryable: true
          title: Target hostname could not be resolved
        ERR::UPSTREAM::TLS_FAILED:
          status: 502
          retryable: true
          title: TLS handshake with the target failed
        ERR::UPSTREAM::CONNECTION_RESET:
          status: 502
          retryable: true
          title: Target closed the connection
        ERR::UPSTREAM::TOO_MANY_REDIRECTS:
          status: 502
          retryable: false
          title: Too many redirects
        ERR::UPSTREAM::ERROR:
          status: 502
          retryable: true
          title: Target request failed
        ERR::UPSTREAM::CHALLENGE:
          status: 502
          retryable: true
          title: Target served a bot challenge
        ERR::PROXY::EXHAUSTED:
          status: 503
          retryable: true
          title: No healthy proxy exit available
        ERR::PROXY::UNREACHABLE:
          status: 502
          retryable: false
          title: Supplied proxy is unreachable
        ERR::PROXY::AUTH_FAILED:
          status: 502
          retryable: false
          title: Proxy rejected our credentials
        ERR::PROXY::RATE_LIMITED:
          status: 502
          retryable: true
          title: Proxy exit is rate limited
        ERR::ENGINE::RENDER_FAILED:
          status: 502
          retryable: true
          title: The page could not be rendered
        ERR::ENGINE::UNAVAILABLE:
          status: 503
          retryable: true
          title: No engine capacity available
        ERR::EXTRACT::FAILED:
          status: 502
          retryable: false
          title: The document could not be extracted
        ERR::EXTRACT::INVALID_RULES:
          status: 400
          retryable: false
          title: The extraction rules are invalid
        ERR::INTERNAL::ERROR:
          status: 500
          retryable: true
          title: Internal error
        ERR::INTERNAL::UNAVAILABLE:
          status: 503
          retryable: true
          title: Service temporarily unavailable
    Problem:
      type: object
      description: |
        RFC 7807 error body, served as `application/problem+json`. Switch on `code`;
        retry only when `retryable` is true, after `retry_after_seconds`.
      required:
      - type
      - title
      - status
      - code
      - retryable
      - doc_url
      - target_status
      properties:
        type:
          type: string
          format: uri
          description: Link to this code's entry in the error reference.
        title:
          type: string
          description: Short fixed summary of the code. Do not parse it.
        status:
          type: integer
          description: The platform's HTTP status for this response. Not the target site's.
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: What happened on this occurrence, in prose. Useful to show a human; do not parse
            it.
        retryable:
          type: boolean
          description: The server's own verdict on whether the same request can succeed on retry. Prefer
            it to guessing from `status`.
        doc_url:
          type: string
          format: uri
          description: Documentation for this code, including how to fix it.
        request_id:
          type: string
          description: ULID of the failed request. Pass it to `GET /v1/requests/{id}` for the full trace.
        instance:
          type: string
          description: Request path that produced the error.
        target_status:
          type:
          - integer
          - 'null'
          description: The target site's HTTP status when the failure came from the site, otherwise null.
        retry_after_seconds:
          type: integer
          minimum: 0
          description: Mirrors the `Retry-After` header for clients that read only the body.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal decisions the platform made for you, such as a flag ignored by proxy
            precedence.
        diagnostics:
          $ref: '#/components/schemas/ProblemDiagnostics'
    ProblemDiagnostics:
      type: object
      description: Where the request failed and whether the platform, the proxy or the target was at fault.
      properties:
        failed_at:
          type: string
          description: Name of the stage that failed; always the last row of `timeline`.
        timeline:
          type: array
          description: Stages in order, stopping at the failure.
          items:
            type: object
            required:
            - stage
            - ms
            - ok
            properties:
              stage:
                type: string
                description: Stage name.
              ms:
                type: integer
                description: Time spent in the stage in milliseconds.
              ok:
                type: boolean
                description: False only on the failing stage.
              detail:
                type: string
                description: What happened in the stage.
        attempts:
          type: array
          description: Each execution attempt. Under `mode=auto` these span the escalation ladder.
          items:
            type: object
            required:
            - n
            - outcome
            - ms
            properties:
              n:
                type: integer
                description: Attempt number, from 1.
              engine:
                type: string
                description: Engine this attempt ran on.
              proxy:
                type: string
                description: Redacted exit label or proxy scheme and host. Never contains credentials.
              outcome:
                type: string
                description: How the attempt ended.
              ms:
                type: integer
                description: Attempt duration in milliseconds.
              error_code:
                $ref: '#/components/schemas/ErrorCode'
        budget_ms:
          type: integer
          description: Time budget the request had, in milliseconds. Compare with `elapsed_ms` to tell
            a timeout from a refusal.
        elapsed_ms:
          type: integer
          description: Time actually spent, in milliseconds.
        engine:
          type: string
          description: Engine that served the final attempt.
        proxy:
          type: object
          description: Redacted description of the exit used.
          required:
          - source
          properties:
            source:
              type: string
              description: 'Where the exit came from: `pool`, `custom` or `direct`.'
            endpoint:
              type: string
              description: Exit identifier. Not the exit IP.
            country:
              type: string
              description: Exit country, ISO 3166-1 alpha-2 lowercase.
        hint:
          type: string
          description: The next thing to try, naming the parameter to change. Act on it before retrying
            the same request.
    ScrapeRequest:
      type: object
      additionalProperties: false
      required:
      - url
      description: Body of POST /v1/scrape. Unknown fields (including nested ones) are rejected with 400
        ERR::REQUEST::INVALID_PARAMETER; a wrong JSON type is 400 naming the field. Max body 1 MiB (413).
      properties:
        url:
          type: string
          format: uri
          maxLength: 8192
          description: Target URL; required, must be http or https with a host. A private or reserved
            address fails with 400 ERR::SECURITY::SSRF_BLOCKED at 0 credits.
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
          - OPTIONS
          default: GET
          description: HTTP method sent to the target (case-insensitive). There is no request-body parameter,
            so non-GET methods are sent without a body; only GET/HEAD/OPTIONS are retried on transient
            failure and only GET results are cached.
        js_render:
          type: boolean
          default: false
          description: Render in a browser engine (obscura; 3 credits datacenter, 25 residential) so JavaScript
            runs. Required by every browser-only flag unless stealth or mode=auto is set; cannot be combined
            with mode=auto. If omitted, the project's stored default applies.
        stealth:
          type: boolean
          default: false
          description: Coming soon. Render in the hardened camoufox browser, flat 25 credits at any proxy tier; wins
            over js_render when both are set. Cannot be combined with mode=auto or with an engine pin
            other than camoufox; returns 503 ERR::ENGINE::UNAVAILABLE where camoufox is not deployed.
            If omitted, the project's stored default applies.
        impersonate:
          type: boolean
          default: false
          description: 'Fetch tier only: present a real browser TLS/HTTP2 fingerprint to pass passive
            fingerprint checks, at no extra cost and with no JavaScript. Ignored on render engines. POST
            only - the GET form rejects `impersonate` as an unknown query parameter. If omitted, the project''s
            stored default applies.'
        mode:
          type: string
          enum:
          - auto
          description: '`auto` escalates through the available engines (fetch -> obscura) until a rung returns a usable page,
            billing only the rung that succeeded (0 if all fail) while reserving the dearest rung against
            quota. Incompatible with js_render, stealth and engine. If omitted, the project''s stored
            default applies.'
        engine:
          type: string
          enum:
          - fetch
          - obscura
          - camoufox
          - chromium
          description: Engine `camoufox` is coming soon. Pin the execution engine (case-insensitive); disables escalation and is never substituted.
            chromium (8 credits datacenter, 32 residential) is the only engine supporting headless=false;
            screenshots and pdf need camoufox or chromium. An unentitled engine is 403 ERR::AUTH::ENGINE_NOT_ENTITLED,
            an undeployed one 503 ERR::ENGINE::UNAVAILABLE, both at 0 credits. If omitted, the project's
            stored default applies.
        premium_proxy:
          type: boolean
          default: false
          description: 'Coming soon. Use residential exits from the managed pool: fetch 10, obscura 25, chromium 32
            credits (camoufox stays 25). If no residential exit is available the request fails 503 ERR::PROXY::EXHAUSTED
            rather than falling back; ignored (with X-Warning PROXY_FLAG_IGNORED) when `proxy` is set.
            If omitted, the project''s stored default applies.'
        proxy_country:
          type: string
          pattern: ^[A-Za-z]{2}$
          description: Coming soon. ISO 3166-1 alpha-2 exit country (case-insensitive), within the residential pool.
            Requires premium_proxy=true (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise) unless `proxy`
            is set, in which case it is ignored with a warning; an unavailable country is 503 ERR::PROXY::EXHAUSTED,
            never substituted. If omitted, the project's stored default applies.
        proxy:
          type: string
          description: Your own proxy URL (http, https, socks5 or socks5h; credentials in userinfo). Takes
            precedence over premium_proxy/proxy_country and adds 0 proxy credits; loopback hosts are refused
            with 400 ERR::SECURITY::SSRF_BLOCKED. An unreachable proxy fails 502 ERR::PROXY::UNREACHABLE.
        proxy_verify:
          type: boolean
          default: false
          description: Probe the custom `proxy` before spending the engine cost so a dead proxy fails
            fast. Requires `proxy` (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise).
        session_id:
          type: string
          description: Reuse a session's cookies and storage (created via /v1/sessions); the session's
            engine is used and pinning a different engine is 400 ERR::REQUEST::INCOMPATIBLE_FLAGS. Checked
            before any work, at 0 credits and not retryable - an unknown, malformed or other organization's
            id is 404 ERR::SESSION::NOT_FOUND, a released session 410 ERR::SESSION::RELEASED, an expired one
            410 ERR::SESSION::EXPIRED. A successful request increments the session's `usage_count`, sets
            `last_used_at` and slides `expires_at`. Requests with a session are never cached.
        sticky_key:
          type: string
          description: Coming soon. Any string; requests sharing it reuse the same pool exit. Forces a pool exit even
            on deployments whose default is direct egress, so it can fail 503 ERR::PROXY::EXHAUSTED where
            no pool exists.
        wait:
          type: integer
          minimum: 0
          maximum: 30000
          default: 0
          description: 'Milliseconds to wait after load before capture. Browser-only: needs js_render,
            stealth, an engine pin with a browser, or mode=auto, else 400 ERR::REQUEST::INCOMPATIBLE_FLAGS.'
        wait_for:
          type: string
          description: CSS selector to wait for before capture. Browser-only. If it never appears the
            page is returned as it stood with an X-Warning RENDER_DEGRADED; if the render times out waiting
            it fails 504 ERR::UPSTREAM::TIMEOUT - raise wait_for_timeout or fix the selector.
        wait_for_timeout:
          type: integer
          minimum: 0
          maximum: 120000
          default: 0
          description: Milliseconds to wait for `wait_for`; 0 uses the engine default. Requires wait_for
            (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise).
        actions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ScrapeAction'
          description: Ordered browser workflow (click, fill, scroll, ...), validated before anything
            is spent. Browser-only; disables the default image/font blocking and makes the request uncacheable.
            A failed step ends the request at 0 credits unless that step has on_error=skip.
        block_resources:
          type: array
          uniqueItems: false
          items:
            type: string
            enum:
            - none
            - document
            - documents
            - stylesheet
            - stylesheets
            - css
            - image
            - images
            - media
            - font
            - fonts
            - script
            - scripts
            - js
            - xhr
            - fetch
            - websocket
            - websockets
            - other
          description: Subresource classes the browser must not load (plural and short aliases accepted,
            case-insensitive). If omitted, renders block image+font except for screenshot, pdf, actions,
            or a network_capture of images/fonts; an explicit list replaces that default and `none` (alone)
            blocks nothing. Any value other than `none` is browser-only. If omitted, the project's stored
            default applies.
        headless:
          type: boolean
          description: false runs the browser on a real display (1920x1080 screen instead of 800x600);
            only engine=chromium supports it, anything else is 400 ERR::REQUEST::CAPABILITY_UNSUPPORTED
            at 0 credits. Either value requires a browser engine; omit to use the deployment default (headless).
            Headful renders skip the warm pool and add ~1s. If omitted, the project's stored default applies.
        screenshot:
          type: boolean
          default: false
          description: Capture a screenshot; forces the JSON envelope (image base64 under `screenshots`).
            Needs a rasterising engine (camoufox or chromium) - otherwise 400 ERR::REQUEST::CAPABILITY_UNSUPPORTED
            at 0 credits. mode=auto cannot satisfy it (its fetch rung has no rasteriser). If the image
            is not delivered the page is still returned but charged 0.
        screenshot_fullpage:
          type: boolean
          default: false
          description: Capture the full scrollable page. Requires screenshot=true; mutually exclusive
            with screenshot_selector.
        screenshot_selector:
          type: string
          description: CSS selector of the element to capture. Requires screenshot=true; mutually exclusive
            with screenshot_fullpage.
        screenshot_format:
          type: string
          enum:
          - png
          - jpeg
          - jpg
          - webp
          description: Image format; omitted uses the engine default (png). Not validated by the API -
            an unrecognised value silently falls back to the engine default.
        screenshot_quality:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Lossy quality for jpeg/webp; 0 uses the engine default. A value above 0 requires
            screenshot=true.
        custom_headers:
          type: object
          additionalProperties:
            type: string
          description: Headers sent to the target, as name -> string value. Hop-by-hop headers (Connection,
            Keep-Alive, Proxy-Authenticate, Proxy-Authorization, TE, Trailer, Transfer-Encoding, Upgrade,
            Host, Content-Length) are refused with 400 ERR::REQUEST::INVALID_PARAMETER. If omitted, the
            project's stored default applies.
        network_capture:
          allOf:
          - $ref: '#/components/schemas/NetworkCapture'
          description: Record the XHR/fetch responses the page itself made (often cleaner JSON than the
            DOM), returned under `network` in the JSON envelope. Browser-only; no extra credits.
        autoparse:
          type: boolean
          default: false
          description: Harvest the page's own structured metadata (JSON-LD, OpenGraph, Twitter, microdata,
            RDFa, meta, embedded SPA state) into `data`, no selectors needed. Forces the JSON envelope;
            no extra credits; refused on a PDF.
        links:
          type: boolean
          default: false
          description: Return the page's absolute, de-duplicated <a href> targets under `links`. Forces
            the JSON envelope; no extra credits; refused on a PDF. If omitted, the project's stored default
            applies.
        extract:
          allOf:
          - $ref: '#/components/schemas/ScrapeExtract'
          description: 'Selector extraction into `data`: a selector map, or a JSON Schema whose properties
            carry `selector`. Forces the JSON envelope, validated before fetching, no extra credits; mutually
            exclusive with extract_preset. Rules that match nothing are listed in `empty_fields`.'
        extract_preset:
          type: string
          description: Coming soon. Name of a server-side extraction preset. This deployment has no preset store, so
            any value fails with 400 ERR::EXTRACT::INVALID_RULES (at 0 credits, after the fetch); use
            `extract` inline. Mutually exclusive with extract.
        ai_extract:
          allOf:
          - $ref: '#/components/schemas/AIExtract'
          description: Coming soon. Model-driven extraction into `data`; adds 4 credits. Refused with 503 ERR::INTERNAL::UNAVAILABLE
            where no model is configured, and a model failure is 502 ERR::EXTRACT::FAILED at 0 credits.
            Forces the JSON envelope.
        main_content_only:
          type: boolean
          description: true strips nav/footer/aside to the main article; false keeps the whole document.
            Omitted keeps the pipeline default (main-content isolation on for markdown). Applies to markdown/text/cleaned
            output. If omitted, the project's stored default applies.
        include_tags:
          type: array
          items:
            type: string
          description: CSS selectors; keep only matching subtrees before extraction and markdown conversion.
            Applied before exclude_tags and main_content_only.
        exclude_tags:
          type: array
          items:
            type: string
          description: CSS selectors; remove matching elements, applied after include_tags and before
            main_content_only.
        parse_pdf:
          type: boolean
          default: true
          description: When the target returns a PDF and markdown/text is requested, parse it to text.
            false refuses it with 502 ERR::EXTRACT::FAILED (0 credits); response_format=html always returns
            the raw bytes. If omitted, the project's stored default applies.
        response_format:
          type: string
          enum:
          - html
          - markdown
          - text
          - json
          - pdf
          default: html
          description: 'Body shape: html/markdown/text return the document itself, json the envelope,
            pdf a browser-printed PDF (needs camoufox or chromium). extract, autoparse, links, ai_extract,
            network_capture or screenshot override this to the JSON envelope with X-Warning FORMAT_COERCED.
            A non-HTML target (image, binary) requested as markdown/text fails 502 ERR::EXTRACT::FAILED
            at 0 credits. If omitted, the project''s stored default applies.'
        cache:
          type: boolean
          default: true
          description: 'Serve a stored result younger than cache_ttl (Cache-State: hit, 0 credits). Only
            billable successes of GET-method requests without session_id or actions are stored. Set false
            for time-sensitive data; cache=false with cache_ttl>0 is 400 ERR::REQUEST::INCOMPATIBLE_FLAGS.'
        cache_ttl:
          type: integer
          minimum: 0
          default: 172800
          description: Maximum acceptable age of a cached result, in seconds. Default and cap are deployment
            settings (48h by default); larger values are clamped with X-Warning CACHE_TTL_CLAMPED. 0 disables
            caching for this request.
        max_cost:
          type: integer
          minimum: 0
          default: 0
          description: Credit ceiling; 0 means none. Checked against the dearest reachable outcome (the
            top rung under mode=auto) before anything runs, failing 400 ERR::LIMIT::MAX_COST_EXCEEDED
            at 0 credits.
        original_status:
          type: boolean
          default: false
          description: 'On success, use the target''s status as this response''s HTTP status instead of
            200. Leave off unless you need it: it makes a target 404 indistinguishable from an API error
            by status alone.'
        allowed_status_codes:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
          description: Extra target statuses to treat as billable successes (200, 404 and 410 always are).
            Other statuses return the target's body at 0 credits, and under mode=auto trigger escalation.
