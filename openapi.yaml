      - $ref: '#/components/schemas/ScrapeActionSelect'
      - $ref: '#/components/schemas/ScrapeActionScroll'
      - $ref: '#/components/schemas/ScrapeActionEvaluate'
      - $ref: '#/components/schemas/ScrapeActionScreenshot'
    NetworkCapture:
      type: object
      additionalProperties: false
      description: Filters for recording the responses the page fetched. Browser-only.
      properties:
        urls:
          type: array
          items:
            type: string
          description: Substring matches, or anchored regexes when starting with `^`; empty captures every
            response of the selected types.
        resource_types:
          type: array
          items:
            type: string
            enum:
            - document
            - stylesheet
            - image
            - media
            - font
            - script
            - xhr
            - fetch
            - websocket
            - other
          default:
          - xhr
          - fetch
          description: Resource types to record (exact singular names; no aliases). Unknown values are
            400.
        include_bodies:
          type: boolean
          default: true
          description: Include response bodies; false returns url/status/type/timing only, far smaller.
        max_body_bytes:
          type: integer
          minimum: 0
          maximum: 2097152
          default: 1048576
          description: Per-response body cap in bytes; 0 = default. Larger bodies are truncated and flagged
            body_truncated.
        max_responses:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
          description: Maximum responses recorded; 0 = default.
    AIExtract:
      type: object
      additionalProperties: false
      description: Exactly one of `prompt` or `schema` (both is 400 INCOMPATIBLE_FLAGS, neither is 400
        INVALID_PARAMETER). The model reads the page as cleaned markdown; output lands in `data`. +4 credits.
      properties:
        prompt:
          type: string
          minLength: 1
          description: Plain-language description of the data to extract.
        schema:
          type: object
          minProperties: 1
          description: JSON Schema the output must follow.
      oneOf:
      - required:
        - prompt
        not:
          required:
          - schema
      - required:
        - schema
        not:
          required:
          - prompt
    ScrapeExtractRule:
      type: object
      additionalProperties: true
      required:
