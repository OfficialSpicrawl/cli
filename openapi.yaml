                status.
              schema:
                type: integer
            X-Request-Cost:
              description: Price of the engine/proxy tier that ran (0 on a cache hit). Differs from X-Credits-Charged
                exactly when nothing was billed.
              schema:
                type: integer
            X-Credits-Remaining:
              description: Whole credits (rounded down) left in the organization's monthly allowance after
                this request's charge. Read from the enforced counter, so it also counts credits held
                for in-flight work (running batch jobs, open browser sessions). Never negative. Absent
                when the organization has no ceiling or the counter could not be read.
              schema:
                type: integer
                minimum: 0
            X-Engine:
              description: Engine that ran.
              schema:
                type: string
                enum:
                - fetch
                - obscura
                - camoufox
                - chromium
            X-Proxy-Source:
              description: Whose exit carried the request.
              schema:
                type: string
                enum:
                - pool
                - custom
                - direct
            X-Target-Status:
              description: The site's HTTP status. Absent when no document was retrieved.
              schema:
                type: integer
            X-Proxy-Endpoint:
              description: Identifier of the pool exit that served (not an IP). Absent for custom and
                direct exits.
              schema:
                type: string
            X-Final-Url:
              description: URL after redirects, when known.
              schema:
                type: string
            X-RateLimit-Limit:
              description: Requests per second allowed for this key/org.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Tokens left in the bucket.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Seconds until retry is allowed; only sent when the limiter imposed a wait.
              schema:
                type: integer
            Concurrency-Limit:
              description: Concurrent in-flight requests allowed for the organization.
              schema:
                type: integer
            Concurrency-Remaining:
              description: Concurrent slots left.
              schema:
                type: integer
            Cache-State:
              description: Result-cache outcome.
              schema:
                type: string
                enum:
                - hit
                - miss
                - bypass
            X-Warning:
              description: 'Repeated, one per advisory, formatted `CODE: message`. Codes: PROXY_FLAG_IGNORED,
                FORMAT_COERCED, CACHE_TTL_CLAMPED, ENGINE_SUBSTITUTED, RENDER_DEGRADED, ESCALATED.'
              schema:
                type: string
          content:
            application/json:
