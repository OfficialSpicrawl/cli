                proxy_country:
                  type: string
                  pattern: '^[a-z]{2}$'
                proxy_region:
                  type: string
                sticky_key:
                  type: string
                  pattern: '^[A-Za-z0-9-]{2,64}$'
                session_ttl:
                  type: integer
                  minimum: 60
                  maximum: 900
                headless:
                  type: boolean
      responses:
        '200':
          description: 'The connect URL, sent with Cache-Control no-store.'
          content:
            application/json:
              schema:
                type: object
                required: [url, path, expires_at, expires_in, single_use]
                properties:
                  url:
                    type: string
                    examples:
                    - wss://api.spicrawl.com/v1/browser?proxy_country=de&token=wbt_Q2hhbmdlTWVJbkEtVGVzdC1Ub2tlbi1FeGFtcGxlLVZhbHVlMDE
                  path:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  expires_in:
                    type: integer
                    examples:
                    - 60
                  single_use:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/requests:
    get:
      tags:
      - Requests
      operationId: requestsList
      summary: List recent requests in the key's project, or in every project of its organization
      description: |
        Per-request records from the ephemeral request log, newest first, for the API key's project (every
        key in that project, not only this key). With `all_projects=true` and a key carrying the `read`
        scope, the records of every project in the key's organization (archived projects included), merged
        into one newest-first list under the same cursor. Every record carries `project_id`. Records expire
        after `page.retention_hours`; for durable billing totals use `GET /v1/usage`. Totals here will not
        match an invoice.

        Pitfalls:
        - Page with BOTH `before` and `before_id` copied from `page.next_before` / `page.next_before_id`.
          `before` alone re-returns the boundary record and cannot break same-millisecond ties; `before_id`
          alone does not bound the page at all.
        - A cursor older than the retention window returns 410 `ERR::REQUEST::BEYOND_RETENTION`. Restart
          from the first page.
        - An empty `data` means "nothing in the last `retention_hours`", not "never". Check `retained_since`.
        - A page can be shorter than `limit` while `has_more` is true. Keep paging until `has_more` is false.
        - `limit` is clamped silently: missing, non-numeric or non-positive gives 50, above 200 gives 200.
        - `all_projects=true` without the `read` scope is 403 `ERR::AUTH::INSUFFICIENT_SCOPE`, naming `read`.
          The default list needs no scope beyond a valid key. The organization is always the key's own;
          no parameter names another.
        - Keep `all_projects=true` on every page of one walk: the cursor pages whichever list it came from.
      security:
      - bearerAuth: []
      x-spicrawl-scope: none
      parameters:
      - name: all_projects
        in: query
        description: When `true`, lists every project in the key's organization instead of only the key's
          project. Requires the `read` scope (403 `ERR::AUTH::INSUFFICIENT_SCOPE` without it). Only `true` and
          `false` are accepted; any other value is 400.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: limit
        in: query
        description: Page size. Never refused; invalid values fall back to 50 and values above 200 become
          200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: status
        in: query
        description: Only records with exactly this status. Not validated; an unknown value returns an
          empty page. Ignored when `only_errors=true`.
        schema:
          type: string
          enum:
          - success
          - failed
          - timeout
          - blocked
          - rejected
          - cancelled
      - name: only_errors
        in: query
        description: When exactly `true`, returns every record whose status is not `success`. Any other
          value (including `1`) is treated as false.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: before
        in: query
        description: Cursor time, RFC 3339 with optional fractional seconds, copied from `page.next_before`.
          Must be sent together with `before_id`.
        schema:
          type: string
          format: date-time
      - name: before_id
        in: query
        description: Cursor id, copied from `page.next_before_id`. Must be sent together with `before`.
        schema:
          type: string
          examples:
          - 01M0FK1EP2E7FBMWAR7W10SMXW
      responses:
        '200':
          description: One page of request records plus the retention facts needed to interpret it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogPage'
              examples:
                page:
                  value:
                    data:
                    - id: 01M0FK1EP2E7FBMWAR7W10SMXW
                      created_at: '2026-09-22T12:41:22.183Z'
                      project_id: 01M0FJZ8Q3W4B5T8J2V9K6X1RD
                      engine: chromium
                      status: blocked
                      http_status: 403
                      error_code: ERR::UPSTREAM::CHALLENGE
                      error_detail: The target served an Akamai challenge page.
                      attempts: 2
                      url: https://shop.example.com/p/123
                      url_host: shop.example.com
                      proxy:
                        source: pool
                        endpoint_id: dc-198.51.100.7-6646
                        requested_tier: datacenter
                        requested_country: de
                        country: de
                        endpoints:
                        - dc-198.51.100.9-6646
                        - dc-198.51.100.7-6646
                      spans:
                        admission_ms: 2
                        dispatch_ms: 4731
                        worker_ms: 4718
                        queue_ms: 0
                        engine_ms: 4706
                        upstream_ms: null
                        extract_ms: null
                        total_ms: 4735
                      blocked:
                        vendor: akamai
                        signal: '"Access Denied"'
                        rule: body_marker
                      bytes_in: 18231
                      credits_micro: 0
                    page:
                      retention_hours: 24
                      retained_since: '2026-09-21T12:45:00Z'
                      has_more: true
                      next_before: '2026-09-22T12:41:22.183Z'
                      next_before_id: 01M0FK1EP2E7FBMWAR7W10SMXW
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`all_projects=true` from a key without the `read` scope (`ERR::AUTH::INSUFFICIENT_SCOPE`,
            naming `read`).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/requests/{id}:
    get:
      tags:
      - Requests
      operationId: requestsGet
      summary: Get one request record
      description: |
        Returns one record by request id (the `X-Request-Id` / `request_id` you received). Scoped to the key's
        organization: a record made in the key's own project needs no scope, and one made in another project
        of the organization needs the `read` scope, the same rule as `all_projects=true` on the list (this
        route takes no parameter for it). Expired, never-existed, another project's without `read`, and
        unreadable records all answer 404 `ERR::REQUEST::NOT_FOUND`; a malformed id answers 400.
      security:
      - bearerAuth: []
      x-spicrawl-scope: none
      parameters:
      - name: id
        in: path
        required: true
        description: Request id, as a 26-character ULID or a UUID.
        schema:
          type: string
          examples:
          - 01M0FK1EP2E7FBMWAR7W10SMXW
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/usage:
    get:
      tags:
      - Usage
      operationId: usageGet
      summary: Billed usage over a window, broken down by one dimension
      description: |
        Reads the durable billing rollup (`usage_daily`) for the key's organization. `totals` is the billed
        quantity; `groups` plus `unattributed` equals `totals` per metric. If they do not, a `warnings` entry
        says so; trust `totals`.

        Pitfalls:
        - `to` is EXCLUSIVE. One day 2026-08-01 is `from=2026-08-01&to=2026-08-02`. Days are UTC.
        - Default window: the last 30 UTC days including today. Maximum 400 days per call.
        - A key filed under a project is pinned to it: `project_id` naming another project is 404, and
          omitting it reads only the key's project. A key with no project may name any project in the org.
        - `group_by=key` returns a different body, `UsageByKey`: per API key (`key_id`, `name`, `prefix`,
          `project_id`, `revoked`), counters per metric per UTC day, from the per-key rollup. Requests made
          without a key (the dashboard) are not in it. No caller IPs or countries are returned.
        - `group_by=engine`: the per-engine table is often empty today, so the whole quantity may appear in
          `unattributed` with a warning. That is missing attribution, not missing usage.
        - `group_by=feature` cannot attribute `requests`, `engine_ms`, byte counters or the non-batch part of
          `credits`; they land in `unattributed`. Batch spend is attributed to the `batch` group.
        - `credits` is total credit spend, batch items included, in every grouping.
        - Check `stale_seconds`: a large value means the rollup is behind.
      security:
      - bearerAuth: []
      x-spicrawl-scope: read
      parameters:
      - name: from
        in: query
        description: First UTC day, inclusive, `YYYY-MM-DD`. Defaults to 29 days before today.
        schema:
          type: string
          format: date
          examples:
          - '2026-08-01'
      - name: to
        in: query
        description: End UTC day, EXCLUSIVE, `YYYY-MM-DD`. Defaults to tomorrow. Must be after `from`,
          and the span must be at most 400 days.
        schema:
          type: string
          format: date
          examples:
          - '2026-09-01'
      - name: group_by
        in: query
        description: Breakdown dimension.
        schema:
          type: string
          enum:
          - day
          - project
          - engine
          - feature
          - key
          default: day
      - name: project_id
        in: query
        description: Restrict to one project in the organization (ULID or UUID). Omitted means every project.
        schema:
          type: string
      - name: metrics
        in: query
        description: Comma-separated metric names to include. Omitted means all. An unknown name is refused
          with 400.
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UsageMetric'
      responses:
        '200':
          description: The breakdown.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/UsageBreakdown'
                - $ref: '#/components/schemas/UsageByKey'
              examples:
                byKey:
                  value:
                    period:
                      start: '2026-09-01'
                      end: '2026-09-03'
                      days: 2
                      bounds: '[start, end)'
                    group_by: key
                    keys:
                    - key_id: 01J9Z3K6V1Q2W3E4R5T6Y7U8I9
                      name: ci-pipeline
                      prefix: spicrawl_live_a1b2
                      project_id: 01J9Z3K6V1Q2W3E4R5T6Y7U8P0
                      revoked: false
                      days:
                      - day: '2026-09-01'
                        metrics:
                          requests: 120
                          client_cli: 120
                          feature_screenshot: 4
                      totals:
                        requests: 120
                        client_cli: 120
                        feature_screenshot: 4
                byDay:
                  value:
                    period:
                      start: '2026-09-01'
                      end: '2026-09-03'
                      days: 2
                      bounds: '[start, end)'
                    group_by: day
                    groups:
                    - key: '2026-09-01'
                      metrics:
                        requests: 1200
                        credits: 4800000000
                    - key: '2026-09-02'
                      metrics:
                        requests: 800
                        credits: 3100000000
                    totals:
                      requests: 2000
                      credits: 7900000000
                    unattributed:
                      requests: 0
                      credits: 0
                    usage_as_of: '2026-09-22T11:55:00Z'
                    stale_seconds: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/usage/summary:
    get:
      tags:
      - Usage
      operationId: usageSummary
      summary: Current-period usage against the plan allowance
      description: |
        Usage for the current period, with credit allowance arithmetic in micro-credits (1 credit =
        1000000), plus the monthly allowance the API enforces. Takes no parameters.

        Every organization has a monthly credit allowance (1,000 credits unless an operator set a
        different limit for the organization), counted per allowance month: from 00:00 UTC on the day of
        the month the organization was created to the same day of the next month. When it is used up,
        requests are refused with 402 `ERR::LIMIT::QUOTA_EXCEEDED` until `allowance.resets_at`.

        - `allowance` is the number the API enforces, and the one to show as "credits left":
          `allowance.remaining_micro`. Its `used_micro` is the enforcement counter, which includes
          credits currently HELD for in-flight work (an open browser session holds its whole
          `session_ttl` price, a batch job holds the price of its unfinished items) as well as credits
          spent. It is omitted when the deployment has no allowance counter, or when the counter could
          not be read (a warning then says so).
        - `credits` is METERED usage from the usage rollup for the period: spent credits only, batch
          items included, but not credits held for work still running. It can therefore be lower than
          `allowance.used_micro`.
        - With no subscription (the usual case), the organization is on the free plan: `plan` names the
          current `free` plan, `plan.subscription_status` is `none`, `plan.period_source` is
          `allowance_month`, and `credits.included_micro` is the enforced monthly limit. The period is
          the allowance month, not a billing period.
        - With a subscription, `period_source` is `subscription`, the period is the billing period and
          `credits.included_micro` is the plan's included credits. The enforced limit is still
          `allowance.limit_micro`.

        Pitfalls:
        - There is no money figure. Overage pricing is computed only at invoicing.
        - `unattributed` usually equals `metrics` today because per-engine attribution is not populated.
      security:
      - bearerAuth: []
      x-spicrawl-scope: read
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
              examples:
                subscribed:
                  value:
                    period:
                      start: '2026-09-01'
                      end: '2026-10-01'
                      days: 30
                      bounds: '[start, end)'
                    period_elapsed_days: 21
                    plan:
                      code: growth
                      name: Growth
                      version: 3
                      subscription_status: active
                      period_source: subscription
                    credits:
                      included_micro: 100000000000
                      used_micro: 42500000000
                      remaining_micro: 57500000000
                      overage_micro: 0
                      overage_micro_cents_per_credit: 90000
                      used_basis_points: 4250
                    allowance:
                      limit_micro: 1000000000
                      limit_credits: 1000
                      limit_source: default
                      unlimited: false
                      used_micro: 430000000
                      remaining_micro: 570000000
                      window_start: '2026-09-14T00:00:00Z'
                      resets_at: '2026-10-14T00:00:00Z'
                    metrics:
                      requests: 10630
                      credits: 42500000000
                      engine_ms: 18200000
                    unattributed:
                      requests: 10630
                      credits: 42500000000
                      engine_ms: 18200000
                    usage_as_of: '2026-09-22T11:55:00Z'
                    stale_seconds: 300
                no_subscription:
                  summary: No subscription (the free allowance)
                  value:
                    period:
                      start: '2026-09-14'
                      end: '2026-10-14'
                      days: 30
                      bounds: '[start, end)'
                    period_elapsed_days: 8
                    plan:
                      code: free
                      name: Free
                      version: 1
                      subscription_status: none
                      period_source: allowance_month
                    credits:
                      included_micro: 1000000000
                      used_micro: 212000000
                      remaining_micro: 788000000
                      overage_micro: 0
                      overage_micro_cents_per_credit: 0
                      used_basis_points: 2120
                    allowance:
                      limit_micro: 1000000000
                      limit_credits: 1000
                      limit_source: default
                      unlimited: false
                      used_micro: 260000000
                      remaining_micro: 740000000
                      window_start: '2026-09-14T00:00:00Z'
                      resets_at: '2026-10-14T00:00:00Z'
                    metrics:
                      requests: 2410
                      credits: 212000000
                    unattributed:
                      requests: 2410
                      credits: 212000000
                    usage_as_of: '2026-09-22T11:55:00Z'
                    stale_seconds: 300
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/usage/reconciliation:
    get:
      tags:
      - Usage
      operationId: usageReconciliation
      summary: Report drift between billed usage and the request log for one day
      description: |
        Compares billed usage for one UTC day with usage re-derived from the Postgres request log. Report only;
        nothing is repaired (`repairable` is always false).

        Pitfalls:
        - Read `interpretation` before `drift`. In the current deployment the Postgres request log is usually
          empty (`request_log_rows: 0`), so every billed row shows as `absent_from_request_log`. That is not
          evidence of overbilling.
        - Defaults to yesterday (UTC); today is still accumulating.
      security:
      - bearerAuth: []
      x-spicrawl-scope: read
      parameters:
      - name: day
        in: query
        description: UTC day to reconcile, `YYYY-MM-DD`. Defaults to yesterday.
        schema:
          type: string
          format: date
          examples:
          - '2026-09-21'
      responses:
        '200':
          description: The drift report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReconciliation'
              examples:
                emptyLog:
                  value:
                    day: '2026-09-21'
                    drift:
                    - project_id: 01J9Y0000000000000000PROJ1
                      metric: credits
                      stored_qty: 3100000000
                      observed_qty: 0
                      delta: -3100000000
                      action: absent_from_request_log
                    request_log_rows: 0
                    interpretation: The Postgres request log holds no rows for this day, so there is nothing
                      to re-derive usage from and every billed row is reported as `absent_from_request_log`.
                      ...
                    repairable: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/workers:
    get:
      tags:
      - Fleet
      operationId: fleetListWorkers
      summary: List the deployment's workers, grouped by kind
      description: |
        Reports deployment shape: for each worker kind (`browser`, `egress`, `extract`, `batch`, always in that
        order and always all four), how many workers are publishing, how many are ready, and each one's load.
        Contains no tenant data. Any valid key may call it.

        Use it to explain queuing or `ERR::ENGINE::UNAVAILABLE`: a kind with `present: 0` or `ready: 0` cannot
        take work. `last_seen_ms` is an age; a large value means the worker stopped publishing.
      security:
      - bearerAuth: []
      x-spicrawl-scope: none
      responses:
        '200':
          description: The fleet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetList'
              examples:
                fleet:
                  value:
                    kinds:
                    - kind: browser
                      present: 1
                      ready: 1
                      workers:
                      - worker_id: browser-7f9c
                        kind: browser
                        capacity: 4
                        in_flight: 1
                        free_slots: 3
                        ready: true
                        task_stream: tasks:browser
                        address: 192.0.2.21:50052
                        last_seen_ms: 812
                    - kind: egress
                      present: 0
                      ready: 0
                      workers: []
                    - kind: extract
                      present: 0
                      ready: 0
                      workers: []
                    - kind: batch
                      present: 0
                      ready: 0
                      workers: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /healthz:
    get:
      tags:
      - Health
      operationId: healthLive
      summary: Liveness
      description: |
        Outside `/v1` and unauthenticated. Answers 200 whenever the process can serve HTTP, and checks no
        dependency, so it stays 200 during a database or worker outage. Use `/readyz` to decide whether to
        send traffic.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
              examples:
                ok:
                  value:
                    status: ok
  /readyz:
    get:
      tags:
      - Health
      operationId: healthReady
      summary: Readiness
      description: |
        Outside `/v1` and unauthenticated. Checks Postgres, Redis (when configured) and each configured
        data-plane worker (`fetch`, `extract`, `render`) with a 2-second budget, and reports whether the
        process is draining. Returns 503 with the same body shape (not a Problem) when any check fails. Stop
        routing to this instance on 503; do not restart it.
      security: []
      responses:
        '200':
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                ready:
                  value:
                    status: ready
                    checks:
                      postgres: ok
                      redis: ok
                      fetch: ok
                      extract: ok
                      render: ok
        '503':
          description: Not ready. `checks` names what failed. This body is plain JSON, not a Problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                notReady:
                  value:
                    status: not_ready
                    checks:
                      postgres: ok
                      redis: unreachable
                      render: ok
                draining:
                  value:
                    status: not_ready
                    checks:
                      accepting: draining
                      postgres: ok
                      redis: ok
