      tags:
      - Sessions
      operationId: sessionsGet
      summary: Get one session's metadata
      description: |
        Returns the session's metadata and a non-secret context summary. Never returns cookies, and does not
        slide the TTL, so it is safe to poll. Released and expired sessions are still returned (200) with
        their `status`; only a deleted or unknown session is 404. A malformed id also answers 404
        `ERR::SESSION::NOT_FOUND`.
