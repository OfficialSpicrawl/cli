  /v1/batch:
    post:
      tags:
      - Batch
      operationId: batchCreate
      summary: Submit a batch job
      description: |
        Queues many URLs as one asynchronous job and returns `202` with the job object immediately.
        Supply either `urls` (same settings for every URL) or `items` (one object per URL, with per-item
        overrides), never both. Every /v1/scrape parameter at the top level (except `url`) is a job-wide
        default; an item's own value wins over it, including an explicit `false`.

        Order of work: validate and route every item (a bad item N fails the whole submission with
        `Item N:` in `detail`), reserve the dearest possible cost of the whole job against the monthly
        credit allowance, write the manifest, enqueue. Nothing is charged at submission
        (`X-Credits-Charged: 0`); items are charged individually, only on success, by the worker.

        Next step: poll `GET /v1/batch/{batchID}` (the `status_url`) until `status` is
        `completed`, `failed` or `cancelled`, then page `GET /v1/batch/{batchID}/results`.
        Results are readable while the job runs, too.

        Not idempotent: there is no Idempotency-Key. Resubmitting the same body creates a second job that
        is scraped and billed again. If a `202` carries a warning saying items were not all dispatched,
        do NOT resubmit — the worker's recovery sweep dispatches them.

        Limits: request body 1 MiB (1,048,576 bytes); at most 10,000 items per call; job-level
        parameters at most 65,536 bytes serialised; each item's overrides plus `external_id` at most
        8,192 bytes serialised.
      security:
      - bearerAuth: []
      x-spicrawl-scope: batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
            examples:
              urlsShorthand:
                summary: Same settings for every URL
                value:
                  name: nightly-catalog
                  urls:
                  - https://example.com/products/1
                  - https://example.com/products/2
                  js_render: true
                  premium_proxy: true
                  proxy_country: us
                  concurrency: 20
              itemsWithOverrides:
                summary: Per-item overrides and correlation ids
                value:
                  items:
                  - url: https://example.com/1
                  - url: https://example.com/2
                    external_id: sku-42
                    js_render: false
                  js_render: true
                  max_attempts: 5
                  failure_threshold: 100
                  webhook_endpoint_id: 01J9Z6V0Q8M4K2T7R3N5B1C9XA
      responses:
        '202':
          description: |
            Accepted. The manifest is durably stored and the job is `queued`. Read `warnings`: it reports a
            clamped `concurrency` and any dispatch shortfall. Poll `status_url` next.
          headers:
            X-Request-Cost:
              description: Whole credits reserved for this job (its dearest possible cost, rounded down).
                Equals `estimated_credits`.
              schema:
                type: integer
                minimum: 0
            X-Credits-Charged:
              description: Always `0` on this endpoint. Submitting is not billable; items are charged
                by the worker on success.
              schema:
                type: integer
                const: 0
            X-Credits-Remaining:
              description: Whole credits (rounded down) left in the organization's monthly allowance after
                this job's hold, i.e. with the whole `estimated_credits` counted as used. Absent when the
                organization has no ceiling or the counter could not be read.
              schema:
                type: integer
                minimum: 0
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
      - Batch
      operationId: batchList
      summary: List batch jobs
      description: |
        Lists this API key's project's jobs, newest first (`submitted_at` desc, then id desc). Jobs of other
        projects in the organization are not visible to this key. Each entry is the full job object with progress.
        To page, pass `next_cursor` back as `cursor`; when `next_cursor` is absent there are no more jobs.
      security:
      - bearerAuth: []
      x-spicrawl-scope: batch
