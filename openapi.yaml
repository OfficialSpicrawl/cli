      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Exclusive.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: The workspace's usage.
          content:
            application/json:
              schema:
                type: object
                required: [external_user_id, period, totals, rows]
                properties:
                  external_user_id: {type: string}
                  period: {type: object}
                  totals:
                    $ref: '#/components/schemas/PartnerUsageTotals'
                  rows:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/partner/wallet:
    get:
      tags:
      - Partner
      operationId: partnerWallet
      summary: The partner balance
      description: |
        The partner's ACCOUNT credits for the current monthly window: the same credits its own requests use. `funded`
        is the monthly allowance plus the extra credits available, `spent` is what the month has drawn (its own requests,
        its users' draws and the credits it gave), and `balance` and `available` are what is left. `credit_line` is always
        0. `resets_at` is when the window ends. `unlimited` is true for a partner with no ceiling; its figures then read 0.
        The `*_credits` fields are the same values in whole credits.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      responses:
        '200':
          description: The balance.
          content:
            application/json:
              schema:
                type: object
                required: [funded_micro, credit_line_micro, spent_micro, balance_micro, available_micro, resets_at, unlimited]
                properties:
                  funded_micro: {type: integer, format: int64}
                  credit_line_micro: {type: integer, format: int64, description: Always 0.}
                  spent_micro: {type: integer, format: int64}
                  balance_micro: {type: integer, format: int64}
                  available_micro: {type: integer, format: int64, description: The same as balance_micro. Kept for existing clients.}
                  funded_credits: {type: integer, format: int64}
                  credit_line_credits: {type: integer, format: int64}
                  spent_credits: {type: integer, format: int64}
                  balance_credits: {type: integer, format: int64}
                  available_credits: {type: integer, format: int64}
                  resets_at: {type: string, format: date-time, description: When the monthly window ends and the account's credits reset (UTC).}
                  unlimited: {type: boolean, description: True for a partner with no monthly ceiling. The figures read 0.}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/partner/settings:
    patch:
      tags:
      - Partner
      operationId: partnerSettingsPatch
      summary: Change the partner's settings
      description: |
        Sets `allow_account_spend`. When it is `true`, workspaces on the partner's Free plan may draw the partner's
        account credits (after their free and given credits). Workspaces on a paid plan always may, so the setting does
        not affect them. Takes effect within about 5 seconds.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_account_spend]
              properties:
                allow_account_spend: {type: boolean}
      responses:
        '200':
          description: The setting as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [allow_account_spend]
                properties:
                  allow_account_spend: {type: boolean}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/partner/workspaces:
    get:
      tags:
      - Partner
      operationId: partnerWorkspacesList
      summary: List the partner's workspaces
      description: |
        Pages the workspaces this partner provisioned. Items carry no `api_key`. Each item has its usage figures
        (see `PartnerWorkspace`). `sort=external_user_id` (the default) pages by keyset: `next_after` is present
        when the page is full; pass it as `after`. `sort=wallet_used` orders by the balance spend this window,
        largest first, and pages by `offset`: `next_offset` is present when the page is full. The `wallet_used`
        sort is on usage records, which trail the live figure by about 60 seconds. It is computed over all of the
        partner's workspaces, not only the page, so it is slower than the default sort, and noticeably slower for a
        very large account.

        `q` matches a workspace whose `external_user_id` starts with it (case-sensitive) or whose `display_name`
        starts with it (case-insensitive). It is up to 100 characters with no control characters. There are no
        wildcards: `%`, `_` and `*` match themselves. Other characters match display names only.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      parameters:
      - name: limit
        in: query
        description: Page size, 1 to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after
        in: query
        description: The `next_after` of the previous page. Only with `sort=external_user_id`.
        schema:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]{1,128}$'
      - name: q
        in: query
        description: |
          A prefix of `external_user_id` (case-sensitive) or of `display_name` (case-insensitive). Matches all when
          absent. Up to 100 characters, no control characters.
        schema:
          type: string
          maxLength: 100
      - name: sort
        in: query
        description: '`external_user_id` (default) or `wallet_used` (descending by this window''s balance spend).'
        schema:
          type: string
          enum: [external_user_id, wallet_used]
          default: external_user_id
      - name: offset
        in: query
        description: Rows to skip. Only with `sort=wallet_used`; `next_offset` of the previous page.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: One page of workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerWorkspaceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/partner/workspaces/{external_user_id}:
    parameters:
    - name: external_user_id
      in: path
      required: true
      description: The partner's own id for the end user.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    put:
      tags:
      - Partner
      operationId: partnerWorkspaceProvision
      summary: Provision a workspace, or fetch it and its default key
      description: |
        Creates the workspace for this end user if it does not exist, makes sure it has its default
        API key, and returns that key's plaintext. Calling it again is how the key is read again.

        `201` when this call created the workspace, `200` when it already existed. `created` says which.
        The key is normally the same on every call, but a new one is issued when the stored key has
        expired or can no longer be read, so store whatever the latest call returned. The response is
        sent with `Cache-Control: no-store`.

        A partner may create at most a fixed number of workspaces per UTC day. Past that, a new user is
        `429 ERR::LIMIT::PARTNER_WORKSPACE_LIMIT`. An existing user is never limited.

        A workspace that has been soft-deleted is `409 ERR::REQUEST::CONFLICT` and returns no key: Spicrawl
        support must restore it first. A closed workspace is `409 ERR::REQUEST::CONFLICT` too, with no key;
        closure is terminal.

        Rate limit: this route allows 2 requests per second per partner, with bursts of 20, on top of the
        20-per-second limit every partner route shares.

        The optional body names the tier a new workspace starts on, by id or name. Without it the workspace
        gets the partner's default tier, or no tier when there is none. An existing workspace keeps its tier,
        but an unknown tier is `404` either way. Move a workspace with `PUT .../tier`.

        The optional `display_name` is a label for your own reference. It is optional; use any label you like,
        and avoid personal data you do not need to share. It is applied only when this call creates the workspace:
        an existing workspace keeps its name whatever body you send. Change it with `PATCH`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tier:
                  type: string
                  description: The tier's id or name.
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: |
                    Applied only when this call creates the workspace. Spaces at the ends are trimmed; a blank name is
                    no name. Control characters are refused.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      responses:
        '200':
          description: The workspace already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerWorkspaceProvisioned'
        '201':
          description: The workspace was created by this call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerWorkspaceProvisioned'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: |
            Either the partner's daily allowance of new workspaces is used up (`ERR::LIMIT::PARTNER_WORKSPACE_LIMIT`,
            `Retry-After` runs to the next 00:00 UTC), or the partner's rate limit for this route is exceeded
            (`ERR::LIMIT::RATE_LIMITED`, `Retry-After` in seconds).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags:
      - Partner
      operationId: partnerWorkspaceGet
      summary: Read one workspace
      description: Returns the workspace without its `api_key`, with its usage figures (`wallet_used`, `free_used`, `own_credits`, `window_resets_at`). `own_credits` is null when the balance cannot be read at that moment. Use `PUT` to read the key.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerWorkspaceDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Partner
      operationId: partnerWorkspaceSetDisplayName
      summary: Set or clear a workspace's display name
      description: |
        Sets the `display_name` of the workspace, or clears it. The body has one field: a string, or `null`.
        A blank name after spaces at the ends are trimmed clears it, the same as `null`. A name is 1 to 100
        characters after trimming, and a control character is refused. Any other field is refused. Returns the
        workspace, without its `api_key`. Works on a closed workspace too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              additionalProperties: false
              properties:
                display_name:
                  type: [string, 'null']
                  maxLength: 100
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerWorkspaceDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
