        Marks the session `released` and deletes its stored cookies and storage in the same transaction. The
        browser worker's own copy of the session state in object storage is deleted too. The
        session row stays readable via `GET /v1/sessions/{id}`; the context does not. This is not
        "release the lease, keep the state": the state is destroyed. A later `/v1/scrape` with this
        `session_id` is refused with 410 `ERR::SESSION::RELEASED` at 0 credits.

