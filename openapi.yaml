          description: Body was cut at max_body_bytes; truncated JSON is delivered as base64.
        body:
          description: Parsed JSON body, present when the response was complete, valid JSON with a JSON
            content type.
        body_base64:
          type: string
          contentEncoding: base64
          description: Any other body.
        encoding:
          type: string
          const: base64
          description: Present with body_base64.
    ScrapeDiagnostics:
      type: object
      description: 'Present on a successful mode=auto escalation: which rungs were tried and why they
        were abandoned.'
      properties:
        failed_at:
          type: string
        timeline:
          type: array
          items:
            type: object
            required:
            - stage
            - ms
            - ok
            properties:
              stage:
                type: string
              ms:
                type: integer
              ok:
                type: boolean
              detail:
                type: string
        attempts:
          type: array
          items:
            type: object
            required:
            - n
            - outcome
            - ms
            properties:
              n:
                type: integer
              engine:
                type: string
              proxy:
                type: string
              outcome:
                type: string
              ms:
                type: integer
              error_code:
                type: string
        budget_ms:
          type: integer
        elapsed_ms:
          type: integer
        engine:
          type: string
        proxy:
          type: object
          properties:
            source:
              type: string
            endpoint:
              type: string
            country:
              type: string
        hint:
          type: string
    ScrapeEnvelope:
      type: object
      required:
      - url
      - final_url
      - status
      - content
      - headers
      - truncated
      - credits
      - engine
      - proxy_source
      - warnings
      description: Returned for response_format=json, or whenever extract/autoparse/links/ai_extract/network_capture/screenshot
        is set.
      properties:
        url:
          type: string
          description: The requested URL.
        final_url:
          type: string
          description: URL after redirects; may be empty.
        status:
          type: integer
          description: The TARGET's HTTP status (not this response's). Anything other than 200/404/410
            or allowed_status_codes was charged 0.
        content:
          type: string
          description: 'The page in the requested rendering: html (cleaned html if extraction produced
            one), markdown or text.'
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: The target's response headers.
        truncated:
          type: boolean
          description: The target body exceeded the size cap and was cut.
        credits:
          type: integer
          minimum: 0
          description: Credits charged for this request (same as X-Credits-Charged).
        engine:
          type: string
          enum:
          - fetch
          - obscura
          - camoufox
          - chromium
          description: Engine that produced the page.
        proxy_source:
          type: string
          enum:
          - pool
          - custom
          - direct
        warnings:
          type: array
          items:
            type: string
          description: Human-readable warnings (messages only; codes are on X-Warning).
        data:
          type: object
          description: Output of extract, autoparse or ai_extract.
        empty_fields:
          type: array
          items:
            type: string
          description: Extraction rules that matched nothing - the usual sign a selector broke.
        links:
          type: array
          items:
            type: string
            format: uri
          description: Present (possibly empty) when links=true.
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/ScrapeScreenshot'
          description: Delivered images only; undelivered ones are reported in warnings and charged 0.
        network:
          type: array
          items:
            $ref: '#/components/schemas/ScrapeNetworkResponse'
          description: Captured responses when network_capture was set.
        diagnostics:
          $ref: '#/components/schemas/ScrapeDiagnostics'
    BatchJobStatus:
      type: string
      enum:
      - queued
      - running
      - paused
      - cancelling
      - completed
      - failed
      - cancelled
      description: |
        Job lifecycle. `queued` → `running` → `completed` | `failed`; cancel moves a live job to `cancelling`, then the worker
        moves it to `cancelled` once in-flight items drain. `paused` is an operator state (no public endpoint pauses).
        Terminal: `completed`, `failed`, `cancelled` — stop polling. A terminal job returns to `queued` after batchRetry.
    BatchItemStatus:
      type: string
      enum:
      - succeeded
      - failed
      - cancelled
      - skipped
      description: Terminal item status on a result line. `succeeded` is the only status that carries
        credits or a body. Items still `queued`/`running` are never returned.
    BatchScrapeParams:
      type: object
      description: |
        The /v1/scrape request object as accepted by batch, minus `url`. Field names, types and validation are exactly
        ScrapeRequest's (enforced by a parity test); each property below references it. Every item is merged as
        job-level value, overridden by the item's value (an explicit `false` on an item wins), with the project's
        dashboard defaults underneath both. Validation happens for every item at submission.

        IMPORTANT — what the current batch worker actually executes: only `js_render`, `stealth`, `premium_proxy`,
        `proxy_country`, `proxy` (always with verify off) and, on rendered items, `block_resources`. Requests are always
        GET and the payload is the raw page (HTML, or the decoded body for non-rendered fetches). Every other field is
        accepted, validated and counted in the credit reservation for parity with /v1/scrape, but has no effect on the
        batch result. If you need extraction, screenshots, actions, sessions or a non-HTML `response_format`, use /v1/scrape.
      properties:
        method:
          $ref: '#/components/schemas/ScrapeRequest/properties/method'
          description: Validated as on /v1/scrape, but the batch worker always sends GET. Leave unset.
        js_render:
          $ref: '#/components/schemas/ScrapeRequest/properties/js_render'
          description: Render the page with the obscura browser engine. Honoured by the batch worker.
            Default false (or the project default).
        stealth:
          $ref: '#/components/schemas/ScrapeRequest/properties/stealth'
          description: Coming soon. Render with the camoufox anti-detection engine; takes precedence over `js_render`.
            Honoured by the batch worker. Default false (or the project default).
        impersonate:
          $ref: '#/components/schemas/ScrapeRequest/properties/impersonate'
          description: Validated and priced as on /v1/scrape; not applied by the batch worker.
        mode:
          $ref: '#/components/schemas/ScrapeRequest/properties/mode'
          description: Validated and priced as on /v1/scrape (`auto` reserves the dearest tier). The batch
            worker does not escalate; it runs fetch unless `js_render` or `stealth` is set. Cannot be
            combined with `engine` (400 INCOMPATIBLE_FLAGS).
        engine:
          $ref: '#/components/schemas/ScrapeRequest/properties/engine'
          description: |
            Engine `camoufox` is coming soon.
            Engine pin. On batch only `fetch`, `obscura`, `camoufox` are allowed; `chromium` is rejected with 400
            INVALID_PARAMETER (use /v1/scrape for chromium). Also 400 INCOMPATIBLE_FLAGS for: `mode=auto` plus any pin;
            `stealth=true` with a pin other than camoufox; `js_render=true` with `fetch`; `screenshot=true` with `fetch`
            or `obscura`. A pin the plan does not include is 403 (plans whose entitlements cannot be read allow only
            fetch and obscura). To be sure the worker renders, set `js_render` (obscura) or `stealth` (camoufox) rather
            than relying on the pin alone.
        premium_proxy:
          $ref: '#/components/schemas/ScrapeRequest/properties/premium_proxy'
          description: Coming soon. Use the residential proxy pool instead of datacenter. Honoured by the batch worker;
            ignored when `proxy` is set.
        proxy_country:
          $ref: '#/components/schemas/ScrapeRequest/properties/proxy_country'
          description: Coming soon. Exit country for pool proxies. Honoured by the batch worker.
        proxy:
          $ref: '#/components/schemas/ScrapeRequest/properties/proxy'
          description: Your own proxy URL; wins over the pool flags. Honoured by the batch worker (without
            proxy verification).
        proxy_verify:
          $ref: '#/components/schemas/ScrapeRequest/properties/proxy_verify'
          description: Validated as on /v1/scrape; the batch worker always sends the custom proxy with
            verification off.
        session_id:
          $ref: '#/components/schemas/ScrapeRequest/properties/session_id'
          description: Validated as on /v1/scrape; batch items do not run inside a session. Not applied.
        sticky_key:
          $ref: '#/components/schemas/ScrapeRequest/properties/sticky_key'
          description: Coming soon. Validated as on /v1/scrape; not applied by the batch worker.
        wait:
          $ref: '#/components/schemas/ScrapeRequest/properties/wait'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        wait_for:
          $ref: '#/components/schemas/ScrapeRequest/properties/wait_for'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        wait_for_timeout:
          $ref: '#/components/schemas/ScrapeRequest/properties/wait_for_timeout'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        actions:
          $ref: '#/components/schemas/ScrapeRequest/properties/actions'
          description: Validated as on /v1/scrape; the batch worker does not run browser actions.
        block_resources:
          $ref: '#/components/schemas/ScrapeRequest/properties/block_resources'
          description: Resource classes to block while rendering. Honoured on rendered items only; unset
            blocks images and fonts, `none` blocks nothing, a list replaces the default. Falls back to
            the project default when unset.
        headless:
          $ref: '#/components/schemas/ScrapeRequest/properties/headless'
          description: Validated as on /v1/scrape (the project default for headless is NOT merged on batch).
            `false` needs chromium, which batch cannot pin. Not applied by the batch worker.
        screenshot:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot'
          description: Validated and priced as on /v1/scrape; the batch worker returns no screenshot.
            With `engine` fetch/obscura it is a 400.
        screenshot_fullpage:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot_fullpage'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        screenshot_selector:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot_selector'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        screenshot_format:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot_format'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        screenshot_quality:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot_quality'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        custom_headers:
          $ref: '#/components/schemas/ScrapeRequest/properties/custom_headers'
          description: Validated as on /v1/scrape; the batch worker does not send custom headers.
        autoparse:
          $ref: '#/components/schemas/ScrapeRequest/properties/autoparse'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        links:
          $ref: '#/components/schemas/ScrapeRequest/properties/links'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        network_capture:
          $ref: '#/components/schemas/ScrapeRequest/properties/network_capture'
          description: Validated as on /v1/scrape (see NetworkCapture); not applied by the batch worker.
        extract:
          $ref: '#/components/schemas/ScrapeRequest/properties/extract'
          description: Validated as on /v1/scrape; the batch worker returns the raw page, not extracted
            fields.
        extract_preset:
          $ref: '#/components/schemas/ScrapeRequest/properties/extract_preset'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        ai_extract:
          $ref: '#/components/schemas/ScrapeRequest/properties/ai_extract'
          description: Validated as on /v1/scrape (see AIExtract); not applied by the batch worker.
        main_content_only:
          $ref: '#/components/schemas/ScrapeRequest/properties/main_content_only'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        include_tags:
          $ref: '#/components/schemas/ScrapeRequest/properties/include_tags'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        exclude_tags:
          $ref: '#/components/schemas/ScrapeRequest/properties/exclude_tags'
          description: Validated as on /v1/scrape; not applied by the batch worker.
        parse_pdf:
          $ref: '#/components/schemas/ScrapeRequest/properties/parse_pdf'
          description: Validated as on /v1/scrape (default true); not applied by the batch worker.
        response_format:
          $ref: '#/components/schemas/ScrapeRequest/properties/response_format'
          description: Validated as on /v1/scrape, but the batch worker always returns the raw page body
            regardless of this value (no markdown, json, text or pdf conversion).
        cache:
          $ref: '#/components/schemas/ScrapeRequest/properties/cache'
          description: Validated as on /v1/scrape, but on batch it defaults to false (not true) and the
            worker never reads from the cache.
        cache_ttl:
          $ref: '#/components/schemas/ScrapeRequest/properties/cache_ttl'
          description: Validated as on /v1/scrape; `0` does not imply `cache=false` on batch. Not applied
            by the batch worker.
        max_cost:
          $ref: '#/components/schemas/ScrapeRequest/properties/max_cost'
          description: Per-ITEM credit ceiling, checked at submission against the item's dearest outcome
            (400 if exceeded). For a ceiling on the whole run use `credit_budget`.
        original_status:
          $ref: '#/components/schemas/ScrapeRequest/properties/original_status'
          description: Validated as on /v1/scrape; not applied (result lines always carry the target status
            in `http_status`).
        allowed_status_codes:
          $ref: '#/components/schemas/ScrapeRequest/properties/allowed_status_codes'
          description: Validated as on /v1/scrape; not applied. Billing is fixed to target statuses 200,
            404 and 410.
    BatchItem:
      description: |
        One URL of a batch: a /v1/scrape request object (every BatchScrapeParams field plus `url`) and an optional
        `external_id`. Fields set here override the job-level value for this item only. Unknown fields are a 400.
        Run controls (`concurrency`, `priority`, etc.) are not accepted on an item.
      allOf:
      - $ref: '#/components/schemas/BatchScrapeParams'
      type: object
      required:
      - url
      properties:
        url:
          $ref: '#/components/schemas/ScrapeRequest/properties/url'
          description: The target URL for this item, validated exactly as /v1/scrape's `url` (http/https,
            SSRF and blocklist checks). Stored up to 8,192 characters.
        external_id:
          type: string
          maxLength: 255
          description: Your correlation id, echoed verbatim on this item's result line and never sent
            to the target. Trimmed of whitespace; empty means none. Not required to be unique.
      unevaluatedProperties: false
    BatchCreateRequest:
      description: |
        Body of POST /v1/batch (and of POST /v1/batch/{batchID}/items). Exactly one of `urls` or `items` must be non-empty.
        Top-level BatchScrapeParams fields are job-wide defaults. A top-level `url` is rejected with 400 — put targets in
        `urls` or `items[].url`. Unknown fields are a 400. Must be ≤ 1 MiB; ≤ 10,000 targets.
      allOf:
      - $ref: '#/components/schemas/BatchScrapeParams'
      type: object
      properties:
        name:
          type: string
          description: Free-text label shown on the job object and in the dashboard. No uniqueness; omit
            for none.
        urls:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            format: uri
          description: Shorthand list of targets that all use the job-level settings. Mutually exclusive
            with `items` (both → 400 INCOMPATIBLE_FLAGS; neither → 400 MISSING_PARAMETER). Order defines
            `seq` (0-based).
        items:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/BatchItem'
          description: Long form, one object per target with optional per-item overrides and `external_id`.
            Mutually exclusive with `urls`. Order defines `seq` (0-based).
        concurrency:
          type: integer
          default: 10
          description: Max items of this job in flight at once. Values below 1 become 1; values above
            50 are clamped to 50 and reported in the job's `warnings` (not an error).
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
          description: Scheduling priority relative to your other jobs. Outside 0-1000 is a 400.
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Attempts per item before it is marked failed (only retryable failures are re-attempted).
            Outside 1-10 is a 400.
        failure_threshold:
          type: integer
          format: int64
          minimum: 1
          description: Abort the job as `failed` once this many items have failed. Omit to never abort
            early. 0 or negative is a 400.
        credit_budget:
          type: integer
          minimum: 1
          description: Ceiling on the WHOLE run in whole credits; the worker stops charging work beyond
            it. Omit to use the job's projected cost; an `open` job then has no ceiling, because its
            projection covers only the items it was submitted with. Stored as given in
            `params.credit_budget_micro`. 0 or negative is a 400. Different from `max_cost`,
            which is per item.
        webhook_endpoint_id:
          type: string
          description: Id of a webhook endpoint registered for this organization; it receives the job
            object when the job finishes (notify-only — fetch results yourself). A value that is not a
            valid id is a 400; blank is treated as absent.
        open:
          type: boolean
          default: false
          description: Keep the job accepting more items via POST /v1/batch/{batchID}/items. An open job
            never completes on its own — call POST /v1/batch/{batchID}/close when done. Total across appends
            is capped at 100,000 items.
      unevaluatedProperties: false
      examples:
      - name: catalog-2026-09-22
        items:
        - url: https://example.com/products/1
        - url: https://example.com/products/2
          external_id: sku-42
          stealth: true
        js_render: true
        proxy_country: us
        concurrency: 20
        max_attempts: 3
    BatchJobProgress:
      type: object
      description: Live counters for the job, read from sharded counters. `completed` = succeeded + failed
        + cancelled + skipped; `remaining` = total − completed.
      required:
      - total
      - completed
      - succeeded
      - failed
      - cancelled
      - skipped
      - remaining
      - percent_complete
      - credits_charged
      - credits_charged_micro
      - bytes
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: Items in the job (same as `total_items`). Grows when items are appended to an open
            job.
        completed:
          type: integer
          format: int64
          minimum: 0
          description: Items in any terminal status.
        succeeded:
          type: integer
          format: int64
          minimum: 0
          description: Items that succeeded. Only these are charged.
        failed:
          type: integer
          format: int64
          minimum: 0
          description: Items that failed after all attempts. Re-run them with POST /v1/batch/{batchID}/retry.
        cancelled:
          type: integer
          format: int64
          minimum: 0
          description: Items not run because the job was cancelled.
        skipped:
          type: integer
          format: int64
          minimum: 0
          description: Items the worker skipped (for example after `failure_threshold` or `credit_budget`
            stopped the run).
        remaining:
          type: integer
          format: int64
          minimum: 0
          description: Items not yet finished.
        percent_complete:
          type: number
          minimum: 0
          maximum: 100
          description: completed / total × 100.
        credits_charged:
          type: integer
          minimum: 0
          description: Credits actually charged so far, whole credits rounded down. Sum over succeeded
            items only. This is the real spend; compare with the job's `estimated_credits` (the hold).
        credits_charged_micro:
          type: integer
          format: int64
          minimum: 0
          description: Same as `credits_charged` in micro-credits (1 credit = 1,000,000). Use this for
            exact accounting.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Total response bytes of finished items.
    BatchJob:
      type: object
      description: |
        The batch job, identical in shape across create, list, get, cancel and close. Poll `status_url` until `status` is
        terminal (`completed`, `failed`, `cancelled`), then read `results_url` before `results_expire_at`.
        There is no `credits_held` field: the hold is `estimated_credits`, the spend is `progress.credits_charged`.
      required:
      - id
      - project_id
      - status
      - status_url
      - results_url
      - params
      - total_items
      - concurrency
      - priority
      - max_attempts
      - estimated_credits
      - estimated_credits_micro
      - progress
      - submitted_at
      properties:
        id:
          type: string
          description: Job id (26-character ULID). Use it in every /v1/batch/{batchID} path.
        project_id:
          type: string
          description: Project the submitting API key belongs to.
        name:
          type: string
          description: The `name` you submitted. Absent when none.
        status:
          $ref: '#/components/schemas/BatchJobStatus'
          description: Current lifecycle state. Keep polling while `queued`, `running`, `paused` or `cancelling`;
            stop at `completed`, `failed` or `cancelled`.
        open:
          type: boolean
          description: Present and true while the job accepts appended items; it will not complete until
            you close it. Absent means closed.
        status_url:
          type: string
          description: 'Relative path to poll: /v1/batch/{id}.'
        results_url:
          type: string
          description: 'Relative path of the JSONL results: /v1/batch/{id}/results.'
        params:
          type: object
          additionalProperties: true
          description: The job-level scrape parameters as stored (your top-level BatchScrapeParams, without
            `url`), plus `credit_budget_micro` — the run ceiling the worker enforces. Always present,
            possibly only `credit_budget_micro`.
        total_items:
          type: integer
          format: int64
          minimum: 0
          description: Number of items in the job. Fixed at submission unless items are appended to an
            open job.
        concurrency:
          type: integer
          minimum: 1
          maximum: 50
          description: Effective per-job concurrency after clamping.
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: Effective priority.
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
          description: Effective attempts per item.
        failure_threshold:
          type: integer
          format: int64
          minimum: 1
          description: Failed-item count that aborts the job. Absent when not set.
        estimated_credits:
          type: integer
          minimum: 0
          description: Credits RESERVED against the monthly allowance at submission — the dearest outcome
            of every item (whole credits, rounded down). It is a hold, not a charge; credits held for
            items that fail, are cancelled or skipped are returned to the monthly allowance within
            about a minute of the item finishing, by a background settler. Succeeded items keep their
            charge. Not increased by appends. Appended items are reserved when they are added, and the
            append's own total is its `X-Request-Cost`. Retrying failed items (`POST
            /v1/batch/{id}/retry`) holds their price again first and is refused with 402 if the
            allowance cannot cover it.
        estimated_credits_micro:
          type: integer
          format: int64
          minimum: 0
          description: Same as `estimated_credits` in micro-credits.
        progress:
          $ref: '#/components/schemas/BatchJobProgress'
          description: Live item counters and the credits actually charged so far.
        submitted_at:
          type: string
          format: date-time
          description: When the job was accepted.
        started_at:
          type: string
          format: date-time
          description: When the first item started. Absent until then.
        finished_at:
          type: string
          format: date-time
          description: When the job reached a terminal status. Cleared again by batchRetry.
        cancel_requested_at:
          type: string
          format: date-time
          description: When a cancel was accepted. The job may still be `cancelling` after this while
            in-flight items drain.
        results_expire_at:
          type: string
          format: date-time
          description: 'Results deadline: submitted_at + 72 h by default. After it, GET .../results answers
            410. Download before this time.'
        error_code:
          type: string
          description: Machine code of a job-level failure (for example the job was aborted). Absent otherwise.
        error_message:
          type: string
          description: Human-readable job-level failure reason.
        warnings:
          type: array
          items:
            type: string
          description: Decisions made on your behalf at submission — a clamped `concurrency`, or items
            not yet handed to the queue (do NOT resubmit in that case). Present only on the create response.
      examples:
      - id: 01J9Z6T3W9E21T5TZARVJRVN5C
        project_id: 01J8X2M4C7Q1H5V9P3R6T8W0YB
        name: catalog-2026-09-22
        status: running
        status_url: /v1/batch/01J9Z6T3W9E21T5TZARVJRVN5C
        results_url: /v1/batch/01J9Z6T3W9E21T5TZARVJRVN5C/results
        params:
          js_render: true
          proxy_country: us
          credit_budget_micro: 8000000
        total_items: 2
        concurrency: 20
        priority: 100
        max_attempts: 3
        estimated_credits: 8
        estimated_credits_micro: 8000000
        progress:
          total: 2
          completed: 1
          succeeded: 1
          failed: 0
          cancelled: 0
          skipped: 0
          remaining: 1
          percent_complete: 50
          credits_charged: 4
          credits_charged_micro: 4000000
          bytes: 326000
        submitted_at: '2026-09-22T06:41:12Z'
        started_at: '2026-09-22T06:41:13Z'
        results_expire_at: '2026-09-25T06:41:12Z'
    BatchJobList:
      type: object
      description: One page of GET /v1/batch.
      required:
      - batches
      properties:
        batches:
          type: array
          items:
            $ref: '#/components/schemas/BatchJob'
          description: Jobs, newest first. Empty array when there are none.
        next_cursor:
          type: string
          description: Present only when more jobs exist. Pass it back verbatim as `cursor`. Absent means
            you have reached the oldest job.
    BatchRetryResponse:
      type: object
      required:
      - job
      - items_reset
      - items_dispatched
      properties:
        job:
          $ref: '#/components/schemas/BatchJob'
          description: The job as it stands after this call. Poll GET /v1/batch/{batchID} for further
            progress.
        items_reset:
          type: integer
          minimum: 0
          description: Failed items reset to queued. 0 means nothing had failed and nothing changed.
        items_dispatched:
          type: integer
          minimum: 0
          description: Of those, how many reached the dispatch queue now. The rest are recovered by the
            worker's sweep.
    BatchAppendResponse:
      type: object
      required:
      - job
      - items_added
      - items_dispatched
      properties:
        job:
          $ref: '#/components/schemas/BatchJob'
          description: The job as it stands after this call. Poll GET /v1/batch/{batchID} for further
            progress.
        items_added:
          type: integer
          minimum: 1
          description: Items written to the job. Their `seq` values continue from the previous `total_items`.
        items_dispatched:
          type: integer
          minimum: 0
          description: Of those, how many reached the dispatch queue now. The rest are recovered by the
            worker's sweep; do not re-append them.
    BatchResultError:
      type: object
      description: Why an item did not succeed. Same code catalogue as /v1/scrape errors.
      required:
      - code
      - retryable
      properties:
        code:
          type: string
          description: Stable machine code, e.g. ERR::UPSTREAM::TIMEOUT or ERR::PROXY::EXHAUSTED. Switch
            on this, not on text.
          examples:
          - ERR::UPSTREAM::TIMEOUT
        retryable:
          type: boolean
          description: True when running the item again may succeed. Use POST /v1/batch/{batchID}/retry
            to re-run all failed items.
    BatchResultBody:
      type: object
      description: |
        The item's payload read from the job's stitched result file. Bounded: 524,288 bytes per item, 2,097,152 bytes per
        page, spent in `seq` order. Exactly one of these applies: full `content`; `truncated` (a prefix); `omitted`
        (no content, page budget spent); `unavailable` (the file could not be read).
      required:
      - bytes
      properties:
        content:
          type: string
          description: The worker's stored `result` value as raw JSON text (currently a JSON string literal
            holding the page HTML, so JSON-decode it once to get the HTML). May be a byte prefix when
            `truncated`, in which case it is not valid JSON.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Full size of the stored payload in bytes, before any truncation. Compare with the
            length of `content`. 0 when `unavailable`.
        truncated:
          type: boolean
          description: 'True when `content` is only a prefix: the payload exceeded 512 KiB, or the page''s
            remaining 2 MiB budget. Request this seq alone (cursor just before it, limit=1) to get up
            to 512 KiB.'
        omitted:
          type: boolean
          description: True when no content was included because the page's 2 MiB budget was already spent.
            Request a smaller `limit`, or resume with a cursor just before this seq.
        unavailable:
          type: string
          description: Why the result file could not be read at all (the same reason is set on every line
            of the page). Report it or retry later; not a problem with the item itself.
    BatchResultLine:
      type: object
      description: One line of the JSONL results stream — one finished item. Same field names as the worker's
        stitched result file.
      required:
      - seq
      - url
      - status
      - attempts
      - credits_micro
      - bytes
      - duration_ms
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: 0-based position in submission order. Stable; use it to resume and for GET .../tasks/{seq}/content.
        external_id:
          type: string
          description: The `external_id` you supplied for this item. Absent when none.
        url:
          type: string
          description: The target URL as submitted.
        status:
          $ref: '#/components/schemas/BatchItemStatus'
          description: The item's terminal status. Only `succeeded` carries a body and credits; for `failed`,
            read `error`.
        attempts:
          type: integer
          minimum: 0
          description: How many times this item was tried (not reset by retry).
        http_status:
          type: integer
          description: The TARGET site's HTTP status, not the API's. Absent when no response was received.
            A 404 here is a successful scrape of a missing page.
        request_id:
          type: string
          description: Id of the underlying request; look it up in request history for diagnostics.
        credits_micro:
          type: integer
          format: int64
          minimum: 0
          description: Micro-credits charged for this item (1 credit = 1,000,000). Always 0 unless `status`
            is `succeeded`; billable target statuses are 200, 404 and 410.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Response size recorded for this item.
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          description: Wall-clock time spent on the item's final attempt, in ms. 0 when not recorded.
        result_ref:
          type: string
          description: Storage pointer for a per-item payload. Currently never populated (the worker writes
            one file per job); ignore it.
        result:
          $ref: '#/components/schemas/BatchResultBody'
          description: The payload inline. Absent while the job is still running (no stitched file yet),
            when the deployment has no object storage, or when this item has no stored payload (typically
            non-succeeded items).
        result_url:
          type: string
          format: uri
          description: Pre-signed download link (valid 2 h) for this item's payload. Only present when
            `result_ref` is, so currently absent.
        error:
          $ref: '#/components/schemas/BatchResultError'
          description: Present when the item failed and a machine code was recorded. Absent on success.
        finished_at:
          type: string
          format: date-time
          description: When the item reached its terminal status.
      examples:
      - seq: 1
        external_id: sku-42
        url: https://example.com/products/2
        status: succeeded
        attempts: 1
        http_status: 200
        request_id: 01J9Z7A1B2C3D4E5F6G7H8J9KA
        credits_micro: 4000000
        bytes: 326000
        duration_ms: 1840
        result:
          content: '"<!doctype html><html><head><title>Product 2</title>…"'
          bytes: 326002
        finished_at: '2026-09-22T06:41:14Z'
    SessionEngine:
      type: string
      enum:
      - fetch
      - obscura
      - chromium
      - camoufox
      description: Engine a session is pinned to for its whole life. Scrapes on the session run on this
        engine; `fingerprint` is only valid with `camoufox`.
    SessionCreateRequest:
      type: object
      additionalProperties: false
      description: Body of `POST /v1/sessions`. All fields optional; unknown fields are refused with 400.
      properties:
        engine:
          allOf:
          - $ref: '#/components/schemas/SessionEngine'
          description: Engine `camoufox` is coming soon. Engine to pin. Case-insensitive. Omitted means the first of `obscura`, `chromium`
            that this deployment runs, else `fetch`. Choose explicitly if you need a browser-only feature
            such as localStorage.
        ttl_seconds:
          type: integer
          minimum: 30
          default: 1800
          description: Sliding lifetime in seconds. Omitted or 0 means 1800, reduced to the organization
            maximum with a warning if that is lower. Values above the organization maximum (default 604800,
            i.e. 7 days) are refused with 400 naming the real maximum.
        sticky_key:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,62}[A-Za-z0-9]$
          description: Coming soon. Pins the exit IP across the session. Letters, digits and hyphens, not starting
            or ending with a hyphen. Omitted means derived from the session id (still pinned). Must be
            unique among active sessions in the project. Cannot be combined with `rotate_ip`.
        region_pool:
          type: string
          maxLength: 64
          description: Coming soon. Regional exit pool to draw from. Trimmed; longer than 64 characters is refused.
        rotate_ip:
          type: boolean
          default: false
          description: Coming soon. Keep the cookie jar but let the exit IP change between requests. Use for many-page
            crawls; avoid for replayed logins, which get challenged on a moving IP. Refused together with
            `sticky_key`.
        premium_proxy:
          type: boolean
          default: false
          description: Coming soon. Use the residential tier instead of datacenter. Same meaning as on `/v1/scrape`.
        proxy_country:
          type: string
          pattern: ^[A-Za-z]{2}$
          description: 'Coming soon. ISO 3166-1 alpha-2 exit country, case-insensitive. Requires `premium_proxy: true`,
            otherwise 400 `ERR::REQUEST::INCOMPATIBLE_FLAGS`.'
        fingerprint:
          type:
          - object
          - 'null'
          description: Camoufox fingerprint pin, stored verbatim. A non-empty object with any engine other
            than `camoufox` is refused with 400. `null` and `{}` count as absent.
        domain_scores:
          type: object
          description: Seed per-domain health, keyed by lowercase registrable domain (e.g. `example.com`).
            Scores must be non-negative. Above 64 entries, the least useful (unblocked, lowest score,
            oldest) are evicted rather than refused.
          additionalProperties:
            $ref: '#/components/schemas/SessionDomainScore'
        session_context:
          allOf:
          - $ref: '#/components/schemas/SessionContext'
          description: Initial cookies and storage, e.g. an existing login or the `session_context` from
            a previous `GET /v1/sessions/{id}/context`. Serialised size limit 1 MiB (413). Omitted means
            an empty context.
    Session:
      type: object
      description: A session as every session endpoint reports it. Never contains cookies.
      required:
      - id
      - project_id
      - engine
      - status
      - sticky_key
      - proxy
      - created_at
      - last_used_at
      - expires_at
      - usage_count
      - context
      properties:
        id:
          type: string
          description: Session id (26-character ULID). Pass it as `session_id` on `/v1/scrape`.
          examples:
          - 01J9ZQ4M7R3T8VX2K5N6P0B1CD
        project_id:
          type: string
          description: Project the session belongs to (the creating key's project).
        engine:
          $ref: '#/components/schemas/SessionEngine'
        status:
          type: string
          enum:
          - active
          - released
          - expired
          description: Derived from the clock, not a stored flag. `active` sessions can be used; `released`
            and `expired` ones have no context and cannot be revived. Create a new session.
        sticky_key:
          type: string
          description: Exit pin in use. The lowercase session id when you did not set one; empty string
            when `rotate_ip` was set.
        proxy:
          $ref: '#/components/schemas/SessionProxy'
        created_at:
          type: string
          format: date-time
          description: Creation time, RFC 3339 UTC.
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last time a successful scrape used the session. Null means never used.
        expires_at:
          type: string
          format: date-time
          description: Current expiry. Each successful scrape moves it to that time + the session's
            `ttl_seconds` (never earlier than it was, never past `hard_expires_at`). After it passes the
            context is purged.
        hard_expires_at:
          type: string
          format: date-time
          description: Fixed ceiling set at creation from the organization's maximum TTL. Plan a re-login
            before this time. Omitted only for legacy rows.
        released_at:
          type: string
          format: date-time
          description: When the session was released. Present only on released sessions.
        usage_count:
          type: integer
          minimum: 0
          description: Number of successful scrapes that have used the session. Failed scrapes and
            `/context` reads do not count.
        context:
          oneOf:
          - $ref: '#/components/schemas/SessionContextSummary'
          - type: 'null'
          description: Size summary of the stored context. Null once the session is not active (the context
            has been purged).
        retired:
          type: string
          enum:
          - expired
          - usage_exhausted
          - explicit
          description: Why a worker took this session out of service. Absent while usable. A retired session
            should be replaced.
        domain_scores:
          type: object
          description: Per-domain block evidence the workers maintain. Omitted when empty.
          additionalProperties:
            $ref: '#/components/schemas/SessionDomainScore'
        fingerprint:
          type: object
          description: Camoufox fingerprint, as stored. Omitted when none was set.
        lease:
          $ref: '#/components/schemas/SessionLease'
        warnings:
          type: array
          items:
            type: string
          description: Decisions made on your behalf at creation, e.g. a TTL reduced to the organization
            maximum. Only on the create response; omitted when empty.
    SessionList:
      type: object
      required:
      - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
          description: Sessions on this page, newest first. May be shorter than `limit` (or empty) when
            a `status` filter is applied.
        next_cursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent when the last unfiltered page was
            short, which means there are no more sessions.
    SessionProxy:
      type: object
      required:
      - tier
      description: The session's exit intent. Not an endpoint or IP.
      properties:
        tier:
          type: string
          enum:
          - none
          - datacenter
          - residential
          description: Exit tier. `residential` when created with `premium_proxy`, otherwise `datacenter`.
            `none` is reserved and not produced by the create endpoint.
        country:
          type: string
          description: Lowercase alpha-2 exit country. Omitted when no country was requested.
        region_pool:
          type: string
          description: Regional pool requested at creation. Omitted when none.
    SessionLease:
      type: object
      required:
      - expires_at
      description: Present only while a render holds the single-writer lease. While present, other scrapes,
        release and delete get 409 `ERR::SESSION::BUSY`.
      properties:
        holder:
          type: string
          description: Identifier of the worker holding the lease. Diagnostic only.
        expires_at:
          type: string
          format: date-time
          description: When the lease lapses at the latest. Retry after this time.
    SessionContextSummary:
      type: object
      required:
      - schema_version
      - cookies
      - origins
      - bytes
      description: Non-secret counts describing the stored context.
      properties:
        schema_version:
          type: integer
          description: Stored context format version. Currently 1.
        cookies:
          type: integer
          minimum: 0
          description: Number of cookies stored.
        origins:
          type: integer
          minimum: 0
          description: Distinct origins across local storage, session storage and IndexedDB.
        bytes:
          type: integer
          minimum: 0
          maximum: 1048576
          description: Serialised plaintext size in bytes. The limit is 1048576.
    SessionContext:
      type: object
      description: Everything a browser holds that makes it logged in. Maps and arrays are never null
        in responses.
      properties:
        cookies:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/SessionCookie'
          description: Browser-wide cookie jar. At most 2000.
        local_storage:
          type: object
          maxProperties: 100
          description: Origin (bare `http(s)://host[:port]`, no path) to key/value map. At most 100 origins
            and 1000 keys per origin.
          additionalProperties:
            type: object
            maxProperties: 1000
            additionalProperties:
              type: string
        session_storage:
          type: object
          maxProperties: 100
          description: Same shape and limits as `local_storage`. Many single-page apps keep access tokens
            here; include it when importing a login.
          additionalProperties:
            type: object
            maxProperties: 1000
            additionalProperties:
              type: string
        indexed_db:
          type: object
          maxProperties: 50
          description: Origin to list of IndexedDB databases, each carried verbatim as JSON. At most 50
            origins and 50 databases per origin. Treat as opaque.
          additionalProperties:
            type: array
            maxItems: 50
            items: {}
    SessionCookie:
      type: object
      required:
      - name
      - domain
      description: One cookie in stored spelling (`http_only`, `same_site`), not CDP spelling.
      properties:
        name:
          type: string
          minLength: 1
          description: Cookie name. Required; trimmed.
        value:
          type: string
          description: Cookie value.
        domain:
          type: string
          minLength: 1
          description: Cookie domain; a leading dot (".example.com") makes it domain-wide and is preserved.
            Required.
        path:
          type: string
          default: /
          description: Cookie path. Empty becomes `/`.
        expires:
          type: number
          exclusiveMinimum: 0
          description: Expiry in seconds since the epoch (CDP units). Omit for a session cookie. Zero
            or negative values (such as CDP's -1) are treated as a session cookie and omitted.
        http_only:
          type: boolean
          default: false
          description: HttpOnly flag.
        secure:
          type: boolean
          default: false
          description: Secure flag. Required to be true when `same_site` is `None`.
        same_site:
          type: string
          enum:
          - Strict
          - Lax
          - None
          description: 'SameSite attribute in exact CDP casing. Omit when unset; it is not defaulted.
            `None` without `secure: true` is refused.'
    SessionDomainScore:
      type: object
      required:
      - score
      - good
      - bad
      - last_updated
      - retired
      description: One domain's standing with the session. At a score of 3 or with `retired` true, the
        session is treated as blocked for that domain.
      properties:
        score:
          type: number
          minimum: 0
          description: Error score; rises on failures, decays on successes. Blocked at 3.
        good:
          type: integer
          minimum: 0
          description: Successful requests counted.
        bad:
          type: integer
          minimum: 0
          description: Failed requests counted.
        last_updated:
          type: integer
          format: int64
          description: Last update in Unix milliseconds.
        retired:
          type: boolean
          description: Hard, sticky block for this domain (e.g. a 403 wall). Does not decay; use a new
            session for this domain.
    SessionContextDump:
      type: object
      required:
      - session_id
      - schema_version
      - session_context
      - usage_count
      - created_at
      - last_used_at
      - expires_at
      - warning
      description: Body of `GET /v1/sessions/{id}/context`. `session_context` can be POSTed back to `POST
        /v1/sessions` to clone the session.
      properties:
        session_id:
          type: string
          description: The session id.
        schema_version:
          type: integer
          description: Stored format version. Currently 1.
        session_context:
          $ref: '#/components/schemas/SessionContext'
        fingerprint:
          type:
          - object
          - 'null'
          description: Stored Camoufox fingerprint, or null when none. Omitted only in edge cases.
        domain_scores:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SessionDomainScore'
          description: Per-domain standing, as stored. `{}` when empty.
        retired:
          type: string
          enum:
          - expired
          - usage_exhausted
          - explicit
          description: Why a worker retired the session. Absent while usable.
        usage_count:
          type: integer
          minimum: 0
          description: Scrapes that used the session.
        created_at:
          type: string
          format: date-time
          description: Creation time.
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last use, or null if never used.
        expires_at:
          type: string
          format: date-time
          description: Current sliding expiry.
        warning:
          type: string
          description: Fixed reminder that this context is destroyed on release, delete or expiry. Save
            the object now if you need it later.
    RequestLogEntry:
      type: object
      required:
      - id
      - created_at
      - project_id
      - engine
      - status
      - url
      - proxy
      - spans
      - credits_micro
      description: One API request as recorded in the ephemeral request log. Numeric fields with `omitempty`
        are absent when zero.
      properties:
        id:
          type: string
          description: Request id; the same value as the `X-Request-Id` header and problem `request_id`.
        created_at:
          type: string
          format: date-time
          description: When the request arrived, RFC 3339 with fractional seconds, UTC.
        project_id:
          type: string
          description: Project whose API key made the request. Always present; tells rows apart in an
            `all_projects=true` list.
          examples:
          - 01M0FJZ8Q3W4B5T8J2V9K6X1RD
        engine:
          type: string
          description: Engine that served it, e.g. `fetch`, `obscura`, `chromium`, `camoufox`. May be
            empty for requests refused before an engine was chosen.
        status:
          type: string
          enum:
          - success
          - failed
          - timeout
          - blocked
          - rejected
          - cancelled
          description: Terminal outcome. Only `success` is ever charged.
        http_status:
          type: integer
          description: Target's HTTP status. Absent when no response was received.
        error_code:
          type: string
          description: Problem code returned to the caller, e.g. `ERR::UPSTREAM::CHALLENGE`. Absent on
            success.
        error_detail:
          type: string
          description: The problem detail sentence the caller received (may be truncated). Read it for
            the specific cause.
        attempts:
          type: integer
          minimum: 0
          description: Dispatch attempts including retries. Absent when zero.
        url:
          type: string
          description: Target URL as requested.
        url_host:
          type: string
          description: Target host. Absent when unknown.
        proxy:
          $ref: '#/components/schemas/RequestLogProxy'
        spans:
          $ref: '#/components/schemas/RequestLogSpans'
        blocked:
          $ref: '#/components/schemas/RequestLogBlock'
        bytes_in:
          type: integer
          format: int64
          minimum: 0
          description: Bytes received from the target. Absent when zero.
        bytes_out:
          type: integer
          format: int64
          minimum: 0
          description: Bytes sent to the target. Absent when zero.
        proxy_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes carried through a proxy exit. Absent when zero.
        credits_micro:
          type: integer
          format: int64
          minimum: 0
          description: Credits charged in micro-credits (1 credit = 1000000). Always 0 for non-success
            statuses.
        features:
          type: object
          additionalProperties: true
          description: Features the request used, as recorded by the router. Free-form; absent when none.
    RequestLogProxy:
      type: object
      description: What was requested versus what actually served. Never contains an exit IP or credentials.
        Every field is absent when unknown.
      properties:
        source:
          type: string
          enum:
          - pool
          - custom
          - direct
          description: 'Where the exit came from: the managed pool, your own proxy, or no proxy.'
        endpoint_id:
          type: string
          description: Pool exit id, e.g. `dc-198.51.100.7-6646`. Not an exit IP. Absent for custom and
            direct.
        provider:
          type: string
          description: Proxy provider name.
        requested_tier:
          type: string
          description: Tier the request asked for, e.g. `datacenter`, `residential`.
        requested_country:
          type: string
          description: Country the request asked for.
        country:
          type: string
          description: Country the exit actually served from. Compare with `requested_country` to spot
            geo mismatches.
        sticky:
          type: boolean
          description: True when the exit was pinned. Absent when false.
        reason:
          type: string
          enum:
          - caller_proxy
          - configured_direct
          - no_pool_available
          - session_proxy_unavailable
          description: Why this source was chosen. `session_proxy_unavailable` is a request in a session that records a datacenter exit on a deployment with no proxy pool; it went direct. Absent means unknown (older records), not a default.
        endpoints:
          type: array
          items:
            type: string
          description: Every exit the request touched, in attempt order. Several entries mean retries
            moved exits.
    RequestLogSpans:
      type: object
      required:
      - admission_ms
      - dispatch_ms
      - worker_ms
      - queue_ms
      - engine_ms
      - upstream_ms
      - extract_ms
      - total_ms
      description: Latency breakdown in milliseconds. Every field is always present; null means the stage
        was not measured, which is different from 0. Spans are measured by different processes and do
        not sum to `total_ms`.
      properties:
        admission_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'Ingress to dispatch: auth, rate limit, quota, concurrency. Null when the request
            never reached dispatch.'
        dispatch_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Worker round trip as timed by the API, including transport. `dispatch_ms - worker_ms`
            is transport overhead.
        worker_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: The worker's own handler time.
        queue_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Wait for a slot inside the worker. High values mean capacity shortage, not a slow
            page.
        engine_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Engine occupancy, the metered compute. Null on the fetch tier.
        upstream_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Time talking to the target.
        extract_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Extraction time; null when no extraction ran.
        total_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: What the caller experienced inside the handler, excluding writing the body.
    RequestLogBlock:
      type: object
      description: Present only when a bot challenge was detected. Use `vendor` to pick a countermeasure
        (e.g. stealth engine or residential exit).
      properties:
        vendor:
          type: string
          description: Anti-bot vendor, e.g. `akamai`, `cloudflare`.
        signal:
          type: string
          description: Observable marker that triggered detection, so you can confirm it in the response.
        rule:
          type: string
          description: Which detection path fired.
    RequestLogPage:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequestLogEntry'
          description: Records, newest first. Can be shorter than `limit` even when `has_more` is true.
        page:
          $ref: '#/components/schemas/RequestLogPageInfo'
    RequestLogPageInfo:
      type: object
      required:
      - retention_hours
      - retained_since
      - has_more
      properties:
        retention_hours:
          type: integer
          minimum: 1
          description: How long records are kept for this organization (24 by default). An empty page
            means nothing within this window.
        retained_since:
          type: string
          format: date-time
          description: Oldest instant still readable. Anything earlier has expired.
        has_more:
          type: boolean
          description: True when more records may exist. Continue with the next_before pair; an extra
            empty page is possible.
        next_before:
          type: string
          format: date-time
          description: Send back as `before`. Present only when `has_more` is true.
        next_before_id:
          type: string
          description: Send back as `before_id` together with `before`. Present only when `has_more` is
            true.
    UsageMetric:
      type: string
      enum:
      - requests
      - credits
      - engine_ms
      - bytes_egress
      - bytes_ingress
      - proxy_bytes_dc
      - proxy_bytes_resi
      - extractions
      - ai_extractions
      - batch_items
      - requests_failed
      - requests_timeout
      - feature_actions
      - feature_ai_extract
      - feature_autoparse
      - feature_extract
      - feature_extract_preset
      - feature_js_render
      - feature_links
      - feature_network_capture
      - feature_pdf
      - feature_proxy_country
      - feature_proxy_custom
      - feature_screenshot
      - feature_session
      - client_cli
      - client_mcp
      - client_sdk
      - client_other
      description: Usage metric name. `requests_failed`/`requests_timeout` count failed and timed-out
        requests, `feature_*` count requests that used a feature, `client_*` count requests by client
        surface (CLI, MCP, SDK, other). Billing metric name. `credits` is in micro-credits and is total
        credit spend, batch items included; `engine_ms` in milliseconds; byte metrics in bytes; the rest
        are counts. New metrics may appear as map keys in responses.
    UsagePeriod:
      type: object
      required:
      - start
      - end
      - days
      - bounds
      description: Half-open range of UTC days.
      properties:
        start:
          type: string
          format: date
          description: First day, inclusive.
        end:
          type: string
          format: date
          description: End day, EXCLUSIVE. The last included day is the day before this.
        days:
          type: integer
          minimum: 0
          description: Number of days in the period.
        bounds:
          type: string
          const: '[start, end)'
          description: Always `[start, end)`, a reminder that `end` is exclusive.
    UsageMetricMap:
      type: object
      description: Metric name to quantity. Keys are UsageMetric values.
      additionalProperties:
        type: integer
        format: int64
    UsageGroup:
      type: object
      required:
      - key
      - metrics
      properties:
        key:
          type: string
          description: 'Bucket key: a `YYYY-MM-DD` day, a project id, an engine name, or a feature (`extract`,
            `ai_extract`, `proxy_datacenter`, `proxy_residential`, `batch`). Groups are sorted by key.'
        label:
          type: string
          description: Human label for engine groups (e.g. `Chromium`). Absent for other dimensions and
            unknown engines.
        metrics:
          $ref: '#/components/schemas/UsageMetricMap'
    UsageByKey:
      type: object
      required:
      - period
      - group_by
      - keys
      description: '`GET /v1/usage?group_by=key`. Only the caller''s organization''s keys, and only the
        key''s own project for a project-scoped key. The dashboard route `GET /v1/orgs/{orgID}/usage?group_by=key`
        returns the same `keys` array with inclusive `from`/`to` dates instead of `period`.'
      properties:
        period:
          $ref: '#/components/schemas/UsagePeriod'
        group_by:
          type: string
          enum:
          - key
        keys:
          type: array
          items:
            type: object
            required:
            - key_id
            - name
            - prefix
            - project_id
            - revoked
            - days
            - totals
            properties:
              key_id:
                type: string
              name:
                type: string
              prefix:
                type: string
                description: Display prefix of the key, never the secret.
              project_id:
                type: string
              revoked:
                type: boolean
              days:
                type: array
                items:
                  type: object
                  required:
                  - day
                  - metrics
                  properties:
                    day:
                      type: string
                      format: date
                    metrics:
                      $ref: '#/components/schemas/UsageMetricMap'
              totals:
                $ref: '#/components/schemas/UsageMetricMap'
    UsageBreakdown:
      type: object
      required:
      - period
      - group_by
      - groups
      - totals
      - unattributed
      - usage_as_of
      - stale_seconds
      properties:
        period:
          $ref: '#/components/schemas/UsagePeriod'
        group_by:
          type: string
          enum:
          - day
          - project
          - engine
          - feature
          - key
          description: The dimension used.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/UsageGroup'
          description: Buckets. Can be empty while `totals` is non-zero (e.g. `group_by=engine` without
            attribution data).
        totals:
          allOf:
          - $ref: '#/components/schemas/UsageMetricMap'
          description: Billed quantities for the window. Authoritative; use these, not the sum of groups.
        unattributed:
          allOf:
          - $ref: '#/components/schemas/UsageMetricMap'
          description: Part of each total the groups do not explain. Always has an entry for every metric
            in `totals` (0 for `day` and `project`).
        usage_as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: Freshness of the newest rollup row in the window. Null when the window has no rows.
        stale_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Age of `usage_as_of` in seconds. Null when there are no rows (not "fresh"). Large
            values mean the rollup is behind.
        warnings:
          type: array
          items:
            type: string
          description: Caveats a chart would otherwise hide, such as missing engine attribution or a breakdown
            that does not reconcile. Omitted when empty.
    UsagePlan:
      type: object
      required:
      - code
      - name
      - version
      - subscription_status
      - period_source
      properties:
        code:
          type: string
          description: Plan code. With no subscription, the organization is on the free plan and this is
            `free`.
        name:
          type: string
          description: Plan display name. `Free` (the current free plan's name) when no subscription.
        version:
          type: integer
          description: Plan version. With no subscription, the current free plan's version (0 if the
            deployment has no free plan row).
        subscription_status:
          type: string
          description: Subscription status, e.g. `active`, `trialing`. `none` when no subscription covers
            now.
        period_source:
          type: string
          enum:
          - subscription
          - allowance_month
          description: '`subscription`: the period is the billing period. `allowance_month`: no
            subscription covers now, so the organization is on the free plan''s monthly allowance, and
            the period is its allowance month: from 00:00 UTC on the day of the month the organization
            was created to the same day of the next month. That is the window the allowance is enforced
            over, not a billing period.'
    UsageCredits:
      type: object
      required:
      - included_micro
      - used_micro
      - remaining_micro
      - overage_micro
      - overage_micro_cents_per_credit
      - used_basis_points
      description: Allowance arithmetic over METERED usage, in micro-credits (1 credit = 1000000). No
        money amounts. Metered usage is credits spent, batch items included, and excludes credits held
        for in-flight work; the number the API enforces is `allowance` on the summary.
      properties:
        included_micro:
          type: integer
          format: int64
          minimum: 0
          description: Credits included in the plan for the period. With no subscription, the enforced
            monthly limit (the same as `allowance.limit_micro`).
        used_micro:
          type: integer
          format: int64
          minimum: 0
          description: Credits spent so far in the period, from the usage rollup (`metrics.credits`).
            Includes batch spend.
        remaining_micro:
          type: integer
          format: int64
          minimum: 0
          description: Included minus used, floored at 0.
        overage_micro:
          type: integer
          format: int64
          minimum: 0
          description: Used beyond the allowance, floored at 0. Billed at invoicing. Always 0 with no
            subscription, where requests past the limit are refused instead.
        overage_micro_cents_per_credit:
          type: integer
          format: int64
          minimum: 0
          description: Overage price per credit in micro-cents, from the plan.
        used_basis_points:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          description: Used divided by included, in basis points (10000 = 100%). Can exceed 10000. Null
            when the plan includes no credits.
    UsageSummary:
      type: object
      required:
      - period
      - period_elapsed_days
      - plan
      - credits
      - metrics
      - unattributed
      - usage_as_of
      - stale_seconds
      properties:
        period:
          $ref: '#/components/schemas/UsagePeriod'
        period_elapsed_days:
          type: integer
          minimum: 0
          description: Whole days of the period elapsed, clamped to [0, period.days]. Use it to pace consumption.
        plan:
          $ref: '#/components/schemas/UsagePlan'
        credits:
          oneOf:
          - $ref: '#/components/schemas/UsageCredits'
          - type: 'null'
          description: Metered usage against the plan's included credits, or, with no subscription,
            against the enforced monthly limit. Filled for every organization (the type stays nullable
            because older servers returned null when there was no subscription). Includes batch spend
            but not credits held for in-flight work; show `allowance` as "credits left".
        allowance:
          $ref: '#/components/schemas/UsageAllowance'
        metrics:
          allOf:
          - $ref: '#/components/schemas/UsageMetricMap'
          description: Every billed metric for the period.
        unattributed:
          allOf:
          - $ref: '#/components/schemas/UsageMetricMap'
          description: Part of each metric that per-engine attribution does not explain. Usually equals
            `metrics` today.
        usage_as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: Newest rollup row in the period, or null when none.
        stale_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Age of `usage_as_of` in seconds; null when no rows.
        warnings:
          type: array
          items:
            type: string
          description: Caveats, e.g. that the allowance counter could not be read. Omitted when empty.
    UsageAllowance:
      type: object
      required:
      - limit_micro
      - limit_credits
      - limit_source
      - unlimited
      - used_micro
      - remaining_micro
      - window_start
      - resets_at
      description: The monthly credit allowance as the API ENFORCES it, for the current allowance month.
        This is the number that decides whether the next request is refused with 402
        `ERR::LIMIT::QUOTA_EXCEEDED`, and the one to show as "credits left". Present for every
        organization, subscribed or not; omitted only when the deployment has no allowance counter or
        it could not be read (a warning then says so).
      properties:
        limit_micro:
          type: integer
          format: int64
          minimum: 0
          description: The enforced monthly limit in micro-credits. 0 means no limit (`unlimited`).
        limit_credits:
          type: integer
          minimum: 0
          description: '`limit_micro` in whole credits, rounded down.'
        limit_source:
          type: string
          enum:
          - default
          - override
          description: '`default`: the deployment''s monthly allowance, which every organization gets.
            `override`: a limit an operator set for this organization.'
        unlimited:
          type: boolean
          description: True when no limit is enforced (`limit_micro` is 0).
        used_micro:
          type: integer
          format: int64
          minimum: 0
          description: Micro-credits counted against the limit this allowance month. It includes credits
            currently HELD for in-flight work (an open browser session holds its whole `session_ttl`
            price until it closes; a batch job holds the price of its unfinished items) as well as
            credits spent, and cannot be split into the two. So it can exceed `credits.used_micro`.
        remaining_micro:
          type: integer
          format: int64
          minimum: 0
          description: '`limit_micro` minus `used_micro`, never negative. 0 when `unlimited`.'
        window_start:
          type: string
          format: date-time
          description: Start of the allowance month, 00:00 UTC on the day of the month the organization
            was created.
        resets_at:
          type: string
          format: date-time
          description: When the allowance is next restored in full; the end of the allowance month.
    UsageDriftItem:
      type: object
      required:
      - project_id
      - metric
      - stored_qty
      - observed_qty
      - delta
      - action
      properties:
        project_id:
          type: string
          description: Project the drift is in.
        metric:
          $ref: '#/components/schemas/UsageMetric'
        stored_qty:
          type: integer
          format: int64
          description: Billed quantity (usage_daily).
        observed_qty:
          type: integer
          format: int64
          description: Quantity re-derived from the Postgres request log.
        delta:
          type: integer
          format: int64
          description: Difference reported by the reconciliation function. Do not treat as a refund or
            charge without reading `interpretation`.
        action:
          type: string
          enum:
          - missing_in_usage_daily
          - absent_from_request_log
          - undercounted
          - overcounted
          description: The reconciliation verdict. `absent_from_request_log` usually means the log expired,
            not overbilling.
    UsageReconciliation:
      type: object
      required:
      - day
      - drift
      - request_log_rows
      - interpretation
      - repairable
      properties:
        day:
          type: string
          format: date
          description: UTC day reconciled.
        drift:
          type: array
          items:
            $ref: '#/components/schemas/UsageDriftItem'
          description: Disagreements. Empty means no drift.
        request_log_rows:
          type: integer
          format: int64
          minimum: 0
          description: Rows the Postgres request log holds for the day. 0 means there was nothing to reconcile
            against.
        interpretation:
          type: string
          description: What the drift can and cannot prove. Read this before acting on `drift`.
        repairable:
          type: boolean
          const: false
          description: Always false; the API never repairs billing data. Contact support to dispute.
        warnings:
          type: array
          items:
            type: string
          description: Extra caveats. Omitted when empty.
    FleetList:
      type: object
      required:
      - kinds
      properties:
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/FleetKind'
          description: One entry per worker kind, in the fixed order browser, egress, extract, batch,
            including kinds with no workers.
    FleetKind:
      type: object
      required:
      - kind
      - present
      - ready
      - workers
      properties:
        kind:
          type: string
          enum:
          - browser
          - egress
          - extract
          - batch
          description: Worker type.
        present:
          type: integer
          minimum: 0
          description: Workers of this kind currently publishing. 0 means none are running.
        ready:
          type: integer
          minimum: 0
          description: Of those, how many accept work. 0 means work of this kind will queue or fail.
        workers:
          type: array
          items:
            $ref: '#/components/schemas/FleetWorker'
          description: The workers. Empty array when none.
    FleetWorker:
      type: object
      required:
      - worker_id
      - kind
      - capacity
      - in_flight
      - free_slots
      - ready
      - address
      - last_seen_ms
      properties:
        worker_id:
          type: string
          description: Worker instance id.
        kind:
          type: string
          enum:
          - browser
          - egress
          - extract
          - batch
          description: Worker type.
        capacity:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Concurrent tasks the worker accepts.
        in_flight:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Tasks it is running now.
        free_slots:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Capacity minus in-flight, floored at 0.
        ready:
          type: boolean
          description: Whether the worker accepts new work.
        detail:
          type: string
          description: Worker's own readiness note, e.g. why it is not ready. Absent when empty.
        task_stream:
          type: string
          description: Queue the worker consumes. Absent when none.
        address:
          type: string
          description: Address the API dials. Empty string means the worker is listed but receives no
            registry traffic.
        last_seen_ms:
          type: integer
          format: int64
          description: Milliseconds since the worker last published. Large values mean it may be gone.
            Can be slightly negative under clock skew.
    HealthLive:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
          description: Always `ok`.
    HealthReady:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          description: '`ready` with HTTP 200; `not_ready` with HTTP 503.'
        checks:
          type: object
          description: 'Per-dependency result. Keys: `postgres`, `redis` (when configured), `fetch`, `extract`,
            `render` (configured workers), and `accepting` (present only as `draining` during shutdown).'
          properties:
            accepting:
              type: string
              const: draining
              description: Present only while the process is shutting down.
            postgres:
              type: string
              enum:
              - ok
              - unreachable
            redis:
              type: string
              enum:
              - ok
              - unreachable
          additionalProperties:
            type: string
            enum:
            - ok
            - unreachable
  responses:
    BadRequest:
      description: The request is invalid. Not retryable; fix the request using `code` and `diagnostics.hint`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, revoked or expired key. Not retryable with the same key.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PaymentRequired:
      description: '`ERR::LIMIT::QUOTA_EXCEEDED`: the organization is out of credits. Not retryable until
        credits are added.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        X-Credits-Remaining:
          description: '`/v1/scrape` only: whole credits left in the monthly allowance when the request
            was refused. Can be above 0: less than this request needed.'
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The key lacks the scope this route requires (`ERR::AUTH::INSUFFICIENT_SCOPE`), or the
        action is not permitted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource for this key's organization.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicts with the resource's current state, for example a session in use (`ERR::SESSION::BUSY`,
        retryable).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The resource existed but is past its retention window or was purged. Not retryable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate, concurrency or live-session limit reached. Retryable after `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: Internal error. Retryable when `retryable` is true.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: The capability is not deployed on this host. Not retryable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: The target, the proxy or the render engine failed. Check `code` and `target_status`;
        most are retryable and cost 0 credits.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: No proxy exit or engine capacity was available. Retryable after `Retry-After`; 0 credits.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: The target did not answer in time (`ERR::UPSTREAM::TIMEOUT`). Retryable; 0 credits.
        See `diagnostics.hint`.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
paths:
  /v1/scrape:
    get:
      operationId: scrapeGet
      tags:
      - Scrape
      summary: Scrape a URL (query-string form)
      description: |-
        Fetch one URL synchronously and return it as html, markdown, text, a PDF, or a JSON envelope with extracted data.

        Choosing an engine (cheapest first):
        - Default (fetch, 1 credit): plain HTTP, no JavaScript. Add `impersonate=true` (POST only, free) when a site rejects non-browser TLS fingerprints.
        - `js_render=true` (obscura, 3): content is built by JavaScript, or you need wait/wait_for/actions/block_resources/network_capture.
        - `engine=chromium` (8): needed for screenshot and response_format=pdf. `stealth=true` (camoufox) is coming soon.
        - `mode=auto`: unsure - escalates through the available engines, bills only the rung that worked.
        - Managed proxy pools (`premium_proxy`) are coming soon; during the beta pass your own proxy with `proxy`.
        Browser-only flags on the fetch tier are a 400, never silently ignored.

        Billing: failures cost 0 (errors, bot challenges, timeouts, target statuses other than 200/404/410 unless listed in allowed_status_codes, undelivered screenshots); cache hits cost 0. Check X-Credits-Charged.

        Status: the HTTP status is the platform's. A blocked or erroring site is usually still HTTP 200 - read envelope `status` or X-Target-Status for the site's answer. Errors are application/problem+json; retry only when `retryable` is true.

        Not idempotent: there is no idempotency key, and each call performs (and bills) a new scrape unless served from cache. GET and POST accept the same parameters and behave identically, except that GET does not accept `impersonate`.
      security:
      - bearerAuth: []
      x-spicrawl-scope: scrape
      x-spicrawl-credits:
        unit: credits per successful request
        matrix:
          fetch:
            direct: 1
            datacenter: 1
            residential: 10
            mobile: 10
          obscura:
            direct: 3
            datacenter: 3
            residential: 25
            mobile: 25
          camoufox:
            direct: 25
            datacenter: 25
            residential: 25
            mobile: 25
          chromium:
            direct: 8
            datacenter: 8
            residential: 32
            mobile: 32
        custom_proxy: priced as the direct column (no proxy surcharge)
        ai_extract: 4
        ai_extract_note: added on top of the engine price; the only additive item
        failures: 0
        cache_hit: 0
        billable_target_statuses:
        - 200
        - 404
        - 410
        billable_target_statuses_note: plus any in allowed_status_codes; other target statuses return
          the body at 0
        mode_auto: bills only the rung that succeeded; reserves the dearest rung against the monthly allowance
        impersonate: 0
        extract_autoparse_links_network_capture: 0
      parameters:
      - name: url
        in: query
        required: true
        description: Target URL; required, must be http or https with a host. A private or reserved address
          fails with 400 ERR::SECURITY::SSRF_BLOCKED at 0 credits.
        schema:
          type: string
          format: uri
          maxLength: 8192
      - name: method
        in: query
        required: false
        description: HTTP method sent to the target (case-insensitive). There is no request-body parameter,
          so non-GET methods are sent without a body; only GET/HEAD/OPTIONS are retried on transient failure
          and only GET results are cached.
        schema:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
          - OPTIONS
          default: GET
      - name: js_render
        in: query
        required: false
        description: Render in a browser engine (obscura; 3 credits datacenter, 25 residential) so JavaScript
          runs. Required by every browser-only flag unless stealth or mode=auto is set; cannot be combined
          with mode=auto. If omitted, the project's stored default applies. Accepts true/false/1/0; a
          bare `?js_render` means true.
        schema:
          type: boolean
          default: false
      - name: stealth
        in: query
        required: false
        description: Coming soon. Render in the hardened camoufox browser, flat 25 credits at any proxy tier; wins
          over js_render when both are set. Cannot be combined with mode=auto or with an engine pin other
          than camoufox; returns 503 ERR::ENGINE::UNAVAILABLE where camoufox is not deployed. If omitted,
          the project's stored default applies. Accepts true/false/1/0; a bare `?stealth` means true.
        schema:
          type: boolean
          default: false
      - name: mode
        in: query
        required: false
        description: '`auto` escalates through the available engines (fetch -> obscura) until a rung returns a usable page,
          billing only the rung that succeeded (0 if all fail) while reserving the dearest rung against
          quota. Incompatible with js_render, stealth and engine. If omitted, the project''s stored default
          applies.'
        schema:
          type: string
          enum:
          - auto
      - name: engine
        in: query
        required: false
        description: Engine `camoufox` is coming soon. Pin the execution engine (case-insensitive); disables escalation and is never substituted.
          chromium (8 credits datacenter, 32 residential) is the only engine supporting headless=false;
          screenshots and pdf need camoufox or chromium. An unentitled engine is 403 ERR::AUTH::ENGINE_NOT_ENTITLED,
          an undeployed one 503 ERR::ENGINE::UNAVAILABLE, both at 0 credits. If omitted, the project's
          stored default applies.
        schema:
          type: string
          enum:
          - fetch
          - obscura
          - camoufox
          - chromium
      - name: premium_proxy
        in: query
        required: false
        description: 'Coming soon. Use residential exits from the managed pool: fetch 10, obscura 25, chromium 32 credits
          (camoufox stays 25). If no residential exit is available the request fails 503 ERR::PROXY::EXHAUSTED
          rather than falling back; ignored (with X-Warning PROXY_FLAG_IGNORED) when `proxy` is set. If
          omitted, the project''s stored default applies. Accepts true/false/1/0; a bare `?premium_proxy`
          means true.'
        schema:
          type: boolean
          default: false
      - name: proxy_country
        in: query
        required: false
        description: Coming soon. ISO 3166-1 alpha-2 exit country (case-insensitive), within the residential pool.
          Requires premium_proxy=true (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise) unless `proxy`
          is set, in which case it is ignored with a warning; an unavailable country is 503 ERR::PROXY::EXHAUSTED,
          never substituted. If omitted, the project's stored default applies.
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
      - name: proxy
        in: query
        required: false
        description: Your own proxy URL (http, https, socks5 or socks5h; credentials in userinfo). Takes
          precedence over premium_proxy/proxy_country and adds 0 proxy credits; loopback hosts are refused
          with 400 ERR::SECURITY::SSRF_BLOCKED. An unreachable proxy fails 502 ERR::PROXY::UNREACHABLE.
        schema:
          type: string
      - name: proxy_verify
        in: query
        required: false
        description: Probe the custom `proxy` before spending the engine cost so a dead proxy fails fast.
          Requires `proxy` (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise). Accepts true/false/1/0; a
          bare `?proxy_verify` means true.
        schema:
          type: boolean
          default: false
      - name: session_id
        in: query
        required: false
        description: Reuse a session's cookies and storage (created via /v1/sessions); the session's engine
          is used and pinning a different engine is 400 ERR::REQUEST::INCOMPATIBLE_FLAGS. Checked before
          any work, at 0 credits and not retryable - an unknown, malformed or other organization's id is
          404 ERR::SESSION::NOT_FOUND, a released session 410 ERR::SESSION::RELEASED, an expired one 410
          ERR::SESSION::EXPIRED. A successful request increments the session's `usage_count`, sets
          `last_used_at` and slides `expires_at`. Requests with a session are never cached.
        schema:
          type: string
      - name: sticky_key
        in: query
        required: false
        description: Coming soon. Any string; requests sharing it reuse the same pool exit. Forces a pool exit even
          on deployments whose default is direct egress, so it can fail 503 ERR::PROXY::EXHAUSTED where
          no pool exists.
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: 'Milliseconds to wait after load before capture. Browser-only: needs js_render, stealth,
          an engine pin with a browser, or mode=auto, else 400 ERR::REQUEST::INCOMPATIBLE_FLAGS.'
        schema:
          type: integer
          minimum: 0
          maximum: 30000
          default: 0
      - name: wait_for
        in: query
        required: false
        description: CSS selector to wait for before capture. Browser-only. If it never appears the page
          is returned as it stood with an X-Warning RENDER_DEGRADED; if the render times out waiting it
          fails 504 ERR::UPSTREAM::TIMEOUT - raise wait_for_timeout or fix the selector.
        schema:
          type: string
      - name: wait_for_timeout
        in: query
        required: false
        description: Milliseconds to wait for `wait_for`; 0 uses the engine default. Requires wait_for
          (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise).
        schema:
          type: integer
          minimum: 0
          maximum: 120000
          default: 0
      - name: actions
        in: query
        required: false
        description: URL-encoded JSON array. Ordered browser workflow (click, fill, scroll, ...), validated
          before anything is spent. Browser-only; disables the default image/font blocking and makes the
          request uncacheable. A failed step ends the request at 0 credits unless that step has on_error=skip.
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/ScrapeAction'
      - name: block_resources
        in: query
        required: false
        description: Comma-separated list (blank items dropped). Subresource classes the browser must
          not load (plural and short aliases accepted, case-insensitive). If omitted, renders block image+font
          except for screenshot, pdf, actions, or a network_capture of images/fonts; an explicit list
          replaces that default and `none` (alone) blocks nothing. Any value other than `none` is browser-only.
          If omitted, the project's stored default applies.
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: false
          items:
            type: string
            enum:
            - none
            - document
            - documents
            - stylesheet
            - stylesheets
            - css
            - image
            - images
            - media
            - font
            - fonts
            - script
            - scripts
            - js
            - xhr
            - fetch
            - websocket
            - websockets
            - other
      - name: headless
        in: query
        required: false
        description: false runs the browser on a real display (1920x1080 screen instead of 800x600); only
          engine=chromium supports it, anything else is 400 ERR::REQUEST::CAPABILITY_UNSUPPORTED at 0
          credits. Either value requires a browser engine; omit to use the deployment default (headless).
          Headful renders skip the warm pool and add ~1s. If omitted, the project's stored default applies.
          Accepts true/false/1/0; a bare `?headless` means true.
        schema:
          type: boolean
      - name: screenshot
        in: query
        required: false
        description: Capture a screenshot; forces the JSON envelope (image base64 under `screenshots`).
          Needs a rasterising engine (camoufox or chromium) - otherwise 400 ERR::REQUEST::CAPABILITY_UNSUPPORTED
          at 0 credits. mode=auto cannot satisfy it (its fetch rung has no rasteriser). If the image is
          not delivered the page is still returned but charged 0. Accepts true/false/1/0; a bare `?screenshot`
          means true.
        schema:
          type: boolean
          default: false
      - name: screenshot_fullpage
        in: query
        required: false
        description: Capture the full scrollable page. Requires screenshot=true; mutually exclusive with
          screenshot_selector. Accepts true/false/1/0; a bare `?screenshot_fullpage` means true.
        schema:
          type: boolean
          default: false
      - name: screenshot_selector
        in: query
        required: false
        description: CSS selector of the element to capture. Requires screenshot=true; mutually exclusive
          with screenshot_fullpage.
        schema:
          type: string
      - name: screenshot_format
        in: query
        required: false
        description: Image format; omitted uses the engine default (png). Not validated by the API - an
          unrecognised value silently falls back to the engine default.
        schema:
          type: string
          enum:
          - png
          - jpeg
          - jpg
          - webp
      - name: screenshot_quality
        in: query
        required: false
        description: Lossy quality for jpeg/webp; 0 uses the engine default. A value above 0 requires
          screenshot=true.
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
      - name: custom_headers
        in: query
        required: false
        description: URL-encoded JSON object. Headers sent to the target, as name -> string value. Hop-by-hop
          headers (Connection, Keep-Alive, Proxy-Authenticate, Proxy-Authorization, TE, Trailer, Transfer-Encoding,
          Upgrade, Host, Content-Length) are refused with 400 ERR::REQUEST::INVALID_PARAMETER. If omitted,
          the project's stored default applies.
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: object
            additionalProperties:
              type: string
      - name: network_capture
        in: query
        required: false
        description: URL-encoded JSON object. Record the XHR/fetch responses the page itself made (often
          cleaner JSON than the DOM), returned under `network` in the JSON envelope. Browser-only; no
          extra credits.
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/NetworkCapture'
      - name: autoparse
        in: query
        required: false
        description: Harvest the page's own structured metadata (JSON-LD, OpenGraph, Twitter, microdata,
          RDFa, meta, embedded SPA state) into `data`, no selectors needed. Forces the JSON envelope;
          no extra credits; refused on a PDF. Accepts true/false/1/0; a bare `?autoparse` means true.
        schema:
          type: boolean
          default: false
      - name: links
        in: query
        required: false
        description: Return the page's absolute, de-duplicated <a href> targets under `links`. Forces
          the JSON envelope; no extra credits; refused on a PDF. If omitted, the project's stored default
          applies. Accepts true/false/1/0; a bare `?links` means true.
        schema:
          type: boolean
          default: false
      - name: extract
        in: query
        required: false
        description: 'URL-encoded JSON object. Selector extraction into `data`: a selector map, or a JSON
          Schema whose properties carry `selector`. Forces the JSON envelope, validated before fetching,
          no extra credits; mutually exclusive with extract_preset. Rules that match nothing are listed
          in `empty_fields`.'
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/ScrapeExtract'
      - name: extract_preset
        in: query
        required: false
        description: Coming soon. Name of a server-side extraction preset. This deployment has no preset store, so
          any value fails with 400 ERR::EXTRACT::INVALID_RULES (at 0 credits, after the fetch); use `extract`
          inline. Mutually exclusive with extract.
        schema:
          type: string
      - name: ai_extract
        in: query
        required: false
        description: Coming soon. URL-encoded JSON object. Model-driven extraction into `data`; adds 4 credits. Refused
          with 503 ERR::INTERNAL::UNAVAILABLE where no model is configured, and a model failure is 502
          ERR::EXTRACT::FAILED at 0 credits. Forces the JSON envelope.
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/AIExtract'
      - name: main_content_only
        in: query
        required: false
        description: true strips nav/footer/aside to the main article; false keeps the whole document.
          Omitted keeps the pipeline default (main-content isolation on for markdown). Applies to markdown/text/cleaned
          output. If omitted, the project's stored default applies. Accepts true/false/1/0; a bare `?main_content_only`
          means true.
        schema:
          type: boolean
      - name: include_tags
        in: query
        required: false
        description: Comma-separated list (blank items dropped). CSS selectors; keep only matching subtrees
          before extraction and markdown conversion. Applied before exclude_tags and main_content_only.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: exclude_tags
        in: query
        required: false
        description: Comma-separated list (blank items dropped). CSS selectors; remove matching elements,
          applied after include_tags and before main_content_only.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: parse_pdf
        in: query
        required: false
        description: When the target returns a PDF and markdown/text is requested, parse it to text. false
          refuses it with 502 ERR::EXTRACT::FAILED (0 credits); response_format=html always returns the
          raw bytes. If omitted, the project's stored default applies. Accepts true/false/1/0; a bare
          `?parse_pdf` means true.
        schema:
          type: boolean
          default: true
      - name: response_format
        in: query
        required: false
        description: 'Body shape: html/markdown/text return the document itself, json the envelope, pdf
          a browser-printed PDF (needs camoufox or chromium). extract, autoparse, links, ai_extract, network_capture
          or screenshot override this to the JSON envelope with X-Warning FORMAT_COERCED. A non-HTML target
          (image, binary) requested as markdown/text fails 502 ERR::EXTRACT::FAILED at 0 credits. If omitted,
          the project''s stored default applies.'
        schema:
          type: string
          enum:
          - html
          - markdown
          - text
          - json
          - pdf
          default: html
      - name: cache
        in: query
        required: false
        description: 'Serve a stored result younger than cache_ttl (Cache-State: hit, 0 credits). Only
          billable successes of GET-method requests without session_id or actions are stored. Set false
          for time-sensitive data; cache=false with cache_ttl>0 is 400 ERR::REQUEST::INCOMPATIBLE_FLAGS.
          Accepts true/false/1/0; a bare `?cache` means true.'
        schema:
          type: boolean
          default: true
      - name: cache_ttl
        in: query
        required: false
        description: Maximum acceptable age of a cached result, in seconds. Default and cap are deployment
          settings (48h by default); larger values are clamped with X-Warning CACHE_TTL_CLAMPED. 0 disables
          caching for this request.
        schema:
          type: integer
          minimum: 0
          default: 172800
      - name: max_cost
        in: query
        required: false
        description: Credit ceiling; 0 means none. Checked against the dearest reachable outcome (the
          top rung under mode=auto) before anything runs, failing 400 ERR::LIMIT::MAX_COST_EXCEEDED at
          0 credits.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: original_status
        in: query
        required: false
        description: 'On success, use the target''s status as this response''s HTTP status instead of
          200. Leave off unless you need it: it makes a target 404 indistinguishable from an API error
          by status alone. Accepts true/false/1/0; a bare `?original_status` means true.'
        schema:
          type: boolean
          default: false
      - name: allowed_status_codes
        in: query
        required: false
        description: Comma-separated list (blank items dropped). Extra target statuses to treat as billable
          successes (200, 404 and 410 always are). Other statuses return the target's body at 0 credits,
          and under mode=auto trigger escalation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
      - name: apikey
        in: query
        required: false
        deprecated: true
        description: 'Accepted by the query parser but NOT honoured for authentication on this route (only
          /v1/browser reads a query key); a request relying on it gets 401 ERR::AUTH::MISSING_KEY. Send
          `Authorization: Bearer <key>` instead.'
        schema:
          type: string
      - name: api_key
        in: query
        required: false
        deprecated: true
        description: 'Accepted by the query parser but NOT honoured for authentication on this route (only
          /v1/browser reads a query key); a request relying on it gets 401 ERR::AUTH::MISSING_KEY. Send
          `Authorization: Bearer <key>` instead.'
        schema:
          type: string
      responses:
        '200':
          description: 'Scrape completed. The HTTP status is the platform''s: the site''s status is envelope
            `status` / X-Target-Status, and a non-billable target status (e.g. 403, 500) still returns
            200 with the site''s body at 0 credits. With original_status=true this status line carries
            the target''s status instead.'
          headers:
            X-Request-Id:
              description: Request id (ULID). Quote it in support requests.
              schema:
                type: string
            X-Credits-Charged:
              description: Credits actually billed; 0 on any failure, cache hit, or non-billable target
                status.
              schema:
                type: integer
            X-Request-Cost:
              description: Price of the engine/proxy tier that ran (0 on a cache hit). Differs from X-Credits-Charged
                exactly when nothing was billed.
              schema:
                type: integer
            X-Credits-Remaining:
              description: Whole credits (rounded down) left in the organization's monthly allowance after
                this request's charge. Read from the enforced counter, so it also counts credits held
                for in-flight work (running batch jobs, open browser sessions). Never negative. Absent
                when the organization has no ceiling or the counter could not be read.
              schema:
                type: integer
                minimum: 0
            X-Engine:
              description: Engine that ran.
              schema:
                type: string
                enum:
                - fetch
                - obscura
                - camoufox
                - chromium
            X-Proxy-Source:
              description: Whose exit carried the request.
              schema:
                type: string
                enum:
                - pool
                - custom
                - direct
            X-Target-Status:
              description: The site's HTTP status. Absent when no document was retrieved.
              schema:
                type: integer
            X-Proxy-Endpoint:
              description: Identifier of the pool exit that served (not an IP). Absent for custom and
                direct exits.
              schema:
                type: string
            X-Final-Url:
              description: URL after redirects, when known.
              schema:
                type: string
            X-RateLimit-Limit:
              description: Requests per second allowed for this key/org.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Tokens left in the bucket.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Seconds until retry is allowed; only sent when the limiter imposed a wait.
              schema:
                type: integer
            Concurrency-Limit:
              description: Concurrent in-flight requests allowed for the organization.
              schema:
                type: integer
            Concurrency-Remaining:
              description: Concurrent slots left.
              schema:
                type: integer
            Cache-State:
              description: Result-cache outcome.
              schema:
                type: string
                enum:
                - hit
                - miss
                - bypass
            X-Warning:
              description: 'Repeated, one per advisory, formatted `CODE: message`. Codes: PROXY_FLAG_IGNORED,
                FORMAT_COERCED, CACHE_TTL_CLAMPED, ENGINE_SUBSTITUTED, RENDER_DEGRADED, ESCALATED.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeEnvelope'
              examples:
                extracted:
                  summary: Selector extraction
                  value:
                    url: https://example.com/product/1
                    final_url: https://example.com/product/1
                    status: 200
                    content: <html><head><title>Walnut Desk</title></head><body>...</body></html>
                    headers:
                      content-type: text/html; charset=utf-8
                    truncated: false
                    credits: 1
                    engine: fetch
                    proxy_source: pool
                    warnings: []
                    data:
                      title: Walnut Desk
                      price: $349.00
                      images:
                      - https://example.com/img/desk-1.jpg
                screenshot:
                  summary: Rendered with a screenshot
                  value:
                    url: https://example.com/pricing
                    final_url: https://example.com/pricing
                    status: 200
                    content: |-
                      # Pricing

                      | Plan | Price |
                      |---|---|
                      | Starter | $29 |
                    headers:
                      content-type: text/html
                    truncated: false
                    credits: 8
                    engine: chromium
                    proxy_source: pool
                    warnings:
                    - '`screenshot` returns an image, which has no representation in a markdown body,
                      so the response is the JSON envelope with the rendering under `content` and the
                      image under `screenshots`.'
                    screenshots:
                    - label: final
                      encoding: base64
                      data: iVBORw0KGgoAAAANSUhEUg...
                      size_bytes: 184233
                      format: png
                      width: 1280
                      height: 3400
            text/html:
              schema:
                type: string
                description: The document itself (non-JSON response_format with no envelope-forcing flag);
                  metadata is in the headers.
            text/markdown:
              schema:
                type: string
                description: The document itself (non-JSON response_format with no envelope-forcing flag);
                  metadata is in the headers.
            text/plain:
              schema:
                type: string
                description: The document itself (non-JSON response_format with no envelope-forcing flag);
                  metadata is in the headers.
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
                description: Browser-printed PDF (response_format=pdf).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      operationId: scrapePost
      tags:
      - Scrape
      summary: Scrape a URL
      description: |-
        Fetch one URL synchronously and return it as html, markdown, text, a PDF, or a JSON envelope with extracted data.

        Choosing an engine (cheapest first):
        - Default (fetch, 1 credit): plain HTTP, no JavaScript. Add `impersonate=true` (POST only, free) when a site rejects non-browser TLS fingerprints.
        - `js_render=true` (obscura, 3): content is built by JavaScript, or you need wait/wait_for/actions/block_resources/network_capture.
        - `engine=chromium` (8): needed for screenshot and response_format=pdf. `stealth=true` (camoufox) is coming soon.
        - `mode=auto`: unsure - escalates through the available engines, bills only the rung that worked.
        - Managed proxy pools (`premium_proxy`) are coming soon; during the beta pass your own proxy with `proxy`.
        Browser-only flags on the fetch tier are a 400, never silently ignored.

        Billing: failures cost 0 (errors, bot challenges, timeouts, target statuses other than 200/404/410 unless listed in allowed_status_codes, undelivered screenshots); cache hits cost 0. Check X-Credits-Charged.

        Status: the HTTP status is the platform's. A blocked or erroring site is usually still HTTP 200 - read envelope `status` or X-Target-Status for the site's answer. Errors are application/problem+json; retry only when `retryable` is true.

        Not idempotent: there is no idempotency key, and each call performs (and bills) a new scrape unless served from cache. GET and POST accept the same parameters and behave identically, except that GET does not accept `impersonate`.
      security:
      - bearerAuth: []
      x-spicrawl-scope: scrape
      x-spicrawl-credits:
        unit: credits per successful request
        matrix:
          fetch:
            direct: 1
            datacenter: 1
            residential: 10
            mobile: 10
          obscura:
            direct: 3
            datacenter: 3
            residential: 25
            mobile: 25
          camoufox:
            direct: 25
            datacenter: 25
            residential: 25
            mobile: 25
          chromium:
            direct: 8
            datacenter: 8
            residential: 32
            mobile: 32
        custom_proxy: priced as the direct column (no proxy surcharge)
        ai_extract: 4
        ai_extract_note: added on top of the engine price; the only additive item
        failures: 0
        cache_hit: 0
        billable_target_statuses:
        - 200
        - 404
        - 410
        billable_target_statuses_note: plus any in allowed_status_codes; other target statuses return
          the body at 0
        mode_auto: bills only the rung that succeeded; reserves the dearest rung against the monthly allowance
        impersonate: 0
        extract_autoparse_links_network_capture: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapeRequest'
            examples:
              markdown:
                summary: Page as markdown
                value:
                  url: https://example.com/blog/launch
                  response_format: markdown
              selector_extract:
                summary: Selector extraction
                value:
                  url: https://example.com/product/1
                  extract:
                    title: h1
                    price:
                      selector: .price
                      output: text
                    images:
                      selector: .gallery img
                      kind: list
                      output: attr
                      attribute: src
              rendered_actions:
                summary: Rendered with actions and a screenshot
                value:
                  url: https://example.com/pricing
                  engine: chromium
                  wait_for: .plans
                  actions:
                  - click:
                      selector: '#accept-cookies'
                    on_error: skip
                  - click: .toggle-annual
                    label: annual
                  - scroll:
                      to_bottom: true
                  screenshot: true
                  response_format: markdown
                  max_cost: 10
      responses:
        '200':
          description: 'Scrape completed. The HTTP status is the platform''s: the site''s status is envelope
            `status` / X-Target-Status, and a non-billable target status (e.g. 403, 500) still returns
            200 with the site''s body at 0 credits. With original_status=true this status line carries
            the target''s status instead.'
          headers:
            X-Request-Id:
