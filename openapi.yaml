  /v1/sessions/{sessionID}/context:
    parameters:
    - name: sessionID
      in: path
      required: true
      description: Session id from `POST /v1/sessions` (26-character ULID; a UUID is also accepted). A
        malformed id answers 404 `ERR::SESSION::NOT_FOUND`, the same as an unknown one.
      schema:
        type: string
