        Returns the job with live progress counters. Cheap to call: progress is read from sharded counters, not by
        counting items. Poll until `status` is `completed`, `failed` or `cancelled`; a reasonable interval is 2-5 s for
        jobs under ~1,000 items and 10-30 s for larger ones. If `open` is true the job will never finish on its
        own — call `POST /v1/batch/{batchID}/close` when you are done appending.
