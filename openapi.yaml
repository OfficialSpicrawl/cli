        required: false
        description: Jobs per page. Out-of-range or non-integer values are a 400, not clamped.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: status
        in: query
        required: false
        description: Return only jobs whose stored status equals this value (case-insensitive). Omit for
          all statuses.
        schema:
          $ref: '#/components/schemas/BatchJobStatus'
      - name: cursor
        in: query
        required: false
        description: Opaque token from a previous page's `next_cursor`. Pass it back verbatim; do not
          construct it. Omit to start from the newest job.
        schema:
          type: string
      responses:
        '200':
          description: One page of jobs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
