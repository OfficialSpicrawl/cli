        property (or its items/nested properties) needs a `selector`; values are coerced to the declared
        types and validated.
      properties:
        type:
          const: object
        properties:
          type: object
          minProperties: 1
          maxProperties: 100
          additionalProperties:
            type: object
            description: JSON Schema property plus a `selector` keyword.
        required:
          type: array
          items:
            type: string
        strict:
          type: boolean
          default: false
          description: Passed to the extractor to enforce the schema strictly.
