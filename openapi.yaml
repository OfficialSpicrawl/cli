  /v1/partner/usage:
    get:
      tags:
      - Partner
      operationId: partnerUsage
      summary: The partner's usage across its workspaces
      description: |
        Usage summed over the partner's child workspaces. `group_by=day` gives one row per UTC day;
        `group_by=workspace` gives one row per workspace, named by `external_user_id`, and pages it.
        The window is `from` (inclusive) to `to` (exclusive), default the last 30 days, at most 400 days.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Exclusive.
        schema:
          type: string
          format: date
      - name: group_by
        in: query
        schema:
          type: string
          enum: [day, workspace]
          default: day
      - name: sort
        in: query
        description: Workspace grouping only. Descending, ties broken by external_user_id.
        schema:
          type: string
          enum: [credits, requests, fail_rate, last_active]
          default: credits
      - name: limit
        in: query
        description: Workspace grouping only, 1 to 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        description: Workspace grouping only.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: q
        in: query
        description: Workspace grouping only. A prefix of external_user_id.
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: The partner's usage.
          content:
            application/json:
              schema:
                type: object
                required: [period, group_by, totals, rows]
                properties:
                  period:
                    type: object
                    properties:
                      start: {type: string, format: date}
                      end: {type: string, format: date, description: Exclusive.}
                      bounds: {type: string, example: '[start, end)'}
                      days: {type: integer}
                  group_by:
                    type: string
                    enum: [day, workspace]
                  totals:
                    $ref: '#/components/schemas/PartnerUsageTotals'
                  rows:
                    description: '`day` rows carry the totals fields plus `day`; `workspace` rows are PartnerUsageWorkspace.'
                    type: array
                    items:
                      type: object
                  page:
                    description: Present for group_by=workspace.
                    type: object
                    properties:
                      total: {type: integer}
                      limit: {type: integer}
                      offset: {type: integer}
                      next_offset: {type: integer, nullable: true}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/partner/workspaces/{external_user_id}/usage:
    get:
      tags:
      - Partner
      operationId: partnerWorkspaceUsage
      summary: One workspace's usage
      description: Totals and one row per UTC day for a workspace of this partner. A deleted workspace is not found.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      parameters:
      - name: external_user_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
