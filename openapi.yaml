          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/sessions/{sessionID}/release:
    parameters:
    - name: sessionID
      in: path
      required: true
      description: Session id from `POST /v1/sessions` (26-character ULID; a UUID is also accepted). A
        malformed id answers 404 `ERR::SESSION::NOT_FOUND`, the same as an unknown one.
      schema:
        type: string
        examples:
        - 01J9ZQ4M7R3T8VX2K5N6P0B1CD
