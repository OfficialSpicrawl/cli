  /v1/jobs/search:
    post:
      tags:
      - Jobs
      operationId: jobsSearch
      summary: Search the index of job postings
      description: |
        Searches Spicrawl's index of job postings in one synchronous call. The index is crawled from
        company job boards on Greenhouse, Lever, Ashby, Workable, SmartRecruiters, Recruitee, Breezy, Pinpoint,
        Personio and Workday, from Y Combinator's job board, and from Wellfound's role listing pages (the newest postings on a set of them, not the whole site), and refreshed
        about every 6 hours. The request reads the index; it does not fetch the boards.
        Evergreen catch-all listings ("Join our Talent Community", "General application") are not indexed.

        Results are ordered newest first, one page per call; pass `next_cursor` back as `cursor` for the next.
        By default only open postings are returned (`status: open`). `status: closed` or `status: any` also
        returns postings that left their board. A posting that leaves its board is marked `closed` and kept
        for 30 days, then removed. `closed_at` is when the crawler noticed, up to one crawl interval after it
        actually closed.

        Filters: `seniority`, `employment_type`, `skills` (every listed skill must match), `language`, `country`,
        `salary_min` with `salary_currency`, and `workplace`. Each one narrows results. `seniority` is read from
        the job title, so most postings are `unknown`. `skills` are matched against a fixed vocabulary; a posting
        whose description is not available only has skills found in its title. `salary_min` compares yearly
        amounts within one currency and does not convert between currencies.

        `include_description: true` adds each posting's plain text (capped at 20,000 characters) as `description`.
        It makes responses much larger.

        `visa_sponsorship` is `yes`, `no` or `unknown`. `visa_source` is `listed` when the platform publishes
        it (YC, Wellfound) and `inferred` when read from the description text (the company job-board platforms); inferred values
        can be wrong. `visa_sponsorship: true` narrows results a lot, because most postings are `unknown`.

        Billing: 2 credits per request, including one that returns no results; 0 when billing is off. A failed
        request costs 0. The price does not depend on `limit`. Subject to the key's normal rate limit.

        With `find_contacts: true` the request also costs 5 credits for each posting that gets contacts; a posting
        that already names people, or for which nothing is found, costs nothing extra, and a cached lookup costs
        the same as a fresh one. The organization must have room for 2 + 5 × `limit` when the request starts.
        `find_contacts` caps `limit` at 10 and can take up to about 30 seconds.

        Unknown fields are a `400`. A search with a blank or missing `title` and no other filter is `400 ERR::REQUEST::MISSING_PARAMETER`; every
        other invalid value is `400 ERR::REQUEST::INVALID_PARAMETER`, including an unknown skill, which the detail names.

        Daily allowance: a workspace may run 5 searches per day (`SPICRAWL_JOBS_DAILY_LIMIT` on a self-hosted
        deployment; 0 is unlimited). The day resets at 12:00 AM IST (18:30 UTC). Requests that pass validation
        count; a `400`, a per-key rate-limit `429`, a `5xx` on our side and a `402` do not use one. Past the
        allowance the request is refused with `429 ERR::LIMIT::DAILY_LIMIT_EXCEEDED`, which is not retryable
        before the reset. The `X-Jobs-Daily-Limit`, `X-Jobs-Daily-Remaining` and `X-Jobs-Daily-Reset` headers
        report the allowance on success and on that `429`.
      security:
      - bearerAuth: []
      x-spicrawl-scope: scrape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSearchRequest'
            examples:
              backendRemoteOrHybrid:
                summary: Recent backend roles, remote or hybrid
                value:
                  title: backend engineer -senior
                  posted_within: 7d
                  region: Berlin
                  workplace: [remote, hybrid]
                  platforms: [greenhouse, ashby]
                  limit: 25
              seniorRemoteWithSalary:
                summary: Senior Go roles, remote, at least 120k USD a year
                value:
                  title: engineer
                  workplace: [remote]
                  seniority: [senior, lead]
                  skills: [go, postgresql]
                  salary_min: 120000
                  salary_currency: USD
      responses:
        '200':
          description: One page of postings, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Jobs-Daily-Limit:
              $ref: '#/components/headers/X-Jobs-Daily-Limit'
            X-Jobs-Daily-Remaining:
              $ref: '#/components/headers/X-Jobs-Daily-Remaining'
            X-Jobs-Daily-Reset:
              $ref: '#/components/headers/X-Jobs-Daily-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: |
            Either the per-key rate limit was reached (`ERR::LIMIT::RATE_LIMITED`, retryable after `Retry-After`),
            or the workspace's daily allowance is used up (`ERR::LIMIT::DAILY_LIMIT_EXCEEDED`, not retryable
            before the reset that `Retry-After` gives). Neither is charged. For an ordinary organization the
            `detail` of either ends with: To get higher limits, contact our team from the dashboard or at support@spicrawl.com about upgrading your plan.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-Jobs-Daily-Limit:
              $ref: '#/components/headers/X-Jobs-Daily-Limit'
            X-Jobs-Daily-Remaining:
              $ref: '#/components/headers/X-Jobs-Daily-Remaining'
            X-Jobs-Daily-Reset:
              $ref: '#/components/headers/X-Jobs-Daily-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/partner/tiers:
    get:
      tags:
      - Partner
      operationId: partnerTiersList
      summary: List the partner's tiers
      description: |
        The partner's tiers, the default first, then by name. `workspaces` counts the live workspaces on each tier.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      responses:
        '200':
          description: The tiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTierList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Partner
      operationId: partnerTierCreate
      summary: Create a tier
      description: |
        Creates a tier. `name`, `requests_per_minute`, `concurrency` and `free_credits` are required. The
        partner's first tier becomes the default whatever `default` says. A value above the partner's ceiling
        is `400`, and the message gives the bound. A name already used by another tier is `409`.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerTierInput'
      responses:
        '201':
          description: The tier was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/partner/tiers/{tier_id}:
    parameters:
    - name: tier_id
      in: path
      required: true
      description: The tier's id, from the list or the create response.
      schema:
        type: string
    patch:
      tags:
      - Partner
      operationId: partnerTierUpdate
      summary: Change a tier
      description: |
        Changes the fields sent and leaves the rest. Every workspace on the tier gets the new limits, and any
        workspace whose balance cap is turned on from none has its cap reset. Changes reach requests within about 60 seconds.
        `"default": true` makes this tier the default; `false` is `400`. A duplicate name is `409`.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerTierPatch'
      responses:
        '200':
          description: The tier after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Partner
      operationId: partnerTierDelete
      summary: Delete a tier
      description: |
        Refused with `409` when a live workspace is on the tier, or when the tier is the default while other tiers
        exist. Move the workspaces and change the default first. A soft-deleted workspace does not hold the tier;
        deleting the tier takes it off the workspace.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      responses:
        '204':
          description: The tier was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/partner/workspaces/{external_user_id}/tier:
    parameters:
    - name: external_user_id
      in: path
      required: true
      description: The partner's own id for the end user.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    put:
      tags:
      - Partner
      operationId: partnerWorkspaceSetTier
      summary: Move a workspace to a tier
      description: |
        Moves the workspace to the named tier and applies that tier's limits and balance cap. Changes reach
        requests within about 60 seconds. Returns the workspace.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerTierAssign'
      responses:
        '200':
          description: The workspace on its new tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerWorkspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/partner/workspaces/{external_user_id}/credits:
    parameters:
    - name: external_user_id
      in: path
      required: true
      description: The partner's own id for the end user.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    post:
      tags:
      - Partner
      operationId: partnerWorkspaceAssignCredits
      summary: Assign credits to a user
      description: |
        Moves credits from the partner's balance to this user's own balance. The user spends them after their free
        credits and before the partner's balance. They do not reset each month. The funded balance reaches requests
        at once on the API process that took the assignment, and within about 5 seconds on the others.

        Idempotent per `idempotency_key`: a repeat with the same key, the same `credits` and the same user returns
        `"applied": false` and changes nothing. A key reused with a different amount or user is
        `409 ERR::REQUEST::CONFLICT` and changes nothing. The partner can assign at most its balance (funded less
        spent, never the credit line). More than that is `402 ERR::LIMIT::QUOTA_EXCEEDED`. The partner's record of the
        assignment is a transfer out, and the workspace's is a transfer in.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreditAssignment'
      responses:
        '200':
          description: The assignment, applied or already applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCreditAssigned'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /healthz:
    get:
      tags:
      - Health
      operationId: healthLive
      summary: Liveness
      description: |
        Outside `/v1` and unauthenticated. Answers 200 whenever the process can serve HTTP, and checks no
        dependency, so it stays 200 during a database or worker outage. Use `/readyz` to decide whether to
        send traffic.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
              examples:
                ok:
                  value:
                    status: ok
  /readyz:
    get:
      tags:
      - Health
      operationId: healthReady
      summary: Readiness
      description: |
        Outside `/v1` and unauthenticated. Checks Postgres, Redis (when configured) and each configured
        data-plane worker (`fetch`, `extract`, `render`) with a 2-second budget, and reports whether the
        process is draining. Returns 503 with the same body shape (not a Problem) when any check fails. Stop
        routing to this instance on 503; do not restart it.
      security: []
      responses:
        '200':
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                ready:
                  value:
                    status: ready
                    checks:
                      postgres: ok
                      redis: ok
                      fetch: ok
                      extract: ok
                      render: ok
        '503':
          description: Not ready. `checks` names what failed. This body is plain JSON, not a Problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                notReady:
                  value:
                    status: not_ready
                    checks:
                      postgres: ok
                      redis: unreachable
                      render: ok
                draining:
                  value:
                    status: not_ready
                    checks:
                      accepting: draining
                      postgres: ok
                      redis: ok
