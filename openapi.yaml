                maximum: 30000
                description: Plain sleep in ms when no selector is given.
              wait:
                type: integer
                minimum: 0
                maximum: 30000
                description: Alias of `ms`.
              label:
                type: string
                description: Name echoed in diagnostics and screenshot labels; defaults to `<verb>[index]`.
              timeout_ms:
                type: integer
                minimum: 1
                description: Per-step timeout in ms; omitted or <=0 uses the engine default. May also
                  be placed inside the verb object.
              on_error:
                type: string
                enum:
                - fail
                - skip
                default: fail
                description: '`fail` ends the request at 0 credits naming the step; `skip` records the
                  failure and continues. May also be placed inside the verb object.'
            description: Needs `selector` or a positive `ms`/`wait`, else 400.
        label:
          type: string
          description: Name echoed in diagnostics and screenshot labels; defaults to `<verb>[index]`.
        timeout_ms:
          type: integer
          minimum: 1
