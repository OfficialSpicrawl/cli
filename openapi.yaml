      description: Selector map or JSON Schema form. An empty object is 400. Refused on PDF targets (502
        ERR::EXTRACT::FAILED).
      anyOf:
      - $ref: '#/components/schemas/ScrapeExtractSchema'
      - $ref: '#/components/schemas/ScrapeExtractSelectorMap'
