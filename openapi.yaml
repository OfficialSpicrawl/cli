              selector:
                summary: Watch one element, confirmed on two checks
                value:
                  url: https://example.com/status
                  selector: '#status-banner'
                  confirm_checks: 2
              jsRender:
                summary: Watch a client-rendered page
                value:
                  url: https://app.example.com/stock
                  js_render: true
              wholeSite:
