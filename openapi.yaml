                    project_id: 01J9Y0000000000000000PROJ1
                    engine: chromium
                    status: active
                    sticky_key: acct-4812
                    proxy:
                      tier: residential
                      country: de
                    created_at: '2026-09-22T10:00:00Z'
                    last_used_at: null
                    expires_at: '2026-09-22T12:00:00Z'
                    hard_expires_at: '2026-09-29T10:00:00Z'
