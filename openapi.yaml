      summary: Create a persisted browser session
      description: |
        Creates a session: a sealed cookie jar and web-storage snapshot, pinned to one
        exit intent, that you reuse by passing its `id` as `session_id` on `/v1/scrape`.

        Pitfalls:
        - Every field is optional. An empty body (Content-Length 0) means "all defaults"; `{}` also works.
          Unknown fields are refused with 400.
        - Sessions are single-writer. While a render holds the lease, a second scrape on the same session,
          and release/delete without `force=true`, get 409 `ERR::SESSION::BUSY` with a `Retry-After`.
