        marked `Cache-Control: no-store, private`. Reading does not slide the TTL.

        Pitfalls:
        - After release, delete, or TTL expiry the context is purged immediately and permanently. A released
          session answers 410 `ERR::SESSION::RELEASED`; an expired one 410 `ERR::SESSION::EXPIRED`. Do not
          retry a 410: create a new session and log in again.
