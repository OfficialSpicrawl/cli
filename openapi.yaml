        property (or its items/nested properties) needs a `selector`; values are coerced to the declared
        types and validated.
      properties:
        type:
          const: object
        properties:
          type: object
          minProperties: 1
          maxProperties: 100
          additionalProperties:
            type: object
            description: JSON Schema property plus a `selector` keyword.
        required:
          type: array
          items:
            type: string
        strict:
          type: boolean
          default: false
          description: Passed to the extractor to enforce the schema strictly.
    ScrapeExtract:
      description: Selector map or JSON Schema form. An empty object is 400. Refused on PDF targets (502
        ERR::EXTRACT::FAILED).
      anyOf:
      - $ref: '#/components/schemas/ScrapeExtractSchema'
      - $ref: '#/components/schemas/ScrapeExtractSelectorMap'
    ScrapeScreenshot:
