      description: One extraction rule. Unrecognised keys are ignored.
      properties:
        selector:
          type: string
          minLength: 1
          description: CSS selector or XPath expression.
        type:
          type: string
          enum:
          - css
          - xpath
          default: css
          description: Selector language.
        kind:
          type: string
          enum:
          - item
          - list
          default: item
          description: '`item` returns the first match, `list` all matches.'
        output:
          type: string
          enum:
          - text
          - html
          - outer_html
          - attr
          - table_json
          - table_array
          - exists
          - count
          default: text
          description: What to return per match.
        attribute:
          type: string
          description: Attribute name; required when output=attr and forbidden otherwise.
        clean:
          type: boolean
          default: true
          description: Normalise whitespace in text output.
        nested:
          allOf:
          - $ref: '#/components/schemas/ScrapeExtractSelectorMap'
          description: Rules evaluated inside each match; requires output html or outer_html. Max nesting
            depth 5.
