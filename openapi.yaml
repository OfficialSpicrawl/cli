                summary: Pinned residential exit in Germany, 2-hour TTL
                value:
                  engine: chromium
                  ttl_seconds: 7200
                  premium_proxy: true
                  proxy_country: de
                  sticky_key: acct-4812
              importLogin:
                summary: Seed with an existing login
                value:
                  engine: obscura
                  rotate_ip: true
                  session_context:
                    cookies:
                    - name: sid
                      value: 9f2c1e7a
                      domain: .example.com
                      path: /
                      expires: 1790000000
                      http_only: true
                      secure: true
                      same_site: Lax
                    local_storage:
                      https://app.example.com:
                        token: eyJhbGciOi
                    session_storage: {}
                    indexed_db: {}
