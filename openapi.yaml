openapi: 3.1.0
info:
  title: Spicrawl API
  version: 1.0.0
  summary: Turn any URL into clean content or structured data with one request.
  description: |
    Spicrawl retrieves, renders and extracts web pages. One request shape serves every
    capability; you say what you want with flags and the platform chooses the rendering
    path, the proxy exit and the retries.

    Rules an agent should hold on to:

    - **Two statuses.** The HTTP status is the platform's. The target site's status is
      `X-Target-Status` (and `status` inside the JSON envelope, `target_status` on an
      error). A site that refused you is still a successful API call.
    - **Switch on `code`, retry on `retryable`.** Every error is `application/problem+json`
      with a stable `code` (`ERR::FAMILY::NAME`) and the server's own `retryable` verdict.
      Honour `Retry-After` / `retry_after_seconds`. Read `diagnostics.hint` when present:
      it names the parameter to change.
    - **Failures cost 0 credits.** `X-Credits-Charged` is what was billed;
      `X-Request-Cost` is what it would have cost; `X-Credits-Remaining` is the monthly
      allowance left after it.
    - **Not idempotent.** Retrying `POST /v1/scrape` performs and bills a second scrape.
    - **Unknown fields are rejected.** JSON bodies are decoded strictly; a misspelled
      field is a `400`, never silently ignored.
  contact:
    name: Spicrawl support
    url: https://docs.spicrawl.com
externalDocs:
  description: Guides and error reference
  url: https://docs.spicrawl.com
servers:
- url: https://api.spicrawl.com
  description: Production
- url: http://localhost:8080
  description: Local development
security:
- bearerAuth: []
tags:
- name: Scrape
  description: Fetch, render and extract one URL synchronously.
- name: Brand
  description: A site's brand assets (logos, colors, fonts, links) from one rendered page load.
- name: Batch
  description: Scrape many URLs as one asynchronous job.
- name: Sessions
  description: Reuse cookies, storage and an exit IP across requests.
- name: Browser
  description: Drive a hosted browser over a DevTools Protocol (CDP) WebSocket.
- name: Webhooks
  description: Register HTTPS endpoints that receive signed `batch.completed`, `batch.failed`, `monitor.changed`
    and `monitor.failed` notifications. Requires the `webhooks` scope; GET routes also accept `read`.
- name: Monitors
  description: Watch one page, or a whole site, for changes. Each check fetches the page through `/v1/scrape` rules and notifies a webhook endpoint when the watched content changes. Requires the `monitors` scope; GET routes also accept `read`.
- name: Requests
  description: Inspect the history of requests made in this key's project, or with the `read` scope in
    every project of its organization.
- name: Usage
  description: Credits and volume over time. Requires the `read` scope.
- name: Keys
  description: What the calling API key is.
- name: Partner
  description: Provision and manage the workspaces of a partner's end users. Requires the `partner` scope on a partner account's key. Rate limited per partner, 20 requests per second on every partner route (burst 60); the key-returning PUT allows 2 per second (burst 20). A refused call is `429 ERR::LIMIT::RATE_LIMITED` with `Retry-After`.
- name: Jobs
  description: Search the index of job postings crawled from Greenhouse, Lever, Ashby, Workable, SmartRecruiters, Recruitee, Breezy, Pinpoint, Personio, Workday, Y Combinator and Wellfound. Requires the `scrape` scope, and costs 2 credits per request.
- name: Fleet
  description: Deployment capacity and readiness.
- name: Health
  description: Liveness and readiness probes.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: spicrawl_live_… | spicrawl_test_…
      description: |
        `Authorization: Bearer <key>`. Read the key from the `SPICRAWL_API_KEY` environment
        variable; never hard-code or log it. `spicrawl_test_…` keys can never spend live
        credits. Scopes: `scrape`, `batch`, `sessions` (granted by default), `browser`
        and `read` (granted deliberately), and `partner` (only on a partner account's key).
        A missing scope is `403 ERR::AUTH::INSUFFICIENT_SCOPE` naming the scope.
    apiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: |
        The key as a query parameter. Only for clients that cannot set headers, such as
        a WebSocket upgrade from a browser-automation library. Prefer `bearerAuth` everywhere
        else, because URLs end up in logs.
  headers:
    Retry-After:
      description: Seconds to wait before retrying. Present on retryable errors.
      schema:
        type: integer
        minimum: 0
    X-Request-Id:
      description: ULID of this request. Quote it in support requests and use it with `GET /v1/requests/{id}`.
      schema:
        type: string
    X-RateLimit-Limit:
      description: Size of the key's rate-limit bucket, the most requests that can be sent back to back.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests left in that bucket. Never above `X-RateLimit-Limit`.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Seconds until the bucket has one request available again. Only sent when the limiter imposed a wait.
      schema:
        type: integer
    X-Jobs-Daily-Limit:
      description: Searches a workspace may run per day on `POST /v1/jobs/search`.
      schema:
        type: integer
    X-Jobs-Daily-Remaining:
      description: Searches left for the workspace today after this request. Absent when the count could not be read.
      schema:
        type: integer
    X-Jobs-Daily-Reset:
      description: Unix seconds of the next 12:00 AM IST (18:30 UTC), when the daily count resets.
      schema:
        type: integer
  schemas:
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code, `ERR::FAMILY::NAME`. Switch on this, not on
        `title` or `detail`. `x-spicrawl-errors` lists each code's HTTP status and
        whether it is retryable.
      enum:
      - ERR::AUTH::MISSING_KEY
      - ERR::AUTH::INVALID_KEY
      - ERR::AUTH::REVOKED_KEY
      - ERR::AUTH::EXPIRED_KEY
      - ERR::AUTH::FORBIDDEN
      - ERR::AUTH::INSUFFICIENT_SCOPE
      - ERR::AUTH::INVALID_TOKEN
      - ERR::AUTH::INVALID_CREDENTIALS
      - ERR::AUTH::ENGINE_NOT_ENTITLED
      - ERR::REQUEST::INVALID
      - ERR::REQUEST::MISSING_PARAMETER
      - ERR::REQUEST::INVALID_PARAMETER
      - ERR::REQUEST::INCOMPATIBLE_FLAGS
      - ERR::REQUEST::NOT_FOUND
      - ERR::REQUEST::BEYOND_RETENTION
      - ERR::REQUEST::CONFLICT
      - ERR::REQUEST::PAYLOAD_TOO_LARGE
      - ERR::REQUEST::RETIRED
      - ERR::SECURITY::SSRF_BLOCKED
      - ERR::SECURITY::URL_BLOCKED
      - ERR::SECURITY::INVALID_URL
      - ERR::SESSION::NOT_FOUND
      - ERR::SESSION::EXPIRED
      - ERR::SESSION::RELEASED
      - ERR::SESSION::BUSY
      - ERR::SESSION::STATE_CORRUPT
      - ERR::LIMIT::RATE_LIMITED
      - ERR::LIMIT::CONCURRENCY_EXCEEDED
      - ERR::LIMIT::QUOTA_EXCEEDED
      - ERR::LIMIT::MAX_COST_EXCEEDED
      - ERR::LIMIT::SESSIONS_EXCEEDED
      - ERR::LIMIT::PARTNER_WORKSPACE_LIMIT
      - ERR::LIMIT::DAILY_LIMIT_EXCEEDED
      - ERR::UPSTREAM::TIMEOUT
      - ERR::UPSTREAM::DNS_FAILED
      - ERR::UPSTREAM::TLS_FAILED
      - ERR::UPSTREAM::CONNECTION_RESET
      - ERR::UPSTREAM::TOO_MANY_REDIRECTS
      - ERR::UPSTREAM::ERROR
      - ERR::UPSTREAM::CHALLENGE
      - ERR::PROXY::EXHAUSTED
      - ERR::PROXY::UNREACHABLE
      - ERR::PROXY::AUTH_FAILED
      - ERR::PROXY::RATE_LIMITED
      - ERR::ENGINE::RENDER_FAILED
      - ERR::ENGINE::UNAVAILABLE
      - ERR::EXTRACT::FAILED
      - ERR::EXTRACT::INVALID_RULES
      - ERR::INTERNAL::ERROR
      - ERR::INTERNAL::UNAVAILABLE
      x-spicrawl-errors:
        ERR::AUTH::MISSING_KEY:
          status: 401
          retryable: false
          title: No API key supplied
        ERR::AUTH::INVALID_KEY:
          status: 401
          retryable: false
          title: API key not recognised
        ERR::AUTH::REVOKED_KEY:
          status: 401
          retryable: false
          title: API key has been revoked
        ERR::AUTH::EXPIRED_KEY:
          status: 401
          retryable: false
          title: API key has expired
        ERR::AUTH::FORBIDDEN:
          status: 403
          retryable: false
          title: Not permitted for this organization
        ERR::AUTH::INSUFFICIENT_SCOPE:
          status: 403
          retryable: false
          title: API key lacks the required scope
        ERR::AUTH::INVALID_TOKEN:
          status: 401
          retryable: false
          title: Session token is invalid or expired
        ERR::AUTH::INVALID_CREDENTIALS:
          status: 401
          retryable: false
          title: Email or password is incorrect
        ERR::AUTH::ENGINE_NOT_ENTITLED:
          status: 403
          retryable: false
          title: The organization's plan does not include this engine
        ERR::REQUEST::INVALID:
          status: 400
          retryable: false
          title: Request could not be understood
        ERR::REQUEST::MISSING_PARAMETER:
          status: 400
          retryable: false
          title: A required parameter is missing
        ERR::REQUEST::INVALID_PARAMETER:
          status: 400
          retryable: false
          title: A parameter has an invalid value
        ERR::REQUEST::INCOMPATIBLE_FLAGS:
          status: 400
          retryable: false
          title: Incompatible flag combination
        ERR::REQUEST::NOT_FOUND:
          status: 404
          retryable: false
          title: Resource not found
        ERR::REQUEST::BEYOND_RETENTION:
          status: 410
          retryable: false
          title: Beyond the request-log retention window
        ERR::REQUEST::CONFLICT:
          status: 409
          retryable: false
          title: Resource already exists
        ERR::REQUEST::PAYLOAD_TOO_LARGE:
          status: 413
          retryable: false
          title: Request body is too large
        ERR::REQUEST::CAPABILITY_UNSUPPORTED:
          status: 400
          retryable: false
          title: The request needs a capability that is not available
        ERR::SECURITY::SSRF_BLOCKED:
          status: 400
          retryable: false
          title: Target resolves to a private address
        ERR::SECURITY::URL_BLOCKED:
          status: 400
          retryable: false
          title: Target URL is blocked by policy
        ERR::SECURITY::INVALID_URL:
          status: 400
          retryable: false
          title: Target URL is not a valid http(s) URL
        ERR::SESSION::NOT_FOUND:
          status: 404
          retryable: false
          title: No such session
        ERR::SESSION::EXPIRED:
          status: 410
          retryable: false
          title: Session has expired and its context was purged
        ERR::SESSION::RELEASED:
          status: 410
          retryable: false
          title: Session was released and its context was purged
        ERR::SESSION::BUSY:
          status: 409
          retryable: true
          title: Session is in use by a running task
        ERR::SESSION::STATE_CORRUPT:
          status: 500
          retryable: false
          title: Stored session context could not be read
        ERR::LIMIT::RATE_LIMITED:
          status: 429
          retryable: true
          title: Rate limit exceeded
        ERR::LIMIT::CONCURRENCY_EXCEEDED:
          status: 429
          retryable: true
          title: Concurrency limit exceeded
        ERR::LIMIT::QUOTA_EXCEEDED:
          status: 402
          retryable: false
          title: Credit quota exhausted
        ERR::LIMIT::MAX_COST_EXCEEDED:
          status: 400
          retryable: false
          title: Request would exceed max_cost
        ERR::LIMIT::SESSIONS_EXCEEDED:
          status: 429
          retryable: true
          title: Too many live sessions
        ERR::LIMIT::PARTNER_WORKSPACE_LIMIT:
          status: 429
          retryable: true
          title: Partner daily workspace limit reached
        ERR::LIMIT::DAILY_LIMIT_EXCEEDED:
          status: 429
          retryable: false
          title: Daily job search limit reached
        ERR::UPSTREAM::TIMEOUT:
          status: 504
          retryable: true
          title: Target did not respond in time
        ERR::UPSTREAM::DNS_FAILED:
          status: 502
          retryable: true
          title: Target hostname could not be resolved
        ERR::UPSTREAM::TLS_FAILED:
          status: 502
          retryable: true
          title: TLS handshake with the target failed
        ERR::UPSTREAM::CONNECTION_RESET:
          status: 502
          retryable: true
          title: Target closed the connection
        ERR::UPSTREAM::TOO_MANY_REDIRECTS:
          status: 502
          retryable: false
          title: Too many redirects
        ERR::UPSTREAM::ERROR:
          status: 502
          retryable: true
          title: Target request failed
        ERR::UPSTREAM::CHALLENGE:
          status: 502
          retryable: true
          title: Target served a bot challenge
          description: An anti-bot vendor (or Reddit's block page) served a challenge instead of the content, or a plain fetch returned a near-empty script-driven HTML page. Charged 0 credits.
        ERR::PROXY::EXHAUSTED:
          status: 503
          retryable: true
          title: No healthy proxy exit available
        ERR::PROXY::UNREACHABLE:
          status: 502
          retryable: false
          title: Supplied proxy is unreachable
        ERR::PROXY::AUTH_FAILED:
          status: 502
          retryable: false
          title: Proxy rejected the credentials
        ERR::PROXY::RATE_LIMITED:
          status: 502
          retryable: true
          title: Proxy exit is rate limited
        ERR::ENGINE::RENDER_FAILED:
          status: 502
          retryable: true
          title: The page could not be rendered
        ERR::ENGINE::UNAVAILABLE:
          status: 503
          retryable: true
          title: No engine capacity available
        ERR::EXTRACT::FAILED:
          status: 502
          retryable: false
          title: The document could not be extracted
        ERR::EXTRACT::INVALID_RULES:
          status: 400
          retryable: false
          title: The extraction rules are invalid
        ERR::INTERNAL::ERROR:
          status: 500
          retryable: true
          title: Internal error
        ERR::INTERNAL::UNAVAILABLE:
          status: 503
          retryable: true
          title: Service temporarily unavailable
    Problem:
      type: object
      description: |
        RFC 7807 error body, served as `application/problem+json`. Switch on `code`;
        retry only when `retryable` is true, after `retry_after_seconds`.
      required:
      - type
      - title
      - status
      - code
      - retryable
      - doc_url
      - target_status
      properties:
        type:
          type: string
          format: uri
          description: Link to this code's entry in the error reference.
        title:
          type: string
          description: Short fixed summary of the code. Do not parse it.
        status:
          type: integer
          description: The platform's HTTP status for this response. Not the target site's.
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: What happened on this occurrence, in prose. Useful to show a human; do not parse
            it.
        retryable:
          type: boolean
          description: The server's own verdict on whether the same request can succeed on retry. Prefer
            it to guessing from `status`.
        doc_url:
          type: string
          format: uri
          description: Documentation for this code, including how to fix it.
        request_id:
          type: string
          description: ULID of the failed request. Pass it to `GET /v1/requests/{id}` for the full trace.
        instance:
          type: string
          description: Request path that produced the error.
        target_status:
          type:
          - integer
          - 'null'
          description: The target site's HTTP status when the failure came from the site, otherwise null.
        retry_after_seconds:
          type: integer
          minimum: 0
          description: Mirrors the `Retry-After` header for clients that read only the body.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal decisions the platform made for you, such as a flag ignored by proxy
            precedence.
        notes:
          type: array
          items:
            type: string
          description: Advice for the caller, not a problem. On a failed scrape, the same text as diagnostics.hint
            (also sent on X-Note).
        diagnostics:
          $ref: '#/components/schemas/ProblemDiagnostics'
    ProblemDiagnostics:
      type: object
      description: Where the request failed and whether the platform, the proxy or the target was at fault.
      properties:
        failed_at:
          type: string
          description: Name of the stage that failed; always the last row of `timeline`.
        timeline:
          type: array
          description: Stages in order, stopping at the failure.
          items:
            type: object
            required:
            - stage
            - ms
            - ok
            properties:
              stage:
                type: string
                description: Stage name.
              ms:
                type: integer
                description: Time spent in the stage in milliseconds.
              ok:
                type: boolean
                description: False only on the failing stage.
              detail:
                type: string
                description: What happened in the stage.
        attempts:
          type: array
          description: Each execution attempt. Under `mode=auto` these span the escalation ladder.
          items:
            type: object
            required:
            - n
            - outcome
            - ms
            properties:
              n:
                type: integer
                description: Attempt number, from 1.
              engine:
                type: string
                enum:
                - fetch
                - js
                - browser
                description: Rendering tier this attempt used (`fetch`, `js` for JavaScript rendering, `browser` for full-browser rendering).
              proxy:
                type: string
                description: Redacted exit label or proxy scheme and host. Never contains credentials.
              outcome:
                type: string
                description: How the attempt ended.
              ms:
                type: integer
                description: Attempt duration in milliseconds.
              error_code:
                $ref: '#/components/schemas/ErrorCode'
        budget_ms:
          type: integer
          description: Time budget the request had, in milliseconds. Compare with `elapsed_ms` to tell
            a timeout from a refusal.
        elapsed_ms:
          type: integer
          description: Time actually spent, in milliseconds.
        engine:
          type: string
          enum:
          - fetch
          - js
          - browser
          description: Rendering tier that served the final attempt.
        proxy:
          type: object
          description: Redacted description of the exit used.
          required:
          - source
          properties:
            source:
              type: string
              description: 'Where the exit came from: `pool`, `custom` or `direct`.'
            endpoint:
              type: string
              description: Exit identifier. Not the exit IP.
            country:
              type: string
              description: Exit country, ISO 3166-1 alpha-2 lowercase.
        hint:
          type: string
          description: The next thing to try, naming the parameter to change. Act on it before retrying
            the same request.
    ScrapeRequest:
      type: object
      additionalProperties: false
      required:
      - url
      description: Body of POST /v1/scrape. Unknown fields (including nested ones) are rejected with 400
        ERR::REQUEST::INVALID_PARAMETER; a wrong JSON type is 400 naming the field. Max body 1 MiB (413).
      properties:
        url:
          type: string
          format: uri
          maxLength: 8192
          description: Target URL; required, must be http or https with a host. A private or reserved
            address fails with 400 ERR::SECURITY::SSRF_BLOCKED at 0 credits.
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
          - OPTIONS
          default: GET
          description: HTTP method sent to the target (case-insensitive). There is no request-body parameter,
            so non-GET methods are sent without a body; only GET/HEAD/OPTIONS are retried on transient
            failure and only GET results are cached.
        js_render:
          type: boolean
          default: false
          description: Run the page's JavaScript before capture (3 credits on datacenter or your own proxy; 25 on managed
            residential exits, coming soon). Required by every browser-only flag unless stealth or mode=auto is set; cannot be combined
            with mode=auto. If omitted, the project's stored default applies.
        stealth:
          type: boolean
          default: false
          description: Coming soon. Render with full-browser rendering hardened against bot detection, flat 25 credits at any
            proxy tier; wins over js_render when both are set. Cannot be combined with mode=auto; returns
            503 ERR::ENGINE::UNAVAILABLE where it is not available.
            If omitted, the project's stored default applies.
        solve_captcha:
          type: boolean
          default: false
          description: Solve the captcha widgets embedded in the page (Cloudflare Turnstile, reCAPTCHA v2, hCaptcha) before
            `actions` run. Selects full-browser rendering, as `stealth` does. Cannot be combined with mode=auto, which returns
            400 ERR::REQUEST::INCOMPATIBLE_FLAGS. Blocking challenge pages are solved on full-browser renders without this flag
            when the platform has a provider configured. A successful solve adds 5 credits (see x-spicrawl-credits).
        impersonate:
          type: boolean
          default: true
          description: 'Fetch tier only: present a current browser TLS/HTTP2 fingerprint, with matching
            browser headers and Accept-Encoding, to pass passive fingerprint checks. On by default, free,
            no JavaScript; `false` turns it off and the fetch uses a non-browser TLS handshake. Ignored
            on rendered requests. If omitted, the project''s stored default applies, and `true` when the project sets
            none.'
        mode:
          type: string
          enum:
          - auto
          description: '`auto` escalates through the rendering tiers (plain fetch, then JavaScript rendering) until one returns a usable page,
            billing only the rung that succeeded (0 if all fail) while reserving the dearest rung against
            quota. Incompatible with js_render and stealth. If omitted, the project''s stored
            default applies.'
        engine:
          type: string
          deprecated: true
          description: 'Deprecated and ignored; rendering is chosen automatically from the request''s flags and the page, and you are billed for the rendering tier actually used (`X-Engine`). Accepted so existing clients keep working. The response carries `X-Warning: ENGINE_IGNORED`.'
        premium_proxy:
          type: boolean
          default: false
          description: 'Coming soon; not available yet, so bring your own `proxy` (residential works best). Will use residential exits from the
            managed pool: 10 credits for a plain fetch, 25 with JavaScript rendering, 32 with full-browser rendering
            (stealth stays 25). If no residential exit is available the request fails 503 ERR::PROXY::EXHAUSTED
            rather than falling back; ignored (with X-Warning PROXY_FLAG_IGNORED) when `proxy` is set.
            See "Bot challenges" in the operation description. If omitted, the project''s stored default
            applies.'
        proxy_country:
          type: string
          pattern: ^[A-Za-z]{2}$
          description: Coming soon. ISO 3166-1 alpha-2 exit country (case-insensitive), within the residential pool.
            Requires premium_proxy=true (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise) unless `proxy`
            is set, in which case it is kept as the render environment hint (browser timezone and
            locale follow it) while the custom URL stays the exit; an unavailable country is 503 ERR::PROXY::EXHAUSTED,
            never substituted. A browser render takes its timezone and locale from this country or, when
            it is omitted, from the country of the pool exit it was assigned. If omitted, the project's
            stored default applies.
        proxy:
          type: string
          description: Your own proxy URL (http, https, socks5 or socks5h; credentials in userinfo). Takes
            precedence over premium_proxy and adds 0 proxy credits; proxy_country is kept as the render environment hint; loopback hosts are refused
            with 400 ERR::SECURITY::SSRF_BLOCKED. An unreachable proxy fails 502 ERR::PROXY::UNREACHABLE.
            A bot challenge from a named vendor is escalated automatically to stronger rendering on the same exit when the proxy is http:// (residential works best); see "Bot
            challenges" in the operation description.
        proxy_verify:
          type: boolean
          default: false
          description: Probe the custom `proxy` before spending the engine cost so a dead proxy fails
            fast. Requires `proxy` (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise).
        session_id:
          type: string
          description: Reuse a session's cookies and storage (created via /v1/sessions); the request runs
            with the session's own rendering. Checked
            before any work, at 0 credits and not retryable - an unknown, malformed or other organization's
            id is 404 ERR::SESSION::NOT_FOUND, a released session 410 ERR::SESSION::RELEASED, an expired one
            410 ERR::SESSION::EXPIRED. A successful request increments the session's `usage_count`, sets
            `last_used_at` and slides `expires_at`. Requests with a session are never cached.
        sticky_key:
          type: string
          description: Coming soon. Any string; requests sharing it reuse the same pool exit. Forces a pool exit even
            on deployments whose default is direct egress, so it can fail 503 ERR::PROXY::EXHAUSTED where
            no pool exists.
        wait:
          type: integer
          minimum: 0
          maximum: 30000
          default: 0
          description: 'Milliseconds to wait after load before capture. Browser-only: needs js_render,
            stealth, or mode=auto, else 400 ERR::REQUEST::INCOMPATIBLE_FLAGS.'
        wait_for:
          type: string
          description: CSS selector to wait for before capture. Browser-only. If it never appears the
            page is returned as it stood with an X-Warning RENDER_DEGRADED; if the render times out waiting
            it fails 504 ERR::UPSTREAM::TIMEOUT - raise wait_for_timeout or fix the selector.
        wait_for_timeout:
          type: integer
          minimum: 0
          maximum: 120000
          default: 0
          description: Milliseconds to wait for `wait_for`; 0 uses the engine default. Requires wait_for
            (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise).
        actions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ScrapeAction'
          description: Ordered browser workflow (click, fill, scroll, ...), validated before anything
            is spent. Browser-only and makes the request uncacheable.
            A failed step ends the request at 0 credits unless that step has on_error=skip.
        scroll_pages:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
          description: 'Scroll to the bottom up to this many times before capture, stopping early once the page stops growing. For infinite-scroll pages (feeds, search results, social timelines) where only the first screen is in the page until scrolled. Shorthand for a trailing {"scroll": {"to_bottom": true, "max_iterations": N}} step after actions. Routes like actions: full-browser rendering. With neither js_render nor mode=auto it is 400 ERR::REQUEST::INCOMPATIBLE_FLAGS. Out of range is 400 ERR::REQUEST::INVALID_PARAMETER. Refused on /v1/batch with 400 INVALID_PARAMETER. If scrolling stops early, the page is returned with the warning scroll_pages: scrolling stopped early: reason.'
        block_resources:
          type: array
          uniqueItems: false
          items:
            type: string
            enum:
            - none
            - document
            - documents
            - stylesheet
            - stylesheets
            - css
            - image
            - images
            - media
            - font
            - fonts
            - script
            - scripts
            - js
            - xhr
            - fetch
            - websocket
            - websockets
            - other
          description: Subresource classes the browser must not load (plural and short aliases accepted,
            case-insensitive). If omitted, full-browser rendering blocks nothing, so images and fonts load,
            including for screenshot, pdf, actions and anti-bot escalation. A list blocks exactly the
            classes named and `none` (alone) blocks nothing. Any value other than `none` is browser-only.
            If omitted, the project's stored default applies.
        headless:
          type: boolean
          deprecated: true
          description: 'Deprecated and ignored. Rendering is chosen automatically. Accepted so existing clients keep working. The response carries `X-Warning: ENGINE_IGNORED`.'
        screenshot:
          type: boolean
          default: false
          description: Capture a screenshot; forces the JSON envelope (image base64 under `screenshots`).
            Rendered with full-browser rendering - on a deployment without it, 400 ERR::REQUEST::CAPABILITY_UNSUPPORTED
            at 0 credits. mode=auto cannot satisfy it (its fetch rung has no rasteriser). If the image
            is not delivered the page is still returned but charged 0.
        screenshot_fullpage:
          type: boolean
          default: false
          description: Capture the full scrollable page. Requires screenshot=true; mutually exclusive
            with screenshot_selector.
        screenshot_selector:
          type: string
          description: CSS selector of the element to capture. Requires screenshot=true; mutually exclusive
            with screenshot_fullpage.
        screenshot_format:
          type: string
          enum:
          - png
          - jpeg
          - jpg
          - webp
          description: Image format; omitted uses the engine default (png). Not validated by the API -
            an unrecognised value silently falls back to the engine default.
        screenshot_quality:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Lossy quality for jpeg/webp; 0 uses the engine default. A value above 0 requires
            screenshot=true.
        custom_headers:
          type: object
          additionalProperties:
            type: string
          description: Headers sent to the target, as name -> string value. Hop-by-hop headers (Connection,
            Keep-Alive, Proxy-Authenticate, Proxy-Authorization, TE, Trailer, Transfer-Encoding, Upgrade,
            Host, Content-Length) are refused with 400 ERR::REQUEST::INVALID_PARAMETER. If omitted, the
            project's stored default applies.
        network_capture:
          allOf:
          - $ref: '#/components/schemas/NetworkCapture'
          description: Record the XHR/fetch responses the page itself made (often cleaner JSON than the
            DOM), returned under `network` in the JSON envelope. Browser-only (`js_render` or `stealth`); no extra credits.
        autoparse:
          type: boolean
          default: false
          description: Harvest the page's own structured metadata (JSON-LD, OpenGraph, Twitter, microdata,
            RDFa, meta, embedded SPA state) into `data`, no selectors needed. Forces the JSON envelope;
            no extra credits; refused on a PDF.
        links:
          type: boolean
          default: false
          description: Return the page's absolute, de-duplicated <a href> targets under `links`. Forces
            the JSON envelope; no extra credits; refused on a PDF. If omitted, the project's stored default
            applies.
        extract:
          allOf:
          - $ref: '#/components/schemas/ScrapeExtract'
          description: 'Selector extraction into `data`: a selector map, or a JSON Schema whose properties
            carry `selector`. Forces the JSON envelope, validated before fetching, no extra credits; mutually
            exclusive with extract_preset. Rules that match nothing are listed in `empty_fields`.'
        extract_preset:
          type: string
          description: Coming soon. Name of a server-side extraction preset. This deployment has no preset store, so
            any value fails with 400 ERR::EXTRACT::INVALID_RULES (at 0 credits, after the fetch); use
            `extract` inline. Mutually exclusive with extract.
        ai_extract:
          allOf:
          - $ref: '#/components/schemas/AIExtract'
          description: Coming soon. Model-driven extraction into `data`; adds 4 credits. Refused with 503 ERR::INTERNAL::UNAVAILABLE
            where no model is configured, and a model failure is 502 ERR::EXTRACT::FAILED at 0 credits.
            Forces the JSON envelope.
        main_content_only:
          type: boolean
          description: true strips nav/footer/aside to the main article; false keeps the whole document.
            Omitted is on by default for markdown, text and json, and off for html; pass false to keep the whole page.
            Applies to markdown/text/cleaned output. A request or project value always wins.
        sections:
          type: boolean
          default: false
          description: Return `sections` (the main-content markdown split at its ATX headings) in the JSON envelope.
            Applies only to an explicit `response_format=json`; ignored for other formats.
        include_tags:
          type: array
          items:
            type: string
          description: CSS selectors; keep only matching subtrees before extraction and markdown conversion.
            Applied before exclude_tags and main_content_only.
        exclude_tags:
          type: array
          items:
            type: string
          description: CSS selectors; remove matching elements, applied after include_tags and before
            main_content_only.
        parse_pdf:
          type: boolean
          default: true
          description: When the target returns a PDF and markdown/text is requested, parse it to text.
            false refuses it with 502 ERR::EXTRACT::FAILED (0 credits); response_format=html always returns
            the raw bytes. If omitted, the project's stored default applies.
        response_format:
          type: string
          enum:
          - html
          - markdown
          - text
          - json
          - pdf
          default: html
          description: 'Body shape: html/markdown/text return the document itself, json the envelope
            (BREAKING CHANGE: an explicit json request now gets the main-content markdown as `content` and
            heading-split `sections`, not the raw HTML), pdf a PDF printed by a real browser (needs full-browser rendering). extract, autoparse, links, ai_extract,
            network_capture or screenshot override this to the JSON envelope with X-Warning FORMAT_COERCED.
            A non-HTML target (image, binary) requested as markdown/text fails 502 ERR::EXTRACT::FAILED
            at 0 credits. If omitted, the project''s stored default applies.'
        cache:
          type: boolean
          default: true
          description: 'Serve a stored result younger than cache_ttl (Cache-State: hit). A hit is billed at
            the same price as the fetch that stored it: the cache saves the fetch (latency and load on
            the target), not credits. Only billable successes of GET-method requests without session_id
            or actions are stored. Set false for time-sensitive data; cache=false with cache_ttl>0 is
            400 ERR::REQUEST::INCOMPATIBLE_FLAGS.'
        cache_ttl:
          type: integer
          minimum: 0
          default: 172800
          description: Maximum acceptable age of a cached result, in seconds. Default and cap are deployment
            settings (48h by default); larger values are clamped with X-Warning CACHE_TTL_CLAMPED. 0 disables
            caching for this request.
        max_cost:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Credit ceiling; 0 means none. Checked against the dearest reachable outcome (the
            top rung under mode=auto) before anything runs, failing 400 ERR::LIMIT::MAX_COST_EXCEEDED
            at 0 credits. It is also the only way a bot-challenge climb may bill above the request's own
            price: a request is never billed above its own price unless `max_cost` or `mode=auto` allows
            it, so without `max_cost` a challenged request returns ERR::UPSTREAM::CHALLENGE at 0 credits
            rather than climbing to a browser. Set it to the browser rung's price to allow the climb.
        original_status:
          type: boolean
          default: false
          description: 'On success, use the target''s status as this response''s HTTP status instead of
            200. Leave off unless you need it: it makes a target 404 indistinguishable from an API error
            by status alone.'
        allowed_status_codes:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
          description: Extra target statuses to treat as billable successes (200, 404 and 410 always are).
            Other statuses return the target's body at 0 credits, and under mode=auto trigger escalation.
    ScrapeActionWaitFor:
      type: object
      title: wait_for
      description: Wait for a selector, or sleep.
      required:
      - wait_for
      additionalProperties: false
      properties:
        wait_for:
          oneOf:
          - type: string
            minLength: 1
            description: 'Shorthand: CSS selector to wait for.'
          - type: object
            properties:
              selector:
                type: string
                description: CSS selector to wait for.
              ms:
                type: integer
