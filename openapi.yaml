        '500':
          $ref: '#/components/responses/ServerError'
  /v1/key:
    get:
      tags:
      - Keys
      operationId: keyInfo
      summary: What this API key is
      description: |
        Returns the key's id, name, prefix, scopes, environment, organization, and whether the key belongs to a
