            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextDump'
              examples:
                dump:
                  value:
                    session_id: 01J9ZQ4M7R3T8VX2K5N6P0B1CD
                    schema_version: 1
                    session_context:
                      cookies:
                      - name: sid
                        value: 9f2c1e7a
                        domain: .example.com
                        path: /
                        expires: 1790000000
                        http_only: true
                        secure: true
                        same_site: Lax
                      local_storage:
                        https://app.example.com:
                          token: eyJhbGciOi
                      session_storage: {}
                      indexed_db: {}
                    fingerprint: null
                    domain_scores:
                      example.com:
                        score: 0.5
                        good: 12
                        bad: 1
                        last_updated: 1790000500000
                        retired: false
                    usage_count: 3
                    created_at: '2026-09-22T10:00:00Z'
                    last_used_at: '2026-09-22T10:05:12Z'
                    expires_at: '2026-09-22T12:05:12Z'
