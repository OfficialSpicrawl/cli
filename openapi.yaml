        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/browser:
    get:
      tags:
      - Browser
      operationId: browserConnect
      summary: Coming soon. Open a Chrome DevTools Protocol WebSocket to a cloud browser
      description: |
        Coming soon.
        A WebSocket upgrade, not a JSON endpoint. Connect with `puppeteer.connect({browserWSEndpoint})` or
        `chromium.connectOverCDP(url)`. Authenticate with, in order of preference: `Authorization: Bearer <key>`
        on the upgrade; a single-use `token` from `POST /v1/browser/token` (60 s, one connection, bound to its
        options — the URL the CLI and MCP return); or the `apikey` query parameter (`api_key` alias), kept for
        ZenRows-style URLs. When `token` is present it is the only credential consulted. Requires the
        `browser` scope.

        Every refusal happens before the upgrade and is an RFC 7807 problem. After the 101 there is no HTTP
        response left; the session ends by closing the TCP connection, never with a close frame or error
        message.

        Why a session ends (recorded server-side, not sent to you):
        `client_closed` (you disconnected, or stopped answering WebSocket pings: the API pings every 15 s and
        closes after 2 unanswered, so a half-open client frees its slot within about 30 s),
        `ttl_expired` (`session_ttl` elapsed; a hard wall, not idle),
        `idle_timeout` (no CDP messages in either direction for the deployment idle timeout, 2 minutes by
        default, measured from the last message; pings and pongs do not count),
        `byte_limit` (the deployment's per-session traffic cap was reached, if configured),
        `upstream_closed` (the browser went away).

        Pricing: a session costs 8 credits per started minute, the same as one real-Chromium page. At
        admission the session HOLDS the price of its whole `session_ttl` against the monthly credit
        allowance (default `session_ttl` 180 s = 24 credits; 60–900 s range = 8–120 credits). At close it
        is charged for the minutes it actually held (rounded up, capped at `session_ttl`'s minutes) and
        the unused part of the hold is returned immediately. A session the platform ends (upstream closed,
        or API shutdown) costs 0; a session that never opens costs 0 and returns its hold.
        While the operator has switched billing off, sessions hold and cost 0.

        Admission, before the upgrade, in this order:
        - Rate limit on session opens per key: 429 `ERR::LIMIT::RATE_LIMITED`, with `X-RateLimit-*` and `Retry-After`.
        - Monthly credit allowance cannot cover the whole `session_ttl` hold: 402 `ERR::LIMIT::QUOTA_EXCEEDED`,
          refused before any browser is leased. A shorter `session_ttl` may fit.
        - Simultaneous sessions per organization (`browser_concurrency`, default 2): 429
          `ERR::LIMIT::CONCURRENCY_EXCEEDED`, `Retry-After: 5`, `Concurrency-Limit`/`Concurrency-Remaining: 0`.
          The slot is held until the socket closes, so always close your browser.
        - If the limiter store is unreachable the session is refused (fail closed): 503
          `ERR::INTERNAL::UNAVAILABLE`, `Retry-After: 10`.
        - No CDP backend on this deployment: 501 `ERR::ENGINE::UNAVAILABLE`, `retryable: false`. Do not retry.

        Rate and concurrency headers appear only on refusals; the 101 is the browser backend's handshake
        forwarded verbatim.
      security:
      - bearerAuth: []
      - apiKeyQuery: []
      x-spicrawl-scope: browser
      parameters:
      - name: token
        in: query
        description: A single-use browser token from `POST /v1/browser/token`. Consumed on arrival, whatever
          happens next; expires 60 s after issue; revoked with the key that minted it. The session options
          are the ones bound into the token; an option in the URL that differs from (or was not part of) the
          binding is refused with 400 `ERR::REQUEST::INVALID_PARAMETER`. A used, expired or unknown token is
          401 `ERR::AUTH::INVALID_KEY`.
        schema:
          type: string
          examples:
          - wbt_Q2hhbmdlTWVJbkEtVGVzdC1Ub2tlbi1FeGFtcGxlLVZhbHVlMDE
      - name: apikey
        in: query
        description: The API key, for WebSocket clients that cannot set headers. `api_key` is accepted
          as an alias. Ignored when an `Authorization` Bearer header is present. Keep the URL out of logs
          you do not control.
        schema:
          type: string
          examples:
          - spicrawl_live_…
      - name: api_key
        in: query
        description: Alias for `apikey`, consulted only when `apikey` is absent or blank.
        schema:
          type: string
      - name: engine
        in: query
        description: Which browser serves the session. Case-insensitive. `fetch` and `camoufox` are refused
          with 400 because neither speaks CDP. Omitted means the deployment default, `chromium`.
        schema:
          type: string
          enum:
          - chromium
          - obscura
          default: chromium
      - name: proxy_region
        in: query
        description: Broad exit region such as `eu`. Case-insensitive. `global` means no constraint and
          is the same as omitting it. Cannot be combined with `proxy_country`.
        schema:
          type: string
          default: global
          examples:
          - eu
      - name: proxy_country
        in: query
        description: Exit country as a two-letter ISO 3166-1 alpha-2 code (case-insensitive, normalised
          to lowercase). Combining it with a non-`global` `proxy_region` is refused with 400 `ERR::REQUEST::INCOMPATIBLE_FLAGS`.
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
          examples:
          - de
      - name: session_ttl
        in: query
        description: Hard session lifetime in whole seconds. Out-of-range values are refused, not clamped.
          When it elapses the socket is closed even mid-command.
        schema:
          type: integer
          minimum: 60
          maximum: 900
          default: 180
      - name: headless
        in: query
        description: '`true`/`1` or `false`/`0` (case-insensitive); anything else is 400. Omitted defers
          to the deployment. `false` attaches a display. `headless=false` with `engine=obscura` is refused
          with 400 `ERR::REQUEST::INCOMPATIBLE_FLAGS`.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - '1'
          - '0'
      - name: sticky_key
        in: query
        description: Pins the exit for the session. 2-64 letters, digits and hyphens; no underscores.
          Omitted means the exit rotates, the opposite of `/v1/sessions`.
        schema:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[A-Za-z0-9-]{2,64}$
      - name: Upgrade
        in: header
        required: true
        description: Must be `websocket` (case-insensitive). A plain HTTP GET is refused with 400 `ERR::REQUEST::INVALID`.
        schema:
          type: string
          const: websocket
      - name: Connection
        in: header
        required: true
        description: Must contain the token `Upgrade`.
        schema:
          type: string
          examples:
          - Upgrade
      - name: Sec-WebSocket-Key
        in: header
        required: true
        description: Forwarded to the browser backend unchanged; the returned `Sec-WebSocket-Accept` is
          computed from it. Your WebSocket library sets it.
        schema:
          type: string
      - name: Sec-WebSocket-Version
        in: header
        required: true
        description: Forwarded unchanged. Normally `13`.
        schema:
          type: string
          examples:
          - '13'
      responses:
        '101':
          description: Switching Protocols. The socket now carries raw CDP JSON messages in both directions,
            spliced to the browser without inspection.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          description: |
            The browser backend could not be reached or refused the session (`ERR::UPSTREAM::ERROR`), or the
            worker reported another upstream-class code. Not caused by your request; retry with backoff and
            quote the `request_id` if it persists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
