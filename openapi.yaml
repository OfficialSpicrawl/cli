              examples:
                fleet:
                  value:
                    kinds:
                    - kind: browser
                      present: 1
                      ready: 1
                      workers:
                      - worker_id: browser-7f9c
                        kind: browser
                        capacity: 4
                        in_flight: 1
                        free_slots: 3
                        ready: true
                        task_stream: tasks:browser
                        address: 192.0.2.21:50052
                        last_seen_ms: 812
                    - kind: egress
                      present: 0
                      ready: 0
                      workers: []
                    - kind: extract
                      present: 0
                      ready: 0
                      workers: []
                    - kind: batch
                      present: 0
                      ready: 0
                      workers: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/partner/summary:
    get:
      tags:
      - Partner
      operationId: partnerSummary
      summary: The partner's account at a glance
      description: |
        The partner's allowance, its users and caps, and its balance (the same figures as `GET /v1/partner/wallet`
        under `balance`), in one call. `users` and `caps` are computed in one statement from the partner's
        workspaces: `caps.committed` is the sum of the effective cap of each active workspace that has one, and
        `caps.uncapped_users` counts the active ones that have none.
      security:
      - bearerAuth: []
      x-spicrawl-scope: partner
      responses:
        '200':
          description: The partner's summary.
