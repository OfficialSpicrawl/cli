  /v1/usage/reconciliation:
    get:
      tags:
      - Usage
      operationId: usageReconciliation
      summary: Report drift between billed usage and the request log for one day
      description: |
        Compares billed usage for one UTC day with usage re-derived from the Postgres request log. Report only;
        nothing is repaired (`repairable` is always false).

        Pitfalls:
        - Read `interpretation` before `drift`. In the current deployment the Postgres request log is usually
          empty (`request_log_rows: 0`), so every billed row shows as `absent_from_request_log`. That is not
          evidence of overbilling.
        - Defaults to yesterday (UTC); today is still accumulating.
      security:
      - bearerAuth: []
      x-spicrawl-scope: read
      parameters:
      - name: day
        in: query
        description: UTC day to reconcile, `YYYY-MM-DD`. Defaults to yesterday.
        schema:
          type: string
          format: date
          examples:
          - '2026-09-21'
      responses:
        '200':
          description: The drift report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReconciliation'
              examples:
                emptyLog:
                  value:
                    day: '2026-09-21'
                    drift:
                    - project_id: 01J9Y0000000000000000PROJ1
                      metric: credits
                      stored_qty: 3100000000
                      observed_qty: 0
                      delta: -3100000000
                      action: absent_from_request_log
                    request_log_rows: 0
                    interpretation: The Postgres request log holds no rows for this day, so there is nothing
                      to re-derive usage from and every billed row is reported as `absent_from_request_log`.
                      ...
                    repairable: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/usage/credits:
    get:
      tags:
      - Usage
      operationId: usageCredits
      summary: List the credit grants and adjustments on the organization's account
      description: |
        The organization's credit history: grants, adjustments, refunds, expiries, purchases, the
        carried-over balance and credits assigned to or from a partner workspace (`transfer_out`,
        `transfer_in`), newest first. Consumption is not listed; the daily rows of
        `GET /v1/usage` say what was spent.

        Each entry's `amount_micro` is the signed change to the spendable balance (micro-credits, 1
        credit = 1000000). `label` is a fixed, customer-facing description chosen from the kind; it is
        never free text. Operator notes, ticket references and the identity of whoever posted an entry
        are not returned.

        Paging is keyset: pass `next_cursor` back verbatim as `cursor`. `next_cursor` is `null` on the
        last page.
      security:
      - bearerAuth: []
      x-spicrawl-scope: read
      parameters:
      - name: limit
        in: query
        description: Entries per page, 1 to 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page. Omit for the newest entries.
        schema:
          type: string
      responses:
        '200':
          description: One page of credit history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsResponse'
              examples:
                firstPage:
                  value:
                    items:
                    - id: 01J9Y0000000000000000CRD1
                      created_at: '2026-11-03T09:14:22.108Z'
                      amount_micro: 5000000000
                      kind: promo_grant
                      label: Credits added by Spicrawl
                    - id: 01J9Y0000000000000000CRD0
                      created_at: '2026-11-01T00:00:00Z'
                      amount_micro: 1000000000
                      kind: plan_grant
                      label: Plan allowance
                    next_cursor: MjAyNi0xMS0wMVQwMDowMDowMFp8MDFKOVkwMDAwMDAwMDAwMDAwMDAwQ1JEMA
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/workers:
    get:
      tags:
      - Fleet
      operationId: fleetListWorkers
      summary: List the deployment's workers, grouped by kind
      description: |
        Reports deployment shape: for each worker kind (`browser`, `egress`, `extract`, `batch`, always in that
        order and always all four), how many workers are publishing, how many are ready, and each one's load.
        Contains no tenant data. Any valid key may call it.

        Use it to explain queuing or `ERR::ENGINE::UNAVAILABLE`: a kind with `present: 0` or `ready: 0` cannot
        take work. `last_seen_ms` is an age; a large value means the worker stopped publishing.
      security:
      - bearerAuth: []
