        - schema
        not:
          required:
          - prompt
    ScrapeExtractRule:
      type: object
      additionalProperties: true
      required:
      - selector
      description: One extraction rule. Unrecognised keys are ignored.
      properties:
        selector:
          type: string
          minLength: 1
          description: CSS selector or XPath expression.
        type:
          type: string
          enum:
          - css
          - xpath
          default: css
          description: Selector language.
        kind:
          type: string
          enum:
          - item
          - list
          default: item
          description: '`item` returns the first match, `list` all matches.'
        output:
          type: string
          enum:
          - text
          - html
          - outer_html
          - attr
          - table_json
          - table_array
