                      used_micro: 430000000
                      remaining_micro: 570000000
                      window_start: '2026-09-14T00:00:00Z'
                      resets_at: '2026-10-14T00:00:00Z'
                    metrics:
                      requests: 10630
                      credits: 42500000000
                      engine_ms: 18200000
                    unattributed:
                      requests: 10630
                      credits: 42500000000
                      engine_ms: 18200000
                    usage_as_of: '2026-09-22T11:55:00Z'
                    stale_seconds: 300
                no_subscription:
                  summary: No subscription (the free allowance)
                  value:
                    period:
                      start: '2026-09-14'
                      end: '2026-10-14'
                      days: 30
                      bounds: '[start, end)'
                    period_elapsed_days: 8
                    plan:
