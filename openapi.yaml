        label:
          type: string
          description: '`final` for the top-level screenshot, or the owning action''s label.'
        encoding:
          type: string
          const: base64
        data:
          type: string
          contentEncoding: base64
          description: Image bytes.
        size_bytes:
          type: integer
          description: Decoded length of `data`.
        format:
          type: string
          enum:
          - png
          - jpeg
          - webp
        width:
          type: integer
          description: Omitted when not measured.
        height:
          type: integer
          description: Omitted when not measured.
    ScrapeNetworkResponse:
      type: object
      required:
      - url
      - status
      - resource_type
      properties:
        url:
          type: string
        status:
          type: integer
        resource_type:
          type: string
        content_type:
          type: string
        duration_ms:
          type: integer
        from_cache:
          type: boolean
        body_truncated:
          type: boolean
          description: Body was cut at max_body_bytes; truncated JSON is delivered as base64.
        body:
          description: Parsed JSON body, present when the response was complete, valid JSON with a JSON
            content type.
        body_base64:
          type: string
          contentEncoding: base64
          description: Any other body.
        encoding:
          type: string
          const: base64
          description: Present with body_base64.
    ScrapeDiagnostics:
      type: object
      description: 'Present on a successful mode=auto escalation: which rungs were tried and why they
        were abandoned.'
      properties:
        failed_at:
          type: string
        timeline:
          type: array
          items:
            type: object
            required:
            - stage
            - ms
            - ok
            properties:
              stage:
                type: string
              ms:
                type: integer
              ok:
                type: boolean
              detail:
                type: string
        attempts:
          type: array
          items:
            type: object
            required:
            - n
            - outcome
            - ms
            properties:
              n:
                type: integer
              engine:
                type: string
                enum:
                - fetch
                - js
                - browser
              proxy:
                type: string
              outcome:
                type: string
              ms:
                type: integer
              error_code:
                type: string
        budget_ms:
          type: integer
        elapsed_ms:
          type: integer
        engine:
          type: string
          enum:
          - fetch
          - js
          - browser
        proxy:
          type: object
          properties:
            source:
              type: string
            endpoint:
              type: string
            country:
              type: string
        hint:
          type: string
    BrandRequest:
      type: object
      description: Body of POST /v1/brand. Unknown fields are rejected with 400.
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Page to read. Required; must be http or https with a host. Private and reserved addresses are refused, as on /v1/scrape.
        include:
          type: array
          description: Sections to return. Omitted means all of them. An unknown value is a 400.
          uniqueItems: true
          items:
            type: string
            enum: [identity, logos, icons, colors, fonts, images, videos, socials]
        screenshot:
          type: boolean
          default: false
          description: Also return a screenshot of the rendered page, as on /v1/scrape. Renders in full-browser mode and bills that tier.
    BrandResponse:
      type: object
      description: |
        Brand assets from one rendered page load. Sections not named in `include` are absent. Every URL is absolute.
        Links only: no asset bytes are returned, and video files are never returned as direct media URLs.
      required: [url, final_url, warnings]
      properties:
        url:
          type: string
          description: The URL requested.
        final_url:
          type: string
          description: The URL the page finally loaded from, after redirects.
        identity:
          type: object
          required: [name, description, language, domain, theme_color, tagline, subtitle, cta]
          properties:
            name:
              type: string
            description:
              type: string
            language:
              type: string
            domain:
              type: string
            theme_color:
              type: string
              nullable: true
              description: Hex colour of the page's theme-color meta tag, or null.
            tagline:
              type: string
              maxLength: 200
              description: The hero headline, the first visible h1 in the first viewport (or the largest heading there). Empty when there is none.
            subtitle:
              type: string
              maxLength: 300
              description: The supporting line under the hero headline, a p or h2-h4 of 20-300 characters. Empty when there is none.
            cta:
              type: array
              maxItems: 2
              description: Primary calls to action in the hero, in page order.
              items:
                type: object
                required: [text, url]
                properties:
                  text:
                    type: string
                    minLength: 2
                    maxLength: 40
                  url:
                    type: string
                    nullable: true
                    description: Absolute URL, or null for a button with no link.
        logos:
          type: array
          maxItems: 10
          items:
            type: object
            required: [url, svg, format, width, height, source, theme, score]
            properties:
              url:
                type: string
                nullable: true
              svg:
                type: string
                nullable: true
                description: Inline SVG markup when it is at most 100 KB; otherwise null and the URL is kept.
              format:
                type: string
                enum: [svg, png, jpg, webp, gif, ico, unknown]
              width:
                type: integer
              height:
                type: integer
              source:
                type: string
                enum: [header, link_home, alt_or_class, jsonld, icon, og_image]
              theme:
                type: string
                enum: [light, dark, unknown]
              score:
                type: number
                format: float
        icons:
          type: array
          maxItems: 20
          items:
            type: object
            required: [url, rel, sizes, type]
            properties:
              url:
                type: string
              rel:
                type: string
                enum: [icon, apple-touch-icon, mask-icon, manifest, fallback]
              sizes:
                type: string
              type:
                type: string
        colors:
          type: array
          maxItems: 12
          items:
            type: object
            required: [hex, role, source, confidence]
            properties:
              hex:
                type: string
                pattern: '^#[0-9a-f]{6}$'
              role:
                type: string
                enum: [primary, secondary, accent, background, text, link]
              source:
                type: string
                enum: [css_var, computed, theme_color]
              confidence:
                type: number
                format: float
        fonts:
          type: array
          maxItems: 10
          items:
            type: object
            required: [family, role, weights, source, files]
            properties:
              family:
                type: string
              role:
                type: string
                enum: [heading, body, button, code]
              weights:
                type: array
                items:
                  type: integer
              source:
                type: string
                enum: [google, adobe, self_hosted, system, unknown]
              files:
                type: array
                items:
                  type: string
                description: Absolute URLs of the font files, not downloaded.
        images:
          type: array
          maxItems: 50
          items:
            type: object
            required: [url, alt, width, height, role]
            properties:
              url:
                type: string
              alt:
                type: string
              width:
                type: integer
              height:
                type: integer
              role:
                type: string
                enum: [og, twitter, hero, content]
        videos:
          type: array
          maxItems: 20
          description: Platform or embed links only. A direct media file is never returned.
          items:
            type: object
            required: [provider, id, url, embed_url, poster]
            properties:
              provider:
                type: string
                enum: [youtube, vimeo, loom, wistia, other]
              id:
                type: string
              url:
                type: string
                description: The page URL of the video.
              embed_url:
                type: string
              poster:
                type: string
                nullable: true
        socials:
          type: array
          maxItems: 20
          items:
            type: object
            required: [network, url]
            properties:
              network:
                type: string
                enum: [x, linkedin, github, instagram, youtube, facebook, tiktok, discord, threads, bluesky, mastodon, pinterest]
              url:
                type: string
        screenshot:
          description: Copied from the scrape envelope when `screenshot` was true. Same shape as on /v1/scrape.
        credits:
          type: integer
          description: Credits charged for the render, as on /v1/scrape.
        engine:
          type: string
          description: The rendering tier that served the page (X-Engine).
        warnings:
          type: array
          description: Warnings from the page's brand script (a section that failed) and from the scrape envelope.
          items:
            type: string
    ScrapeEnvelope:
      type: object
      required:
      - url
      - final_url
      - status
      - content
      - headers
      - truncated
      - credits
      - proxy_source
      - warnings
      description: Returned for response_format=json, or whenever extract/autoparse/links/ai_extract/network_capture/screenshot
        is set.
      properties:
        url:
          type: string
          description: The requested URL.
        final_url:
          type: string
          description: URL after redirects; may be empty. Bot-challenge query parameters (`js_challenge`, `jsc_token`, `jsc_orig_r`, `__cf_chl_*`, and `solution` when one of the Reddit ones is present) are removed; every other parameter is kept.
        status:
          type: integer
          description: The TARGET's HTTP status (not this response's). Anything other than 200/404/410
            or allowed_status_codes was charged 0.
        content:
          type: string
          description: 'The page in the requested rendering: html (cleaned html if extraction produced
            one), markdown or text. For an explicit `response_format=json` it is the main-content markdown
            (the raw HTML is not returned; use response_format=html for that). A coerced envelope (html or
            markdown asked, extraction or screenshot forced json) keeps the rendering the caller asked for.'
        sections:
          type: array
          description: 'Present only when the request sent `sections=true` with an explicit `response_format=json`, and only when `content` is the
            worker''s markdown. The markdown split at its ATX headings (# to ######), in document order.
            Text before the first heading is a section with level 0 and an empty heading. A `#` line inside
            a fenced code block is not a heading. Empty list when the markdown has no content.'
          items:
            type: object
            required:
            - level
            - heading
            - text
            properties:
              level:
                type: integer
                minimum: 0
                maximum: 6
                description: ATX heading depth (1-6); 0 for text before the first heading.
              heading:
                type: string
                description: The heading text without its `#` marks; empty for level 0.
              text:
                type: string
                description: The markdown under this heading, up to the next heading.
          example:
          - level: 1
            heading: Hacker News
            text: News aggregator.
          - level: 2
            heading: History
            text: Founded in 2007.
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: The target's response headers.
        truncated:
          type: boolean
          description: The target body exceeded the size cap and was cut.
        credits:
          type: integer
          minimum: 0
          description: Credits charged for this request (same as X-Credits-Charged).
        engine:
          type: string
          enum:
          - fetch
          - js
          - browser
          description: The rendering tier used to produce the page. `fetch` is HTTP only, `js` is JavaScript
            rendering, `browser` is full-browser rendering.
        proxy_source:
          type: string
          enum:
          - pool
          - custom
          - direct
        warnings:
          type: array
          items:
            type: string
          description: Human-readable warnings (messages only; codes are on X-Warning).
        notes:
          type: array
          items:
            type: string
          description: Advice for the caller, not a problem (also sent on X-Note). Currently a js_render suggestion for a page a plain fetch served that loads scripts (not sent under `mode=auto`), and a premium_proxy or stealth suggestion when the site refuses with 403, 429 or 503 (not sent under `mode=auto`, nor for a status listed in `allowed_status_codes`).
        data:
          type: object
          description: Output of extract, autoparse or ai_extract.
        empty_fields:
          type: array
          items:
            type: string
          description: Extraction rules that matched nothing - the usual sign a selector broke.
        links:
          type: array
          items:
            type: string
            format: uri
          description: Present (possibly empty) when links=true.
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/ScrapeScreenshot'
          description: Delivered images only; undelivered ones are reported in warnings and charged 0.
        network:
          type: array
          items:
            $ref: '#/components/schemas/ScrapeNetworkResponse'
          description: Captured responses. Present, possibly empty, whenever network_capture was set.
        diagnostics:
          $ref: '#/components/schemas/ScrapeDiagnostics'
    BatchJobStatus:
      type: string
      enum:
      - queued
      - running
      - paused
      - cancelling
      - completed
      - failed
      - cancelled
      description: |
        Job lifecycle. `queued` → `running` → `completed` | `failed`; cancel moves a live job to `cancelling`, then the worker
        moves it to `cancelled` once in-flight items drain. `paused` is an operator state (no public endpoint pauses).
        Terminal: `completed`, `failed`, `cancelled` — stop polling. A terminal job returns to `queued` after batchRetry.
    BatchItemStatus:
      type: string
      enum:
      - succeeded
      - failed
      - cancelled
      - skipped
      description: Terminal item status on a result line. `succeeded` is the only status that carries
        credits or a body. `succeeded` means a page was delivered; check `http_status`. A target error
        (HTTP 400 or above, other than 404 and 410) is still `succeeded`, is counted in the job's
        `target_errors`, and is not charged. Items still `queued`/`running` are never returned.
    BatchScrapeParams:
      type: object
      description: |
        The /v1/scrape request object as accepted by batch, minus `url`. Field names, types and validation are exactly
        ScrapeRequest's (enforced by a parity test); each property below references it. Every item is merged as
        job-level value, overridden by the item's value (an explicit `false` on an item wins), with the project's
        dashboard defaults underneath both. Validation happens for every item at submission.

        What the batch worker executes: each item is one fetch or one render, and the document is returned as
        `response_format` (`html` by default, `markdown` or `text`). A field is either honoured on a batch item
        or refused at submission, never accepted and skipped. Refused with 400 INVALID_PARAMETER, naming every offending
        field, with nothing queued or charged: `actions`, `scroll_pages`, `sections` (when true), `screenshot` and its options, `network_capture`, `extract`,
        `extract_preset`, `ai_extract`, `autoparse`, `links`, `session_id`, `cache`/`cache_ttl`, `original_status`,
        `allowed_status_codes`, `parse_pdf=true`, `mode=auto`, `response_format=pdf`, `response_format=json` when sent (the JSON envelope is /v1/scrape only), `solve_captcha`, and a non-GET `method` with
        `js_render` or `stealth`. A value that asks for nothing (`screenshot: false`, an empty list) is accepted. A
        refusal caused by a project default says so in `detail`. Use /v1/scrape for those fields.

        A batch item is priced when it is accepted, so a bot challenge never escalates it to stronger rendering or retries it on a
        different exit the way it can a /v1/scrape request with your own `proxy`.
      properties:
        method:
          $ref: '#/components/schemas/ScrapeRequest/properties/method'
          description: >-
            Honoured on fetched items. A method other than GET with `js_render` or `stealth` is refused with
            400, because a browser navigation is always a GET.
        js_render:
          $ref: '#/components/schemas/ScrapeRequest/properties/js_render'
          description: Run the page's JavaScript before capture. Honoured by the batch worker.
            Default false (or the project default).
        stealth:
          $ref: '#/components/schemas/ScrapeRequest/properties/stealth'
          description: Coming soon. Render with full-browser rendering hardened against bot detection; takes precedence over `js_render`.
            Honoured by the batch worker. Default false (or the project default).
        solve_captcha:
          $ref: '#/components/schemas/ScrapeRequest/properties/solve_captcha'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        impersonate:
          $ref: '#/components/schemas/ScrapeRequest/properties/impersonate'
          description: Applied by the batch worker on fetched items. Default true, as on /v1/scrape; false on
            the item, the job or the project defaults opts out.
        mode:
          $ref: '#/components/schemas/ScrapeRequest/properties/mode'
          description: >-
            `auto` is refused on batch with 400 INVALID_PARAMETER, also when it comes from the project
            defaults; the batch worker does not escalate. It runs the rendering that `js_render` or
            `stealth` selects.
        engine:
          $ref: '#/components/schemas/ScrapeRequest/properties/engine'
          deprecated: true
          description: Deprecated and ignored; rendering is chosen automatically. The job's `warnings` report the ignored field.
        premium_proxy:
          $ref: '#/components/schemas/ScrapeRequest/properties/premium_proxy'
          description: Coming soon. Use the residential proxy pool instead of datacenter. Honoured by the batch worker;
            ignored when `proxy` is set.
        proxy_country:
          $ref: '#/components/schemas/ScrapeRequest/properties/proxy_country'
          description: Coming soon. Exit country for pool proxies. Honoured by the batch worker.
        proxy:
          $ref: '#/components/schemas/ScrapeRequest/properties/proxy'
          description: >-
            Your own proxy URL; wins over the pool flags. Honoured by the batch worker.
        proxy_verify:
          $ref: '#/components/schemas/ScrapeRequest/properties/proxy_verify'
          description: >-
            Honoured by the batch worker: the custom proxy is probed before the engine cost is spent.
        session_id:
          $ref: '#/components/schemas/ScrapeRequest/properties/session_id'
          description: >-
            Batch items do not run inside a session. Refused on batch with 400 INVALID_PARAMETER (nothing
            queued or charged); use /v1/scrape.
        sticky_key:
          $ref: '#/components/schemas/ScrapeRequest/properties/sticky_key'
          description: >-
            Coming soon. Honoured by the batch worker: equal keys are pinned to the same pool exit.
        wait:
          $ref: '#/components/schemas/ScrapeRequest/properties/wait'
          description: >-
            Honoured on rendered items.
        wait_for:
          $ref: '#/components/schemas/ScrapeRequest/properties/wait_for'
          description: >-
            Honoured on rendered items.
        wait_for_timeout:
          $ref: '#/components/schemas/ScrapeRequest/properties/wait_for_timeout'
          description: >-
            Honoured on rendered items.
        actions:
          $ref: '#/components/schemas/ScrapeRequest/properties/actions'
          description: >-
            The batch worker does not run browser actions. A non-empty list is refused on batch with 400
            INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        scroll_pages:
          $ref: '#/components/schemas/ScrapeRequest/properties/scroll_pages'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        sections:
          $ref: '#/components/schemas/ScrapeRequest/properties/sections'
          description: Refused on batch with 400 INVALID_PARAMETER when true; use /v1/scrape.
        block_resources:
          $ref: '#/components/schemas/ScrapeRequest/properties/block_resources'
          description: Resource classes to block while rendering. Honoured on rendered items only; unset
            blocks nothing on full-browser rendering, `none` blocks nothing, a list blocks the classes named. Falls back to
            the project default when unset.
        headless:
          $ref: '#/components/schemas/ScrapeRequest/properties/headless'
          deprecated: true
          description: Deprecated and ignored. The browser mode is chosen automatically.
        screenshot:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot'
          description: >-
            The batch worker returns no screenshot. `true` is refused on batch with 400 INVALID_PARAMETER
            (nothing queued or charged); use /v1/scrape.
        screenshot_fullpage:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot_fullpage'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        screenshot_selector:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot_selector'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        screenshot_format:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot_format'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        screenshot_quality:
          $ref: '#/components/schemas/ScrapeRequest/properties/screenshot_quality'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        custom_headers:
          $ref: '#/components/schemas/ScrapeRequest/properties/custom_headers'
          description: >-
            Honoured by the batch worker on every item. Falls back to the project default when unset.
        autoparse:
          $ref: '#/components/schemas/ScrapeRequest/properties/autoparse'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        links:
          $ref: '#/components/schemas/ScrapeRequest/properties/links'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape. Also
            refused when it comes from the project defaults, and `detail` says so.
        network_capture:
          $ref: '#/components/schemas/ScrapeRequest/properties/network_capture'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        extract:
          $ref: '#/components/schemas/ScrapeRequest/properties/extract'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        extract_preset:
          $ref: '#/components/schemas/ScrapeRequest/properties/extract_preset'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        ai_extract:
          $ref: '#/components/schemas/ScrapeRequest/properties/ai_extract'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape.
        main_content_only:
          $ref: '#/components/schemas/ScrapeRequest/properties/main_content_only'
          description: >-
            Honoured on `markdown` and `text` items. Unset means off. Falls back to the project default when
            unset.
        include_tags:
          $ref: '#/components/schemas/ScrapeRequest/properties/include_tags'
          description: >-
            Honoured on `markdown` and `text` items.
        exclude_tags:
          $ref: '#/components/schemas/ScrapeRequest/properties/exclude_tags'
          description: >-
            Honoured on `markdown` and `text` items.
        parse_pdf:
          $ref: '#/components/schemas/ScrapeRequest/properties/parse_pdf'
          description: >-
            The batch worker has no PDF parser. `true` is refused on batch with 400 INVALID_PARAMETER (nothing
            queued or charged); use /v1/scrape. `false` is accepted.
        response_format:
          type: string
          enum:
          - html
          - markdown
          - text
          default: html
          description: >-
            Honoured. `html` (the default) returns the document as retrieved; `markdown` and `text`
            run the same conversion as /v1/scrape. `json` is refused with 400 INVALID_PARAMETER when you send it (a project default of `json` is ignored and runs as `html`): the JSON envelope
            exists only on /v1/scrape. A document that is not HTML (a PDF, an image, JSON) fails a
            `markdown` or `text` item with EXTRACTION_FAILED; request `html` to get it as retrieved. `pdf` is
            refused with 400, also when it comes from the project defaults.
        cache:
          $ref: '#/components/schemas/ScrapeRequest/properties/cache'
          description: >-
            Batch never reads from the result cache. `true` is refused on batch with 400 INVALID_PARAMETER
            (nothing queued or charged); use /v1/scrape.
        cache_ttl:
          $ref: '#/components/schemas/ScrapeRequest/properties/cache_ttl'
          description: >-
            A non-zero value is refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use
            /v1/scrape.
        max_cost:
          $ref: '#/components/schemas/ScrapeRequest/properties/max_cost'
          description: Per-ITEM credit ceiling, checked at submission against the item's dearest outcome
            (400 if exceeded). For a ceiling on the whole run use `credit_budget`.
        original_status:
          $ref: '#/components/schemas/ScrapeRequest/properties/original_status'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape. Result
            lines always carry the target status in `http_status`.
        allowed_status_codes:
          $ref: '#/components/schemas/ScrapeRequest/properties/allowed_status_codes'
          description: >-
            Refused on batch with 400 INVALID_PARAMETER (nothing queued or charged); use /v1/scrape. Billing
            is fixed to target statuses 200, 404 and 410.
    BatchItem:
      description: |
        One URL of a batch: a /v1/scrape request object (every BatchScrapeParams field plus `url`) and an optional
        `external_id`. Fields set here override the job-level value for this item only. Unknown fields are a 400.
        Run controls (`concurrency`, `priority`, etc.) are not accepted on an item.
      allOf:
      - $ref: '#/components/schemas/BatchScrapeParams'
      type: object
      required:
      - url
      properties:
        url:
          $ref: '#/components/schemas/ScrapeRequest/properties/url'
          description: The target URL for this item, validated exactly as /v1/scrape's `url` (http/https,
            SSRF and blocklist checks). Stored up to 8,192 characters.
        external_id:
          type: string
          maxLength: 255
          description: Your correlation id, echoed verbatim on this item's result line and never sent
            to the target. Trimmed of whitespace; empty means none. Not required to be unique.
      unevaluatedProperties: false
    BatchCreateRequest:
      description: |
        Body of POST /v1/batch (and of POST /v1/batch/{batchID}/items). Exactly one of `urls` or `items` must be non-empty.
        Top-level BatchScrapeParams fields are job-wide defaults. A top-level `url` is rejected with 400 — put targets in
        `urls` or `items[].url`. Unknown fields are a 400. Must be ≤ 1 MiB; ≤ 10,000 targets.
      allOf:
      - $ref: '#/components/schemas/BatchScrapeParams'
      type: object
      properties:
        name:
          type: string
          description: Free-text label shown on the job object and in the dashboard. No uniqueness; omit
            for none.
        urls:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            format: uri
          description: Shorthand list of targets that all use the job-level settings. Mutually exclusive
            with `items` (both → 400 INCOMPATIBLE_FLAGS; neither → 400 MISSING_PARAMETER). Order defines
            `seq` (0-based).
        items:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/BatchItem'
          description: Long form, one object per target with optional per-item overrides and `external_id`.
            Mutually exclusive with `urls`. Order defines `seq` (0-based).
        concurrency:
          type: integer
          default: 10
          description: Max items of this job in flight at once. Values below 1 become 1; values above
            50 are clamped to 50 and reported in the job's `warnings` (not an error).
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
          description: Scheduling priority relative to your other jobs. Outside 0-1000 is a 400.
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Attempts per item before it is marked failed (only retryable failures are re-attempted).
            Outside 1-10 is a 400.
        failure_threshold:
          type: integer
          format: int64
          minimum: 1
          description: Abort the job as `failed` once this many items have failed. Omit to never abort
            early. 0 or negative is a 400.
        credit_budget:
          type: integer
          minimum: 1
          description: Ceiling on the WHOLE run in whole credits; the worker stops charging work beyond
            it. Omit to use the job's projected cost; an `open` job then has no ceiling, because its
            projection covers only the items it was submitted with. Stored as given in
            `params.credit_budget_micro`. 0 or negative is a 400. Different from `max_cost`,
            which is per item.
        webhook_endpoint_id:
          type: string
          description: Id of a webhook endpoint registered for this organization; it receives the job
            object when the job finishes (notify-only — fetch results yourself). Register one with
            `POST /v1/webhooks` (its `id` is the value to send here) and list them with `GET /v1/webhooks`.
            An endpoint subscribed to `batch.completed` or `batch.failed` receives this job's event, signed
            with its own secret. A value that is not a valid id is a 400; blank is treated as absent.
        open:
          type: boolean
          default: false
          description: Keep the job accepting more items via POST /v1/batch/{batchID}/items. An open job
            never completes on its own — call POST /v1/batch/{batchID}/close when done. Total across appends
            is capped at 100,000 items.
      unevaluatedProperties: false
      examples:
      - name: catalog-2026-09-22
        items:
        - url: https://example.com/products/1
        - url: https://example.com/products/2
          external_id: sku-42
          stealth: true
        js_render: true
        proxy_country: us
        concurrency: 20
        max_attempts: 3
    BatchJobProgress:
      type: object
      description: Live counters for the job, read from sharded counters. `completed` = succeeded + failed
        + cancelled + skipped; `remaining` = total − completed. `succeeded` means a page was delivered;
        check each item's `http_status`. Target errors are counted in `target_errors` and are not charged.
      required:
      - total
      - completed
      - succeeded
      - failed
      - cancelled
      - skipped
      - target_errors
      - remaining
      - percent_complete
      - credits_charged
      - credits_charged_micro
      - bytes
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: Items in the job (same as `total_items`). Grows when items are appended to an open
            job.
        completed:
          type: integer
          format: int64
          minimum: 0
          description: Items in any terminal status.
        succeeded:
          type: integer
          format: int64
          minimum: 0
          description: Items that delivered a page (`succeeded` means a page was delivered, not that the target
            answered 2xx). Only these are charged, and only for a billable target status (200, 404, 410).
        target_errors:
          type: integer
          format: int64
          minimum: 0
          description: Succeeded items whose target answered an error status (400 or above, other than 404 and
            410). Each carries a warning. They are not charged, so they are not in `credits_charged`. Use this
            to tell how many successes the target refused.
        failed:
          type: integer
          format: int64
          minimum: 0
          description: Items that failed after all attempts. Re-run them with POST /v1/batch/{batchID}/retry.
        cancelled:
          type: integer
          format: int64
          minimum: 0
          description: Items not run because the job was cancelled.
        skipped:
          type: integer
          format: int64
          minimum: 0
          description: Items the worker skipped (for example after `failure_threshold` or `credit_budget`
            stopped the run).
        remaining:
          type: integer
          format: int64
          minimum: 0
          description: Items not yet finished.
        percent_complete:
          type: number
          minimum: 0
          maximum: 100
          description: completed / total × 100.
        credits_charged:
          type: integer
          minimum: 0
          description: Credits actually charged so far, whole credits rounded down. Sum over succeeded
            items only. This is the real spend; compare with the job's `estimated_credits` (the hold).
        credits_charged_micro:
          type: integer
          format: int64
          minimum: 0
          description: Same as `credits_charged` in micro-credits (1 credit = 1,000,000). Use this for
            exact accounting.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Total response bytes of finished items.
    BatchJob:
      type: object
      description: |
        The batch job, identical in shape across create, list, get, cancel and close. Poll `status_url` until `status` is
        terminal (`completed`, `failed`, `cancelled`), then read `results_url` before `results_expire_at`.
        There is no `credits_held` field: the hold is `estimated_credits`, the spend is `progress.credits_charged`.
      required:
      - id
      - project_id
      - status
      - status_url
      - results_url
      - params
      - total_items
      - concurrency
      - priority
      - max_attempts
      - estimated_credits
      - estimated_credits_micro
      - progress
      - submitted_at
      properties:
        id:
          type: string
          description: Job id (26-character ULID). Use it in every /v1/batch/{batchID} path.
        project_id:
          type: string
          description: Project the submitting API key belongs to.
        name:
          type: string
          description: The `name` you submitted. Absent when none.
        status:
          $ref: '#/components/schemas/BatchJobStatus'
          description: Current lifecycle state. Keep polling while `queued`, `running`, `paused` or `cancelling`;
            stop at `completed`, `failed` or `cancelled`.
        open:
          type: boolean
          description: Present and true while the job accepts appended items; it will not complete until
            you close it. Absent means closed.
        status_url:
          type: string
          description: 'Relative path to poll: /v1/batch/{id}.'
        results_url:
          type: string
          description: 'Relative path of the JSONL results: /v1/batch/{id}/results.'
        params:
          type: object
          additionalProperties: true
          description: The job-level scrape parameters as stored (your top-level BatchScrapeParams, without
            `url`), plus two keys the API sets and you cannot — `credit_budget_micro`, the run ceiling the
            worker enforces, and `default_proxy_tier` (`direct`, `datacenter`, `residential` or `mobile`), the exit an item that sets
            no `proxy`, `premium_proxy`, `proxy_country` or `sticky_key` takes, decided at submission from
            the live proxy pool. It is `direct` only when the pool has no usable exit and the deployment
            allows direct exits; otherwise the pool's cheapest usable tier (`datacenter`, else `residential`,
            else `mobile`), billed as datacenter. Always present, possibly only those two.
        total_items:
          type: integer
          format: int64
          minimum: 0
          description: Number of items in the job. Fixed at submission unless items are appended to an
            open job.
        concurrency:
          type: integer
          minimum: 1
          maximum: 50
          description: Effective per-job concurrency after clamping.
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: Effective priority.
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
          description: Effective attempts per item.
        failure_threshold:
          type: integer
          format: int64
          minimum: 1
          description: Failed-item count that aborts the job. Absent when not set.
        estimated_credits:
          type: integer
          minimum: 0
          description: Credits RESERVED against the monthly allowance at submission — the dearest outcome
            of every item (whole credits, rounded down). It is a hold, not a charge; credits held for
            items that fail, are cancelled or skipped are returned to the monthly allowance within
            about a minute of the item finishing, by a background settler. Succeeded items keep their
            charge. Not increased by appends. Appended items are reserved when they are added, and the
            append's own total is its `X-Request-Cost`. Retrying failed items (`POST
            /v1/batch/{id}/retry`) holds their price again first and is refused with 402 if the
            allowance cannot cover it.
        estimated_credits_micro:
          type: integer
          format: int64
          minimum: 0
          description: Same as `estimated_credits` in micro-credits.
        progress:
          $ref: '#/components/schemas/BatchJobProgress'
          description: Live item counters and the credits actually charged so far.
        submitted_at:
          type: string
          format: date-time
          description: When the job was accepted.
        started_at:
          type: string
          format: date-time
          description: When the first item started. Absent until then.
        finished_at:
          type: string
          format: date-time
          description: When the job reached a terminal status. Cleared again by batchRetry.
        cancel_requested_at:
          type: string
          format: date-time
          description: When a cancel was accepted. The job may still be `cancelling` after this while
            in-flight items drain.
        results_expire_at:
          type: string
          format: date-time
          description: 'Results deadline: submitted_at + 72 h by default. After it, GET .../results answers
            410. Download before this time.'
        error_code:
          type: string
          description: Machine code of a job-level failure (for example the job was aborted). Absent otherwise.
        error_message:
          type: string
          description: Human-readable job-level failure reason.
        warnings:
          type: array
          items:
            type: string
          description: Decisions made on your behalf at submission — a clamped `concurrency`, or items
            not yet handed to the queue (do NOT resubmit in that case). Present only on the create response.
      examples:
      - id: 01J9Z6T3W9E21T5TZARVJRVN5C
        project_id: 01J8X2M4C7Q1H5V9P3R6T8W0YB
        name: catalog-2026-09-22
        status: running
        status_url: /v1/batch/01J9Z6T3W9E21T5TZARVJRVN5C
        results_url: /v1/batch/01J9Z6T3W9E21T5TZARVJRVN5C/results
        params:
          js_render: true
          proxy_country: us
          credit_budget_micro: 8000000
        total_items: 2
        concurrency: 20
        priority: 100
        max_attempts: 3
        estimated_credits: 8
        estimated_credits_micro: 8000000
        progress:
          total: 2
          completed: 1
          succeeded: 1
          failed: 0
          cancelled: 0
          skipped: 0
          target_errors: 0
          remaining: 1
          percent_complete: 50
          credits_charged: 4
          credits_charged_micro: 4000000
          bytes: 326000
        submitted_at: '2026-09-22T06:41:12Z'
        started_at: '2026-09-22T06:41:13Z'
        results_expire_at: '2026-09-25T06:41:12Z'
    BatchJobList:
      type: object
      description: One page of GET /v1/batch.
      required:
      - batches
      properties:
        batches:
          type: array
          items:
            $ref: '#/components/schemas/BatchJob'
          description: Jobs, newest first. Empty array when there are none.
        next_cursor:
          type: string
          description: Present only when more jobs exist. Pass it back verbatim as `cursor`. Absent means
            you have reached the oldest job.
    BatchRetryResponse:
      type: object
      required:
      - job
      - items_reset
      - items_dispatched
      properties:
        job:
          $ref: '#/components/schemas/BatchJob'
          description: The job as it stands after this call. Poll GET /v1/batch/{batchID} for further
            progress.
        items_reset:
          type: integer
          minimum: 0
          description: Failed items reset to queued. 0 means nothing had failed and nothing changed.
        items_dispatched:
          type: integer
          minimum: 0
          description: Of those, how many reached the dispatch queue now. The rest are recovered by the
            worker's sweep.
    BatchAppendResponse:
      type: object
      required:
      - job
      - items_added
      - items_dispatched
      properties:
        job:
          $ref: '#/components/schemas/BatchJob'
          description: The job as it stands after this call. Poll GET /v1/batch/{batchID} for further
            progress.
        items_added:
          type: integer
          minimum: 1
          description: Items written to the job. Their `seq` values continue from the previous `total_items`.
        items_dispatched:
          type: integer
          minimum: 0
          description: Of those, how many reached the dispatch queue now. The rest are recovered by the
            worker's sweep; do not re-append them.
    BatchResultError:
      type: object
      description: Why an item did not succeed. Same code catalogue as /v1/scrape errors.
      required:
      - code
      - retryable
      properties:
        code:
          type: string
          description: Stable machine code, e.g. ERR::UPSTREAM::TIMEOUT or ERR::PROXY::EXHAUSTED. Switch
            on this, not on text.
          examples:
          - ERR::UPSTREAM::TIMEOUT
        retryable:
          type: boolean
          description: True when running the item again may succeed. Use POST /v1/batch/{batchID}/retry
            to re-run all failed items.
    BatchResultBody:
      type: object
      description: |
        The item's payload read from the job's stitched result file. Bounded: 524,288 bytes per item, 2,097,152 bytes per
        page, spent in `seq` order. Exactly one of these applies: full `content`; `truncated` (a prefix); `omitted`
        (no content, page budget spent); `unavailable` (the file could not be read).
      required:
      - bytes
      properties:
        content:
          type: string
          description: The document as plain text, in the item's `response_format` (the HTML, markdown or
            text itself). It is the line's ordinary JSON string, already decoded by your JSON parser once, so
            do not decode it again. May be a byte prefix when `truncated`.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Full size of the payload in bytes, before any truncation; equal to the length of `content`
            unless `truncated`. 0 when `unavailable`.
        truncated:
          type: boolean
          description: 'True when `content` is only a prefix: the payload exceeded 512 KiB, or the page''s
            remaining 2 MiB budget. Request this seq alone (cursor just before it, limit=1) to get up
            to 512 KiB.'
        omitted:
          type: boolean
          description: True when no content was included because the page's 2 MiB budget was already spent.
            Request a smaller `limit`, or resume with a cursor just before this seq.
        unavailable:
          type: string
          description: Why the result file could not be read at all (the same reason is set on every line
            of the page). Report it or retry later; not a problem with the item itself.
    BatchResultLine:
      type: object
      description: One line of the JSONL results stream — one finished item. Same field names as the worker's
        stitched result file.
      required:
      - seq
      - url
      - status
      - attempts
      - credits_micro
      - bytes
      - duration_ms
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: 0-based position in submission order. Stable; use it to resume and for GET .../tasks/{seq}/content.
        external_id:
          type: string
          description: The `external_id` you supplied for this item. Absent when none.
        url:
          type: string
          description: The target URL as submitted.
        status:
          $ref: '#/components/schemas/BatchItemStatus'
          description: The item's terminal status. Only `succeeded` carries a body and credits; for `failed`,
            read `error`.
        attempts:
          type: integer
          minimum: 0
          description: How many times this item was tried (not reset by retry).
        http_status:
          type: integer
          description: The TARGET site's HTTP status, not the API's. Absent when no response was received.
            A 404 here is a successful scrape of a missing page. An error status (400 or above, other than
            404 and 410) on a `succeeded` item means the target refused. The item is not charged, and its
            `warnings` say so.
        request_id:
          type: string
          description: Id of the underlying request; look it up in request history for diagnostics.
        credits_micro:
          type: integer
          format: int64
          minimum: 0
          description: Micro-credits charged for this item (1 credit = 1,000,000). Always 0 unless `status`
            is `succeeded`; billable target statuses are 200, 404 and 410.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Response size recorded for this item.
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          description: Wall-clock time spent on the item's final attempt, in ms. 0 when not recorded.
        warnings:
          type: array
          items:
            type: string
          description: Warning codes for this item, e.g. `EMPTY_RENDER` (the page rendered empty, so the
            item was charged 0 credits). Omitted when there are none.
        result_ref:
          type: string
          description: Storage pointer for a per-item payload. Currently never populated (the worker writes
            one file per job); ignore it.
        result:
          $ref: '#/components/schemas/BatchResultBody'
          description: The payload inline. Absent while the job is still running (no stitched file yet),
            when the deployment has no object storage, or when this item has no stored payload (typically
            non-succeeded items).
        result_url:
          type: string
          format: uri
          description: Pre-signed download link (valid 2 h) for this item's payload. Only present when
            `result_ref` is, so currently absent.
        error:
          $ref: '#/components/schemas/BatchResultError'
          description: Present when the item failed and a machine code was recorded. Absent on success.
        finished_at:
          type: string
          format: date-time
          description: When the item reached its terminal status.
      examples:
      - seq: 1
        external_id: sku-42
        url: https://example.com/products/2
        status: succeeded
        attempts: 1
        http_status: 200
        request_id: 01J9Z7A1B2C3D4E5F6G7H8J9KA
        credits_micro: 4000000
        bytes: 326000
        duration_ms: 1840
        result:
          content: '"<!doctype html><html><head><title>Product 2</title>…"'
          bytes: 326002
        finished_at: '2026-09-22T06:41:14Z'
    SessionEngine:
      type: string
      enum:
      - fetch
      - js
      - browser
      description: The rendering tier a session is bound to for its lifetime (`fetch` is HTTP only, `js` is
        JavaScript rendering, `browser` is full-browser rendering). Chosen automatically when the session
        is created unless the create names one.
    SessionCreateRequest:
      type: object
      additionalProperties: false
      description: Body of `POST /v1/sessions`. All fields optional; unknown fields are refused with 400.
      properties:
        engine:
          allOf:
          - $ref: '#/components/schemas/SessionEngine'
          description: Optional. The rendering tier to bind the session to (`fetch`, `js` or `browser`);
            omit it and one is chosen for you. A tier the deployment does not offer is 503 `ERR::ENGINE::UNAVAILABLE`.
        ttl_seconds:
          type: integer
          minimum: 30
          default: 1800
          description: Sliding lifetime in seconds. Omitted or 0 means 1800, reduced to the organization
            maximum with a warning if that is lower. Values above the organization maximum (default 604800,
            i.e. 7 days) are refused with 400 naming the real maximum.
        sticky_key:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,62}[A-Za-z0-9]$
          description: Coming soon. Pins the exit IP across the session. Letters, digits and hyphens, not starting
            or ending with a hyphen. Omitted means derived from the session id (still pinned). Must be
            unique among active sessions in the project. Cannot be combined with `rotate_ip`.
        region_pool:
          type: string
          maxLength: 64
          description: Coming soon. Regional exit pool to draw from. Trimmed; longer than 64 characters is refused.
        rotate_ip:
          type: boolean
          default: false
          description: Coming soon. Keep the cookie jar but let the exit IP change between requests. Use for many-page
            crawls; avoid for replayed logins, which get challenged on a moving IP. Refused together with
            `sticky_key`.
        premium_proxy:
          type: boolean
          default: false
          description: Coming soon. Use the residential tier instead of datacenter. Same meaning as on `/v1/scrape`.
        proxy_country:
          type: string
          pattern: ^[A-Za-z]{2}$
          description: 'Coming soon. ISO 3166-1 alpha-2 exit country, case-insensitive. Requires `premium_proxy: true`,
            otherwise 400 `ERR::REQUEST::INCOMPATIBLE_FLAGS`.'
        fingerprint:
          type:
          - object
          - 'null'
          description: Browser fingerprint pin, stored verbatim. Advanced option; a non-empty object is refused with
            400 where the session's rendering cannot apply it. `null` and `{}` count as absent.
        domain_scores:
          type: object
          description: Seed per-domain health, keyed by lowercase registrable domain (e.g. `example.com`).
            Scores must be non-negative. Above 64 entries, the least useful (unblocked, lowest score,
            oldest) are evicted rather than refused.
          additionalProperties:
            $ref: '#/components/schemas/SessionDomainScore'
        session_context:
          allOf:
          - $ref: '#/components/schemas/SessionContext'
          description: Initial cookies and storage, e.g. an existing login or the `session_context` from
            a previous `GET /v1/sessions/{id}/context`. Serialised size limit 1 MiB (413). Omitted means
            an empty context.
    Session:
      type: object
      description: A session as every session endpoint reports it. Never contains cookies.
      required:
      - id
      - project_id
      - status
      - sticky_key
      - proxy
      - created_at
      - last_used_at
      - expires_at
      - usage_count
      - context
      properties:
        id:
          type: string
          description: Session id (26-character ULID). Pass it as `session_id` on `/v1/scrape`.
          examples:
          - 01J9ZQ4M7R3T8VX2K5N6P0B1CD
        project_id:
          type: string
          description: Project the session belongs to (the creating key's project).
        engine:
          $ref: '#/components/schemas/SessionEngine'
        status:
          type: string
          enum:
          - active
          - released
          - expired
          description: Derived from the clock, not a stored flag. `active` sessions can be used; `released`
            and `expired` ones have no context and cannot be revived. Create a new session.
        sticky_key:
          type: string
          description: Exit pin in use. The lowercase session id when you did not set one; empty string
            when `rotate_ip` was set.
        proxy:
          $ref: '#/components/schemas/SessionProxy'
        created_at:
          type: string
          format: date-time
          description: Creation time, RFC 3339 UTC.
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last time a successful scrape used the session. Null means never used.
        expires_at:
          type: string
          format: date-time
          description: Current expiry. Each successful scrape moves it to that time + the session's
            `ttl_seconds` (never earlier than it was, never past `hard_expires_at`). After it passes the
            context is purged.
        hard_expires_at:
          type: string
          format: date-time
          description: Fixed ceiling set at creation from the organization's maximum TTL. Plan a re-login
            before this time. Omitted only for legacy rows.
        released_at:
          type: string
          format: date-time
          description: When the session was released. Present only on released sessions.
        usage_count:
          type: integer
          minimum: 0
          description: Number of successful scrapes that have used the session. Failed scrapes and
            `/context` reads do not count.
        context:
          oneOf:
          - $ref: '#/components/schemas/SessionContextSummary'
          - type: 'null'
          description: Size summary of the stored context. Null once the session is not active (the context
            has been purged).
        retired:
          type: string
          enum:
          - expired
          - usage_exhausted
          - explicit
          description: Why a worker took this session out of service. Absent while usable. A retired session
            should be replaced.
        domain_scores:
          type: object
          description: Per-domain block evidence the workers maintain. Omitted when empty.
          additionalProperties:
            $ref: '#/components/schemas/SessionDomainScore'
        fingerprint:
          type: object
          description: Browser fingerprint, as stored. Omitted when none was set.
        lease:
          $ref: '#/components/schemas/SessionLease'
        warnings:
          type: array
          items:
            type: string
          description: Decisions made on your behalf at creation, e.g. a TTL reduced to the organization
            maximum. Only on the create response; omitted when empty.
    SessionList:
      type: object
      required:
      - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
          description: Sessions on this page, newest first. May be shorter than `limit` (or empty) when
            a `status` filter is applied.
        next_cursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent when the last unfiltered page was
            short, which means there are no more sessions.
    SessionProxy:
      type: object
      required:
      - tier
      description: The session's exit intent. Not an endpoint or IP.
      properties:
        tier:
          type: string
          enum:
          - none
          - datacenter
          - residential
          description: Exit tier. `residential` when created with `premium_proxy`, otherwise `datacenter`.
            `none` is reserved and not produced by the create endpoint.
        country:
          type: string
          description: Lowercase alpha-2 exit country. Omitted when no country was requested.
        region_pool:
          type: string
          description: Regional pool requested at creation. Omitted when none.
    SessionLease:
      type: object
      required:
      - expires_at
      description: Present only while a render holds the single-writer lease. While present, other scrapes,
        release and delete get 409 `ERR::SESSION::BUSY`.
      properties:
        holder:
          type: string
          description: Identifier of the worker holding the lease. Diagnostic only.
        expires_at:
          type: string
          format: date-time
          description: When the lease lapses at the latest. Retry after this time.
    SessionContextSummary:
      type: object
      required:
      - schema_version
      - cookies
      - origins
      - bytes
      description: Non-secret counts describing the stored context.
      properties:
        schema_version:
          type: integer
          description: Stored context format version. Currently 1.
        cookies:
          type: integer
          minimum: 0
          description: Number of cookies stored.
        origins:
          type: integer
          minimum: 0
          description: Distinct origins across local storage, session storage and IndexedDB.
        bytes:
          type: integer
          minimum: 0
          maximum: 1048576
          description: Serialised plaintext size in bytes. The limit is 1048576.
    SessionContext:
      type: object
      description: Everything a browser holds that makes it logged in. Maps and arrays are never null
        in responses.
      properties:
        cookies:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/SessionCookie'
          description: Browser-wide cookie jar. At most 2000.
        local_storage:
          type: object
          maxProperties: 100
          description: Origin (bare `http(s)://host[:port]`, no path) to key/value map. At most 100 origins
            and 1000 keys per origin.
          additionalProperties:
            type: object
            maxProperties: 1000
            additionalProperties:
              type: string
        session_storage:
          type: object
          maxProperties: 100
          description: Same shape and limits as `local_storage`. Many single-page apps keep access tokens
            here; include it when importing a login.
          additionalProperties:
            type: object
            maxProperties: 1000
            additionalProperties:
              type: string
        indexed_db:
          type: object
          maxProperties: 50
          description: Origin to list of IndexedDB databases, each carried verbatim as JSON. At most 50
            origins and 50 databases per origin. Treat as opaque.
          additionalProperties:
            type: array
            maxItems: 50
            items: {}
    SessionCookie:
      type: object
      required:
      - name
      - domain
      description: One cookie in stored spelling (`http_only`, `same_site`), not CDP spelling.
      properties:
        name:
          type: string
          minLength: 1
          description: Cookie name. Required; trimmed.
        value:
          type: string
          description: Cookie value.
        domain:
          type: string
          minLength: 1
          description: Cookie domain; a leading dot (".example.com") makes it domain-wide and is preserved.
            Required.
        path:
          type: string
          default: /
          description: Cookie path. Empty becomes `/`.
        expires:
          type: number
          exclusiveMinimum: 0
          description: Expiry in seconds since the epoch (CDP units). Omit for a session cookie. Zero
            or negative values (such as CDP's -1) are treated as a session cookie and omitted.
        http_only:
          type: boolean
          default: false
          description: HttpOnly flag.
        secure:
          type: boolean
          default: false
          description: Secure flag. Required to be true when `same_site` is `None`.
        same_site:
          type: string
          enum:
          - Strict
          - Lax
          - None
          description: 'SameSite attribute in exact CDP casing. Omit when unset; it is not defaulted.
            `None` without `secure: true` is refused.'
    SessionDomainScore:
      type: object
      required:
      - score
      - good
      - bad
      - last_updated
      - retired
      description: One domain's standing with the session. At a score of 3 or with `retired` true, the
        session is treated as blocked for that domain.
      properties:
        score:
          type: number
          minimum: 0
          description: Error score; rises on failures, decays on successes. Blocked at 3.
        good:
          type: integer
          minimum: 0
          description: Successful requests counted.
        bad:
          type: integer
          minimum: 0
          description: Failed requests counted.
        last_updated:
          type: integer
          format: int64
          description: Last update in Unix milliseconds.
        retired:
          type: boolean
          description: Hard, sticky block for this domain (e.g. a 403 wall). Does not decay; use a new
            session for this domain.
    SessionContextDump:
      type: object
      required:
      - session_id
      - schema_version
      - session_context
      - usage_count
      - created_at
      - last_used_at
      - expires_at
      - warning
      description: Body of `GET /v1/sessions/{id}/context`. `session_context` can be POSTed back to `POST
        /v1/sessions` to clone the session.
      properties:
        session_id:
          type: string
          description: The session id.
        schema_version:
          type: integer
          description: Stored format version. Currently 1.
        session_context:
          $ref: '#/components/schemas/SessionContext'
        fingerprint:
          type:
          - object
          - 'null'
          description: Stored browser fingerprint, or null when none. Omitted only in edge cases.
        domain_scores:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SessionDomainScore'
          description: Per-domain standing, as stored. `{}` when empty.
        retired:
          type: string
          enum:
          - expired
          - usage_exhausted
          - explicit
          description: Why a worker retired the session. Absent while usable.
        usage_count:
          type: integer
          minimum: 0
          description: Scrapes that used the session.
        created_at:
          type: string
          format: date-time
          description: Creation time.
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last use, or null if never used.
        expires_at:
          type: string
          format: date-time
          description: Current sliding expiry.
        warning:
          type: string
          description: Fixed reminder that this context is destroyed on release, delete or expiry. Save
            the object now if you need it later.
    RequestLogEntry:
      type: object
      required:
      - id
      - created_at
      - project_id
      - status
      - url
      - proxy
      - spans
      - credits_micro
      description: One API request as recorded in the ephemeral request log. Numeric fields with `omitempty`
        are absent when zero.
      properties:
        id:
          type: string
          description: Request id; the same value as the `X-Request-Id` header and problem `request_id`.
        created_at:
          type: string
          format: date-time
          description: When the request arrived, RFC 3339 with fractional seconds, UTC.
        project_id:
          type: string
          description: Project whose API key made the request. Always present; tells rows apart in an
            `all_projects=true` list.
          examples:
          - 01M0FJZ8Q3W4B5T8J2V9K6X1RD
        engine:
          type: string
          description: Rendering tier that served it (`fetch`, `js` or `browser`). Empty for requests
            refused before a tier was chosen.
        status:
          type: string
          enum:
          - success
          - failed
          - timeout
          - blocked
          - rejected
          - cancelled
          description: Terminal outcome. Only `success` is ever charged.
        http_status:
          type: integer
          description: Target's HTTP status. Absent when no response was received.
        error_code:
          type: string
          description: Problem code returned to the caller, e.g. `ERR::UPSTREAM::CHALLENGE`. Absent on
            success.
        error_detail:
          type: string
          description: The problem detail sentence the caller received (may be truncated). Read it for
            the specific cause.
        attempts:
          type: integer
          minimum: 0
          description: Dispatch attempts including retries. Absent when zero.
        url:
          type: string
          description: Target URL as requested.
        url_host:
          type: string
          description: Target host. Absent when unknown.
        proxy:
          $ref: '#/components/schemas/RequestLogProxy'
        spans:
          $ref: '#/components/schemas/RequestLogSpans'
        blocked:
          $ref: '#/components/schemas/RequestLogBlock'
        bytes_in:
          type: integer
          format: int64
          minimum: 0
          description: Bytes received from the target. Absent when zero.
        bytes_out:
          type: integer
          format: int64
          minimum: 0
          description: Bytes sent to the target. Absent when zero.
        proxy_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes carried through a proxy exit. Absent when zero.
        credits_micro:
          type: integer
          format: int64
          minimum: 0
          description: Credits charged in micro-credits (1 credit = 1000000). Always 0 for non-success
            statuses.
        features:
          type: object
          additionalProperties: true
          description: Features the request used, as recorded by the router. Free-form; absent when none.
    RequestLogProxy:
      type: object
      description: What was requested versus what actually served. Never contains an exit IP or credentials.
        Every field is absent when unknown.
      properties:
        source:
          type: string
          enum:
          - pool
          - custom
          - direct
          description: 'Where the exit came from: the managed pool, your own proxy, or no proxy.'
        endpoint_id:
          type: string
          description: Pool exit id, e.g. `dc-198.51.100.7-6646`. Not an exit IP. Absent for custom and
            direct.
        provider:
          type: string
          description: Proxy provider name.
        requested_tier:
          type: string
          description: Tier the request asked for, e.g. `datacenter`, `residential`.
        requested_country:
          type: string
          description: Country the request asked for.
        country:
          type: string
          description: Country the exit actually served from. Compare with `requested_country` to spot
            geo mismatches.
        sticky:
          type: boolean
          description: True when the exit was pinned. Absent when false.
        reason:
          type: string
          enum:
          - caller_proxy
          - configured_direct
          - no_pool_available
          - session_proxy_unavailable
          - pool_no_datacenter
          - challenge_escalation
          description: Why this source was chosen. `no_pool_available` is a request that named no proxy preference and went direct because the pool had no usable exit. `session_proxy_unavailable` is a request in a session that records a datacenter exit on a deployment with no proxy pool; it went direct. `pool_no_datacenter` is a request that named no proxy preference and was served by a residential or mobile exit because the pool has no usable datacenter exit; it is billed at the datacenter price. `challenge_escalation` is a datacenter-exit request that met a bot challenge and was retried once from a residential exit; it is billed at the datacenter price. `configured_direct` is legacy and appears only on old records. Absent means unknown (older records), not a default.
        endpoints:
          type: array
          items:
            type: string
          description: Every exit the request touched, in attempt order. Several entries mean retries
            moved exits.
    RequestLogSpans:
      type: object
      required:
      - admission_ms
      - dispatch_ms
      - worker_ms
      - queue_ms
      - engine_ms
      - upstream_ms
      - extract_ms
      - total_ms
      description: Latency breakdown in milliseconds. Every field is always present; null means the stage
        was not measured, which is different from 0. Spans are measured by different processes and do
        not sum to `total_ms`.
      properties:
        admission_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'Ingress to dispatch: auth, rate limit, quota, concurrency. Null when the request
            never reached dispatch.'
        dispatch_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Worker round trip as timed by the API, including transport. `dispatch_ms - worker_ms`
            is transport overhead.
        worker_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: The worker's own handler time.
        queue_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Wait for a slot inside the worker. High values mean capacity shortage, not a slow
            page.
        engine_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Engine occupancy, the metered compute. Null on the fetch tier.
        upstream_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Time talking to the target.
        extract_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Extraction time; null when no extraction ran.
        total_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: What the caller experienced inside the handler, excluding writing the body.
    RequestLogBlock:
      type: object
      description: Present only when a bot challenge was detected. Use `vendor` to pick a countermeasure
        (e.g. stealth rendering or residential exit).
      properties:
        vendor:
          type: string
          description: Anti-bot vendor, e.g. `akamai`, `cloudflare`.
        signal:
          type: string
          description: Observable marker that triggered detection, so you can confirm it in the response.
        rule:
          type: string
          description: Which detection path fired.
    RequestLogPage:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequestLogEntry'
          description: Records, newest first. Can be shorter than `limit` even when `has_more` is true.
        page:
          $ref: '#/components/schemas/RequestLogPageInfo'
    RequestLogPageInfo:
      type: object
      required:
      - retention_hours
      - retained_since
      - has_more
      properties:
        retention_hours:
          type: integer
          minimum: 1
          description: How long records are kept for this organization (24 by default). An empty page
            means nothing within this window.
        retained_since:
          type: string
          format: date-time
          description: Oldest instant still readable. Anything earlier has expired.
        has_more:
          type: boolean
          description: True when more records may exist. Continue with the next_before pair; an extra
            empty page is possible.
        next_before:
          type: string
          format: date-time
          description: Send back as `before`. Present only when `has_more` is true.
        next_before_id:
          type: string
          description: Send back as `before_id` together with `before`. Present only when `has_more` is
            true.
    UsageMetric:
      type: string
      enum:
      - requests
      - credits
      - engine_ms
      - bytes_egress
      - bytes_ingress
      - proxy_bytes_dc
      - proxy_bytes_resi
      - extractions
      - ai_extractions
      - batch_items
      - requests_failed
      - requests_timeout
      - feature_actions
      - feature_ai_extract
      - feature_autoparse
      - feature_extract
      - feature_extract_preset
      - feature_js_render
      - feature_links
      - feature_network_capture
      - feature_pdf
      - feature_proxy_country
      - feature_proxy_custom
      - feature_screenshot
      - feature_session
      - client_cli
      - client_mcp
      - client_sdk
      - client_other
      description: Usage metric name. `requests_failed`/`requests_timeout` count failed and timed-out
        requests, `feature_*` count requests that used a feature, `client_*` count requests by client
        surface (CLI, MCP, SDK, other). Billing metric name. `credits` is in micro-credits and is total
        credit spend, batch items included; `engine_ms` in milliseconds; byte metrics in bytes; the rest
        are counts. New metrics may appear as map keys in responses.
    UsagePeriod:
      type: object
      required:
      - start
      - end
      - days
      - bounds
      description: Half-open range of UTC days.
      properties:
        start:
          type: string
          format: date
          description: First day, inclusive.
        end:
          type: string
          format: date
          description: End day, EXCLUSIVE. The last included day is the day before this.
        days:
          type: integer
          minimum: 0
          description: Number of days in the period.
        bounds:
          type: string
          const: '[start, end)'
          description: Always `[start, end)`, a reminder that `end` is exclusive.
    UsageMetricMap:
      type: object
      description: Metric name to quantity. Keys are UsageMetric values.
      additionalProperties:
        type: integer
        format: int64
    UsageGroup:
      type: object
      required:
      - key
      - metrics
      properties:
        key:
          type: string
          description: 'Bucket key: a `YYYY-MM-DD` day, a project id, a rendering tier (`fetch`, `js` or `browser`), or a feature (`extract`,
            `ai_extract`, `proxy_datacenter`, `proxy_residential`, `batch`). Groups are sorted by key.'
        label:
          type: string
          description: Human label for rendering-tier groups (for example "JavaScript rendering"). Absent for
            other dimensions and unknown tiers.
        metrics:
          $ref: '#/components/schemas/UsageMetricMap'
    UsageByKey:
      type: object
      required:
      - period
      - group_by
      - keys
      description: '`GET /v1/usage?group_by=key`. Only the caller''s organization''s keys, and only the
        key''s own project for a project-scoped key. The dashboard route `GET /v1/orgs/{orgID}/usage?group_by=key`
        returns the same `keys` array with inclusive `from`/`to` dates instead of `period`.'
      properties:
        period:
          $ref: '#/components/schemas/UsagePeriod'
        group_by:
          type: string
          enum:
          - key
        keys:
          type: array
          items:
            type: object
            required:
            - key_id
            - name
            - prefix
            - project_id
            - revoked
            - days
            - totals
            properties:
              key_id:
                type: string
              name:
                type: string
              prefix:
                type: string
                description: Display prefix of the key, never the secret.
              project_id:
                type: string
              revoked:
                type: boolean
              days:
                type: array
                items:
                  type: object
                  required:
                  - day
                  - metrics
                  properties:
                    day:
                      type: string
                      format: date
                    metrics:
                      $ref: '#/components/schemas/UsageMetricMap'
              totals:
                $ref: '#/components/schemas/UsageMetricMap'
    UsageBreakdown:
      type: object
      required:
      - period
      - group_by
      - groups
      - totals
      - unattributed
      - usage_as_of
      - stale_seconds
      properties:
        period:
          $ref: '#/components/schemas/UsagePeriod'
        group_by:
          type: string
          enum:
          - day
          - project
          - engine
          - feature
          - key
          description: The dimension used.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/UsageGroup'
          description: Buckets. Can be empty while `totals` is non-zero (e.g. `group_by=engine` without
            attribution data).
        totals:
          allOf:
          - $ref: '#/components/schemas/UsageMetricMap'
          description: Billed quantities for the window. Authoritative; use these, not the sum of groups.
        unattributed:
          allOf:
          - $ref: '#/components/schemas/UsageMetricMap'
          description: Part of each total the groups do not explain. Always has an entry for every metric
            in `totals` (0 for `day` and `project`).
        usage_as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: Freshness of the newest rollup row in the window. Null when the window has no rows.
        stale_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Age of `usage_as_of` in seconds. Null when there are no rows (not "fresh"). Large
            values mean the rollup is behind.
        warnings:
          type: array
          items:
            type: string
          description: Caveats a chart would otherwise hide, such as missing engine attribution or a breakdown
            that does not reconcile. Omitted when empty.
    UsagePlan:
      type: object
      required:
      - code
      - name
      - version
      - subscription_status
      - period_source
      properties:
        code:
          type: string
          description: Plan code. With no subscription, the organization is on the free plan and this is
            `free`.
        name:
          type: string
          description: Plan display name. `Free` (the current free plan's name) when no subscription.
        version:
          type: integer
          description: Plan version. With no subscription, the current free plan's version (0 if the
            deployment has no free plan row).
        subscription_status:
          type: string
          description: Subscription status, e.g. `active`, `trialing`. `none` when no subscription covers
            now.
        period_source:
          type: string
          enum:
          - subscription
          - allowance_month
          description: '`subscription`: the period is the billing period. `allowance_month`: no
            subscription covers now, so the organization is on the free plan''s monthly allowance, and
            the period is its allowance month: from 00:00 UTC on the day of the month the organization
            was created to the same day of the next month. That is the window the allowance is enforced
            over, not a billing period.'
    UsageCredits:
      type: object
      required:
      - included_micro
      - used_micro
      - remaining_micro
      - overage_micro
      - overage_micro_cents_per_credit
      - used_basis_points
      description: Allowance arithmetic over METERED usage, in micro-credits (1 credit = 1000000). No
        money amounts. Metered usage is credits spent, batch items included, and excludes credits held
        for in-flight work; the number the API enforces is `allowance` on the summary.
      properties:
        included_micro:
          type: integer
          format: int64
          minimum: 0
          description: Credits included in the plan for the period. With no subscription, the enforced
            monthly limit (the same as `allowance.limit_micro`).
        used_micro:
          type: integer
          format: int64
          minimum: 0
          description: Credits spent so far in the period, from the usage rollup (`metrics.credits`).
            Includes batch spend.
        remaining_micro:
          type: integer
          format: int64
          minimum: 0
          description: Included minus used, floored at 0.
        overage_micro:
          type: integer
          format: int64
          minimum: 0
          description: Used beyond the allowance, floored at 0. Billed at invoicing. Always 0 with no
            subscription, where requests past the limit are refused instead.
        overage_micro_cents_per_credit:
          type: integer
          format: int64
          minimum: 0
          description: Overage price per credit in micro-cents, from the plan.
        used_basis_points:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          description: Used divided by included, in basis points (10000 = 100%). Can exceed 10000. Null
            when the plan includes no credits.
    UsageSummary:
      type: object
      required:
      - period
      - period_elapsed_days
      - plan
      - credits
      - metrics
      - unattributed
      - usage_as_of
      - stale_seconds
      properties:
        period:
          $ref: '#/components/schemas/UsagePeriod'
        period_elapsed_days:
          type: integer
          minimum: 0
          description: Whole days of the period elapsed, clamped to [0, period.days]. Use it to pace consumption.
        plan:
          $ref: '#/components/schemas/UsagePlan'
        credits:
          oneOf:
          - $ref: '#/components/schemas/UsageCredits'
          - type: 'null'
          description: Metered usage against the plan's included credits, or, with no subscription,
            against the enforced monthly limit. Filled for every organization (the type stays nullable
            because older servers returned null when there was no subscription). Includes batch spend
            but not credits held for in-flight work; show `allowance` as "credits left".
        allowance:
          $ref: '#/components/schemas/UsageAllowance'
        metrics:
          allOf:
          - $ref: '#/components/schemas/UsageMetricMap'
          description: Every billed metric for the period.
        unattributed:
          allOf:
          - $ref: '#/components/schemas/UsageMetricMap'
          description: Part of each metric that per-engine attribution does not explain. Usually equals
            `metrics` today.
        usage_as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: Newest rollup row in the period, or null when none.
        stale_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Age of `usage_as_of` in seconds; null when no rows.
        warnings:
          type: array
          items:
            type: string
          description: Caveats, e.g. that the allowance counter could not be read. Omitted when empty.
    UsageAllowance:
      type: object
      required:
      - limit_micro
      - limit_credits
      - limit_source
      - unlimited
      - used_micro
      - remaining_micro
      - window_start
      - resets_at
      description: The monthly credit allowance as the API ENFORCES it, for the current allowance month.
        This is the number that decides whether the next request is refused with 402
        `ERR::LIMIT::QUOTA_EXCEEDED`, and the one to show as "credits left". Present for every
        organization, subscribed or not; omitted only when the deployment has no allowance counter or
        it could not be read (a warning then says so).
      properties:
        limit_micro:
          type: integer
          format: int64
          minimum: 0
          description: The enforced monthly limit in micro-credits. 0 means no limit (`unlimited`).
        limit_credits:
          type: integer
          minimum: 0
          description: '`limit_micro` in whole credits, rounded down.'
        limit_source:
          type: string
          enum:
          - default
          - override
          description: '`default`: the deployment''s monthly allowance, which every organization gets.
            `override`: a limit an operator set for this organization.'
        unlimited:
          type: boolean
          description: True when no limit is enforced (`limit_micro` is 0).
        used_micro:
          type: integer
          format: int64
          minimum: 0
          description: Micro-credits counted against the limit this allowance month. It includes credits
            currently HELD for in-flight work (an open browser session holds its whole `session_ttl`
            price until it closes; a batch job holds the price of its unfinished items) as well as
            credits spent, and cannot be split into the two. So it can exceed `credits.used_micro`.
        remaining_micro:
          type: integer
          format: int64
          minimum: 0
          description: 'What the organization can still spend: `limit_micro` minus `used_micro` (never
            negative) plus `extra_micro`. 0 when `unlimited`.'
        extra_micro:
          type: integer
          format: int64
          minimum: 0
          description: 'Extra credits the organization holds on top of the monthly limit (credits
            granted to it, by an operator or as the onboarding bonus, or refunded). They are spent
            after the monthly allowance and are kept when the allowance month resets. Already included
            in `remaining_micro`. Read from Postgres when the working balance is not yet loaded, so a
            granted credit shows here before the organization makes its first request.'
        window_start:
          type: string
          format: date-time
          description: Start of the allowance month, 00:00 UTC on the day of the month the organization
            was created.
        resets_at:
          type: string
          format: date-time
          description: When the allowance is next restored in full; the end of the allowance month.
    UsageDriftItem:
      type: object
      required:
      - project_id
      - metric
      - stored_qty
      - observed_qty
      - delta
      - action
      properties:
        project_id:
          type: string
          description: Project the drift is in.
        metric:
          $ref: '#/components/schemas/UsageMetric'
        stored_qty:
          type: integer
          format: int64
          description: Billed quantity (usage_daily).
        observed_qty:
          type: integer
          format: int64
          description: Quantity re-derived from the Postgres request log.
        delta:
          type: integer
          format: int64
          description: Difference reported by the reconciliation function. Do not treat as a refund or
            charge without reading `interpretation`.
        action:
          type: string
          enum:
          - missing_in_usage_daily
          - absent_from_request_log
          - undercounted
          - overcounted
          description: The reconciliation verdict. `absent_from_request_log` usually means the log expired,
            not overbilling.
    CreditItem:
      type: object
      required:
      - id
      - created_at
      - amount_micro
      - kind
      - label
      properties:
        id:
          type: string
          description: Identifier of the credit transaction.
        created_at:
          type: string
          format: date-time
          description: When the transaction took effect (RFC 3339, UTC).
        amount_micro:
          type: integer
          format: int64
          description: Signed change to the spendable balance, in micro-credits. Positive for a grant or a transfer in, negative for an expiry or a transfer out.
        kind:
          type: string
          enum:
          - promo_grant
          - plan_grant
          - adjustment
          - refund
          - expiry
          - purchase
          - migration
          - transfer_out
          - transfer_in
        label:
          type: string
          description: 'Fixed customer-facing description. One of: Onboarding bonus, Plan allowance,
            Credits added by Spicrawl, Refund, Credit adjustment, Credits expired, Credit purchase,
            Wallet top-up, Balance carried over, Transfer out, Transfer in.'
    CreditsResponse:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditItem'
        next_cursor:
          type: string
          nullable: true
          description: Pass verbatim as `cursor` to fetch the next page. `null` on the last page.
    UsageReconciliation:
      type: object
      required:
      - day
      - drift
      - request_log_rows
      - interpretation
      - repairable
      properties:
        day:
          type: string
          format: date
          description: UTC day reconciled.
        drift:
          type: array
          items:
            $ref: '#/components/schemas/UsageDriftItem'
          description: Disagreements. Empty means no drift.
        request_log_rows:
          type: integer
          format: int64
          minimum: 0
          description: Rows the Postgres request log holds for the day. 0 means there was nothing to reconcile
            against.
        interpretation:
          type: string
          description: What the drift can and cannot prove. Read this before acting on `drift`.
        repairable:
          type: boolean
          const: false
          description: Always false; the API never repairs billing data. Contact support to dispute.
        warnings:
          type: array
          items:
            type: string
          description: Extra caveats. Omitted when empty.
    FleetList:
      type: object
      required:
      - kinds
      properties:
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/FleetKind'
          description: One entry per worker kind, in the fixed order browser, egress, extract, batch,
            including kinds with no workers.
    FleetKind:
      type: object
      required:
      - kind
      - present
      - ready
      - workers
      properties:
        kind:
          type: string
          enum:
          - browser
          - egress
          - extract
          - batch
          description: Worker type.
        present:
          type: integer
          minimum: 0
          description: Workers of this kind currently publishing. 0 means none are running.
        ready:
          type: integer
          minimum: 0
          description: Of those, how many accept work. 0 means work of this kind will queue or fail.
        workers:
          type: array
          items:
            $ref: '#/components/schemas/FleetWorker'
          description: The workers. Empty array when none.
    FleetWorker:
      type: object
      required:
      - worker_id
      - kind
      - capacity
      - in_flight
      - free_slots
      - ready
      - address
      - last_seen_ms
      properties:
        worker_id:
          type: string
          description: Worker instance id.
        kind:
          type: string
          enum:
          - browser
          - egress
          - extract
          - batch
          description: Worker type.
        capacity:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Concurrent tasks the worker accepts.
        in_flight:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Tasks it is running now.
        free_slots:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: Capacity minus in-flight, floored at 0.
        ready:
          type: boolean
          description: Whether the worker accepts new work.
        detail:
          type: string
          description: Worker's own readiness note, e.g. why it is not ready. Absent when empty.
        task_stream:
          type: string
          description: Queue the worker consumes. Absent when none.
        address:
          type: string
          description: Address the API dials. Empty string means the worker is listed but receives no
            registry traffic.
        last_seen_ms:
          type: integer
          format: int64
          description: Milliseconds since the worker last published. Large values mean it may be gone.
            Can be slightly negative under clock skew.
    HealthLive:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
          description: Always `ok`.
    HealthReady:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          description: '`ready` with HTTP 200; `not_ready` with HTTP 503.'
        checks:
          type: object
          description: 'Per-dependency result. Keys: `postgres`, `redis` (when configured), `fetch`, `extract`,
            `render` (configured workers), and `accepting` (present only as `draining` during shutdown).'
          properties:
            accepting:
              type: string
              const: draining
              description: Present only while the process is shutting down.
            postgres:
              type: string
              enum:
              - ok
              - unreachable
            redis:
              type: string
              enum:
              - ok
              - unreachable
          additionalProperties:
            type: string
            enum:
            - ok
            - unreachable
    PartnerUsageTotals:
      type: object
      required: [requests, requests_failed, credits_micro, credits_wallet_micro, credits_own_micro]
      properties:
        requests: {type: integer, format: int64}
        requests_failed: {type: integer, format: int64}
        credits_micro: {type: integer, format: int64}
        credits_wallet_micro: {type: integer, format: int64, description: The part of the charge paid from the partner's balance.}
        credits_own_micro: {type: integer, format: int64, description: The part of the charge paid from the workspace's own balance.}
    PartnerUsageWorkspace:
      allOf:
      - $ref: '#/components/schemas/PartnerUsageTotals'
      - type: object
        required: [external_user_id]
        properties:
          external_user_id: {type: string}
    PartnerWorkspace:
      type: object
      required: [workspace_id, external_user_id, status, created_at, free_credits]
      properties:
        workspace_id:
          type: string
          description: The workspace's organization id.
        external_user_id:
          type: string
        display_name:
          type: [string, 'null']
          maxLength: 100
          description: |
            The label the partner gave the workspace, or `null`. Set on `PUT` when that call creates the workspace,
            or with `PATCH`. Optional. The workspace's own key reports it as `organization.name` on `GET /v1/key`, so the end user can read it.
        status:
          type: string
          enum: [active, suspended, closed, deleted]
          description: |
            `deleted` when the workspace has been soft-deleted by Spicrawl support. A deleted workspace keeps
            its `external_user_id` but cannot be served; `PUT` on it is `409` and returns no key.
        created_at:
          type: string
          format: date-time
        free_credits:
          type: integer
          description: The workspace's monthly allowance, in whole credits, as set for the partner. Always 0 while the partner is on a paid plan.
        wallet_cap:
          type: integer
          nullable: true
          minimum: 0
          description: |
            The most this workspace may draw from the partner's balance in one allowance month, in whole
            credits. Its own setting when Spicrawl set one, else the partner's default. `null` when it has no
            cap. Free credits and the workspace's own balance are not counted against it. A request that would
            need more than the cap left is refused with `402 ERR::LIMIT::QUOTA_EXCEEDED` ("...reached its spending
            limit for this month..."). A cap change reaches requests within about 5 seconds.
        tier:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
          description: The tier the workspace is on, or `null` when it has none.
        requests_per_minute:
          type: integer
          nullable: true
          minimum: 1
          description: The tier's requests per minute for this user's scrape and browser requests, or `null` when there is no tier.
        concurrency:
          type: integer
          nullable: true
          minimum: 1
          description: The tier's requests and browser sessions a user may run at once, or `null` when there is no tier.
        wallet_cap_source:
          type: string
          enum: [tier, workspace, account_default, plan_default, none]
          description: |
            Where `wallet_cap` comes from. `tier`: the workspace's tier sets it. `workspace`: Spicrawl set it on
            this workspace while it is on no tier. `account_default`: the partner's default (a tier with no cap
            falls back to it). `plan_default`: the partner's paid plan sets it (none of the above is set). `none`:
            no cap, which only happens on the Free plan.
        window_resets_at:
          type: string
          format: date-time
          description: When the workspace's current allowance month ends (its monthly anniversary), RFC 3339 UTC.
        wallet_used:
          type: [integer, 'null']
          minimum: 0
          description: |
            Whole credits this user has drawn from the partner's balance in its current allowance month (floor).
            Compare with `wallet_cap`. Null on responses that do not compute it (`PUT`, suspend, reactivate) and
            when it cannot be read.
        wallet_used_source:
          type: [string, 'null']
          enum: [live, rollup, null]
          description: |
            `live` when read from the live counter, which is current. `rollup` when read from usage records,
            which trail by about 60 seconds. Null when `wallet_used` is null.
        free_used:
          type: [integer, 'null']
          minimum: 0
          description: Whole free credits this user has used in its current allowance month (floor). Null on responses that do not compute it.
        own_credits:
          type: [integer, 'null']
          minimum: 0
          description: |
            Credits the partner gave this user that remain unspent, in whole credits (floor). The single `GET`
            reads it live; the list reads usage records, so it can trail by about 60 seconds. Null on responses that
            do not compute it, and when it cannot be read.
    PartnerWorkspaceDetail:
      allOf:
      - $ref: '#/components/schemas/PartnerWorkspace'
      description: The single-workspace read. Same fields as `PartnerWorkspace`; kept as a name for existing clients of the spec.
    PartnerTier:
      type: object
      required: [id, name, requests_per_minute, concurrency, free_credits, wallet_cap, default, workspaces, created_at, updated_at]
      properties:
        id:
          type: string
          description: Spicrawl's id for the tier.
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique among the partner's tiers, ignoring case.
        requests_per_minute:
          type: integer
          minimum: 1
          description: Requests per minute a user may make to scrape, and cloud browser sessions a user may start. Cannot exceed the partner's ceiling (60 times its requests per second). The bucket holds ten seconds' worth, so at 6 a minute only one request may arrive at once; a request past it is `429 ERR::LIMIT::RATE_LIMITED` with `Retry-After`.
        concurrency:
          type: integer
          minimum: 1
          description: Requests and browser sessions a user may run at once. Cannot exceed the partner's concurrency limit.
        free_credits:
          type: integer
          minimum: 0
          description: Free credits per user per month, in whole credits. Cannot exceed the free credits Spicrawl grants the partner per workspace.
        wallet_cap:
          type: integer
          nullable: true
          minimum: 0
          description: Most credits per user per month the user may draw from the partner's balance. `null` means the tier sets no cap; a partner default then applies.
        default:
          type: boolean
          description: True on the one tier new workspaces start on.
        workspaces:
          type: integer
          minimum: 0
          description: Live workspaces on this tier.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PartnerTierList:
      type: object
      required: [tiers]
      properties:
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PartnerTier'
    PartnerTierInput:
      type: object
      required: [name, requests_per_minute, concurrency, free_credits]
      properties:
        name: {type: string, minLength: 1, maxLength: 60, description: 'Trimmed before it is stored.'}
        requests_per_minute: {type: integer, minimum: 1}
        concurrency: {type: integer, minimum: 1}
        free_credits: {type: integer, minimum: 0}
        wallet_cap: {type: integer, nullable: true, minimum: 0, maximum: 100000000}
        default: {type: boolean, description: 'Makes this tier the default. Ignored for the partner''s first tier, which is always the default.'}
    PartnerTierPatch:
      type: object
      description: Any subset of the `PartnerTierInput` fields. `default` may only be `true`.
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        requests_per_minute: {type: integer, minimum: 1}
        concurrency: {type: integer, minimum: 1}
        free_credits: {type: integer, minimum: 0}
        wallet_cap: {type: integer, nullable: true, minimum: 0, maximum: 100000000}
        default: {type: boolean, enum: [true]}
    PartnerTierAssign:
      type: object
      required: [tier]
      properties:
        tier:
          type: string
          description: The tier's id or its name.
    PartnerCreditAssignment:
      type: object
      required: [credits, idempotency_key]
      properties:
        credits:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Whole credits to move from the partner's balance to the user's own balance. At most the partner's balance (funded less spent); the credit line cannot be assigned.
        idempotency_key:
          type: string
          pattern: '^\S{8,100}$'
          description: 8 to 100 characters, no spaces. Use a new key for each assignment; a repeat with the same key changes nothing.
    PartnerCreditAssigned:
      type: object
      required: [external_user_id, credits, applied, user_credits, balance_available]
      properties:
        external_user_id: {type: string}
        credits: {type: integer, format: int64}
        applied:
          type: boolean
          description: False when the idempotency key was used before. Nothing changed.
        user_credits:
          type: integer
          format: int64
          description: The user's own assigned balance left, in whole credits.
        balance_available:
          type: integer
          format: int64
          description: The partner's assignable balance (funded less spent, floored at zero, credit line excluded) after this assignment, in whole credits. The field name is kept for compatibility.
    PartnerWorkspaceProvisioned:
      allOf:
      - $ref: '#/components/schemas/PartnerWorkspace'
      - type: object
        required: [created, api_key]
        properties:
          created:
            type: boolean
            description: True when this call created the workspace.
          api_key:
            type: string
            description: The workspace's default API key, in full. Normally the same on every call; a new one is issued if the stored key has expired or can no longer be read. Store the latest one; it is the workspace's credential.
    PartnerWorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/PartnerWorkspace'
        next_after:
          type: string
          description: Present when the page is full and `sort` is `external_user_id`. Pass it as `after` to read on.
        next_offset:
          type: integer
          description: Present when the page is full and `sort` is `wallet_used`. Pass it as `offset` to read on.
    PartnerSummary:
      type: object
      required: [partner, org_id, free_credits, workspace_daily_limit, workspace_count, limits, users, caps, allow_account_spend, balance]
      properties:
        partner: {type: boolean, description: Always true for a partner account.}
        allow_account_spend: {type: boolean, description: Whether Free-plan workspaces may draw the partner's account credits (PATCH /v1/partner/settings).}
        org_id: {type: string, format: uuid}
        free_credits:
          type: integer
          description: The partner's default monthly allowance per workspace, in whole credits.
        workspace_daily_limit:
          type: integer
          description: New workspaces the partner may create per UTC day.
        workspace_count:
          type: integer
          description: Workspaces the partner has created, deleted ones included.
        limits:
          type: object
          required: [max_requests_per_minute, max_concurrency, max_free_credits]
          properties:
            max_requests_per_minute: {type: integer}
            max_concurrency: {type: integer}
            max_free_credits: {type: integer, description: Whole credits. The most a tier may grant per workspace.}
        users:
          type: object
          required: [total, active, suspended]
          description: Workspaces not deleted. `total` also counts closed ones, which are in neither `active` nor `suspended`.
          properties:
            total: {type: integer}
            active: {type: integer}
            suspended: {type: integer}
        caps:
          type: object
          required: [committed, uncapped_users]
          description: Over active workspaces only.
          properties:
            committed:
              type: integer
              description: Sum of the effective monthly cap of each active workspace that has one, each floored to whole credits.
            uncapped_users:
              type: integer
              description: Active workspaces with no effective cap. They are not in `committed`.
        balance:
          type: object
          description: The same figures as `GET /v1/partner/wallet` (the partner's account credits for this month). Only `balance_credits` can be given to users.
          required: [funded_credits, credit_line_credits, spent_credits, balance_credits, available_credits]
          properties:
            funded_credits: {type: integer}
            credit_line_credits: {type: integer}
            spent_credits: {type: integer}
            balance_credits: {type: integer, description: What has been added, less what users have spent. The most that can be given to users.}
            available_credits: {type: integer, description: Balance plus credit line.}
            funded_micro: {type: integer, format: int64}
            credit_line_micro: {type: integer, format: int64}
            spent_micro: {type: integer, format: int64}
            balance_micro: {type: integer, format: int64}
            available_micro: {type: integer, format: int64}
    KeyInfo:
      type: object
      required: [key_id, name, prefix, scopes, environment, organization, partner, created_at]
      description: What the calling key is. Never the secret or its hash.
      properties:
        key_id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string, description: The display prefix, e.g. `spicrawl_live_a1b2`.}
        scopes:
          type: array
          items: {type: string}
        environment:
          type: string
          enum: [live, test]
        organization:
          type: object
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name:
              type: string
              description: |
                The organization's name. For a partner's workspace it is the workspace's display name, else its
                `external_user_id`; it never shows the partner's name.
        partner:
          type: boolean
          description: True only for the key of a partner account. A partner's workspace key reports false.
        created_at: {type: string, format: date-time}
        expires_at:
          type: [string, 'null']
          format: date-time
    JobSearchRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: |
            Words to match in the job title. Web-search syntax: `backend engineer` matches both words,
            `"staff engineer"` a phrase, `engineer -senior` excludes a word, `ml or "machine learning"`
            matches either. Optional: a blank title is treated as absent. Without a title, the request
            must carry at least one filter (`posted_within`, `region`, `country`, `workplace`,
            `visa_sponsorship: true`, `platforms`, `seniority`, `employment_type`, `skills`, `language`
            or `salary_min`), or it is a `400` with `ERR::REQUEST::MISSING_PARAMETER`.
          examples:
          - backend engineer -senior
        posted_within:
          type: string
          pattern: '^([1-9]|[1-6][0-9]|7[0-2])h$|^([1-9]|[12][0-9]|30)d$'
          description: |
            Only postings first seen within this window, as hours (`1h` to `72h`) or days (`1d` to `30d`).
            Omitted means any age. Results are only as fresh as the crawl: boards are re-read about every
            6 hours, so a posting from the last hour may not be indexed yet.
          examples:
          - 6h
          - 24h
          - 7d
        region:
          type: string
          maxLength: 100
          description: |
            A country name or code, or a city. Matched case-insensitively against the posting's
            location text and its country.
          examples:
          - Berlin
        workplace:
          type: array
          items:
            type: string
            enum: [remote, hybrid, onsite]
        visa_sponsorship:
          type: boolean
          description: '`true` returns only postings known to sponsor. Most postings are `unknown`, so this narrows results a lot.'
        platforms:
          type: array
          description: Omitted or empty means all platforms.
          items:
            type: string
            enum:
            - greenhouse
            - lever
            - ashby
            - yc
            - wellfound
            - techtree
            - reddit
            - workable
            - smartrecruiters
            - recruitee
            - breezy
            - pinpoint
            - personio
            - workday
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
          description: 'With find_contacts set to true, the maximum is 10 and the default is 10. A larger value is a `400`.'
        cursor:
          type: string
          description: The `next_cursor` from the previous page, passed back verbatim.
        find_contacts:
          type: boolean
          default: false
          description: |
            Look up company-level contacts for postings that name none: Y Combinator founders, and names from
            a company's own team or about page. Adds `contacts_found` to the response, caps `limit` at 10, and
            costs 5 credits per posting that gets contacts. Can take up to about 30 seconds. Returns names and
            roles only, never email addresses or phone numbers. A `400` on a deployment without contact lookup.
        seniority:
          type: array
          maxItems: 6
          description: |
            Any of the listed levels. Read from the job title only, and most titles carry no level, so most
            postings are `unknown` and this filter narrows results a lot.
          items:
            type: string
            enum: [intern, entry, mid, senior, lead, executive]
        employment_type:
          type: array
          maxItems: 5
          description: Any of the listed types. Taken from the platform's field where it has one (English, German, Dutch, French and Spanish values are understood), otherwise from an unambiguous title tag such as an internship word or `(Contract)`.
          items:
            type: string
            enum: [full_time, part_time, contract, internship, temporary]
        skills:
          type: array
          maxItems: 10
          description: |
            Every skill listed must match. An empty array is the same as omitting the field. Aliases are accepted (`golang` is `go`, `k8s` is `kubernetes`,
            `postgres` is `postgresql`). An unknown skill is a `400` that names it. Matched against a fixed
            vocabulary in the title and description; a posting whose description is not available only has
            skills found in its title.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples:
          - [go, postgresql]
        language:
          type: string
          pattern: '^[A-Za-z]{2}$'
          description: ISO 639-1 code of the language the posting is written in, such as `en`. Matched case-insensitively. Detected from the posting text. An empty string is the same as omitting the field.
          examples:
          - en
        country:
          type: string
          pattern: '^[A-Za-z]{2}$'
          description: |
            ISO 3166-1 alpha-2 code, such as `DE`. Matched case-insensitively. An empty string is the same as
            omitting the field. Matches the platform's country field or the
            location text. Independent of `region`, which is a substring match on the location.
          examples:
          - DE
        salary_min:
          type: number
          exclusiveMinimum: 0
          maximum: 10000000
          description: |
            A yearly amount. Returns postings whose published yearly salary, in `salary_currency`, reaches it.
            No exchange-rate conversion. Hourly and monthly salaries are converted to a year at 2080 hours and
            12 months. Postings that publish no salary never match.
          examples:
          - 100000
        salary_currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          description: ISO 4217 code, upper-cased. Defaults to `USD` when `salary_min` is set. A `400` when given without `salary_min`.
          examples:
          - EUR
        status:
          type: string
          enum: [open, closed, any]
          default: open
          description: |
            `open` returns open postings only, which is the default. `closed` returns postings that left their
            board and are kept for 30 days. `any` returns both.
        include_description:
          type: boolean
          default: false
          description: Adds `description`, the posting's plain text capped at 20,000 characters, to each job. Responses become much larger.
    JobSearchResponse:
      type: object
      required: [jobs, credits_used]
      properties:
        jobs:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/JobPosting'
        next_cursor:
          type: string
          description: Pass it back as `cursor` to read the next page.
        credits_used:
          type: integer
          description: Credits charged for this request. 2, or 0 when billing is off. With `find_contacts`, add 5 for each posting that got contacts.
          examples:
          - 2
        contacts_found:
          type: integer
          minimum: 0
          description: Number of postings that got at least one contact from the `find_contacts` lookup. Present only when `find_contacts` was `true`.
    JobPosting:
      type: object
      required: [id, platform, title, company, company_url, url, apply_url, location, country, workplace, seniority, employment_type, skills, visa_sponsorship, posted_at, status, first_seen_at, last_seen_at, people]
      properties:
        id:
          type: string
          description: Stable id, `<platform>:<platform id>`.
          examples:
          - greenhouse:4012345
        platform:
          type: string
          enum:
          - greenhouse
          - lever
          - ashby
          - yc
          - wellfound
          - techtree
          - reddit
          - workable
          - smartrecruiters
          - recruitee
          - breezy
          - pinpoint
          - personio
          - workday
        title:
          type: string
        company:
          type: string
        company_url:
          type: string
          description: Empty when the platform does not give one.
        url:
          type: string
          format: uri
          description: The posting itself. The plain-text description is returned only with `include_description`; otherwise fetch this URL with `POST /v1/scrape`.
        apply_url:
          type: string
          format: uri
          description: The platform's own apply link when it publishes one (Lever, Ashby, YC, Workable, Recruitee), otherwise the same as `url`. Always present and never empty.
        location:
          type: string
          description: The location text as the platform gives it.
        country:
          type: string
          description: Filled only when the platform gives a structured country. Empty otherwise.
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 code derived from the country field or the location text. Absent for Remote, Worldwide or unparseable locations.
          examples:
          - DE
        workplace:
          type: string
          enum: [remote, hybrid, onsite, unknown]
          description: From the platform's own field where one exists (Lever, Ashby), otherwise read from the location text.
        seniority:
          type: string
          enum: [intern, entry, mid, senior, lead, executive, unknown]
          description: Read from the job title. `unknown` when the title carries no level, which is most postings.
        employment_type:
          type: string
          enum: [full_time, part_time, contract, internship, temporary, unknown]
          description: From the platform's field where it has one (English, German, Dutch, French and Spanish values are understood), otherwise from an unambiguous title tag such as an internship word or `(Contract)`. `unknown` when neither says.
        skills:
          type: array
          description: Canonical skill names found in the title and description (or title only, when no description is available). Empty array when none are found.
          items:
            type: string
          examples:
          - [go, postgresql]
        language:
          type: string
          pattern: '^[a-z]{2}$'
          description: ISO 639-1 code of the language the posting is written in, detected from its text. Absent when not confident.
        visa_sponsorship:
          type: string
          enum: [yes, 'no', unknown]
          description: Whether the posting sponsors. Most postings are `unknown`.
        visa_source:
          type: string
          enum: [listed, inferred]
          description: '`listed` when the platform publishes sponsorship as a field (YC, Wellfound). `inferred` when Spicrawl read it from the description text, which can be wrong. Absent when the value is unknown.'
        salary:
          $ref: '#/components/schemas/JobSalary'
        posted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the posting was published. `null` when the platform gives no date. For YC this is approximate, because the source shows relative ages.
        status:
          type: string
          enum: [open, closed]
          description: '`closed` when the posting left its board. The crawler notices up to one crawl interval after it closed.'
        first_seen_at:
          type: string
          format: date-time
          description: When the crawler first indexed the posting.
        last_seen_at:
          type: string
          format: date-time
          description: When the crawler last saw the posting on its board.
        closed_at:
          type: string
          format: date-time
          description: When the crawler noticed the posting had left its board. Absent while the posting is open. Closed postings are removed 30 days later.
        description:
          type: string
          maxLength: 20000
          description: The posting's plain text. Present only when `include_description` was `true`. May be empty when the description is not available.
        people:
          type: array
          description: Hiring contacts. Usually empty. Entries from the posting itself (YC hiring managers; Wellfound founders and hiring contact), and, with `find_contacts`, contacts found for the company.
          items:
            $ref: '#/components/schemas/JobPerson'
    JobPerson:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
        role:
          type: string
          examples:
          - Hiring manager
        source:
          type: string
          enum: [posting, yc_company_page, company_site]
          description: |
            Where the name came from. `posting` means the posting itself named them (YC hiring managers).
            `yc_company_page` means the Y Combinator company page lists them as a founder. `company_site`
            means the company's own team or about page names them.
          examples:
          - posting
    JobSalary:
      type: object
      description: Present only when the platform publishes a salary. A bound of zero or less is treated as not published, and a salary with no bound and no text (or only a zero range such as `$0 - $0`) is omitted. When the text was not parsed into numbers, `text` carries it as written.
      properties:
        min:
          type: number
        max:
          type: number
        yearly_min:
          type: number
          description: The minimum converted to a yearly amount, in `currency`. Hourly and monthly salaries use 2080 hours and 12 months. Absent when unknown.
        yearly_max:
          type: number
          description: The maximum converted to a yearly amount, in `currency`. Absent when unknown.
        currency:
          type: string
          examples:
          - EUR
        period:
          type: string
          examples:
          - year
        text:
          type: string
          description: The original salary text, when it was not parsed into numbers.
    WebhookEvent:
      type: string
      description: Events an endpoint can subscribe to. `ping` is always delivered and is not listed.
      enum:
      - batch.completed
      - batch.failed
      - monitor.changed
      - monitor.failed
    WebhookFormat:
      type: string
      description: |
        Body shape. `json` is the signed JSON document. `slack` posts `{"text": summary}` and `discord` posts
        `{"content": summary}` (at most 2,000 characters) for incoming-webhook URLs. Signature headers are sent in
        every format.
      enum:
      - json
      - slack
      - discord
    WebhookEndpoint:
      type: object
      description: A registered webhook endpoint. Never includes the signing secret.
      required:
      - id
      - url
      - events
      - format
      - enabled
      - consecutive_failures
      - secret_version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Endpoint id. Use it in the `webhookID` path parameter and as `webhook_endpoint_id` on a batch.
          examples:
          - 0190f3a2-7c1e-7d4b-9a2f-3b8e5c6d7e80
        name:
          type: [string, 'null']
          maxLength: 100
        url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS URL that receives the deliveries.
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        format:
          $ref: '#/components/schemas/WebhookFormat'
        enabled:
          type: boolean
          description: 'False once the endpoint was disabled, by a failure streak or by `enabled: false`.'
        disabled_reason:
          type: [string, 'null']
          description: Why the endpoint is disabled, when it is. Null while enabled.
        consecutive_failures:
          type: integer
          minimum: 0
          description: Failed deliveries in a row. Reset by a success, and by re-enabling. At 100 the endpoint is disabled.
        last_success_at:
          type: [string, 'null']
          format: date-time
        last_failure_at:
          type: [string, 'null']
          format: date-time
        secret_version:
          type: integer
          minimum: 1
          description: Starts at 1 and goes up by one on each rotation. Also the `kid` in signature headers.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEndpointWithSecret:
      description: Returned by create and rotate-secret. `secret` is shown once.
      allOf:
      - $ref: '#/components/schemas/WebhookEndpoint'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            pattern: '^whsec_'
            description: |
              The HMAC signing key, as a string of the form `whsec_<random>`. Use the whole string, prefix included,
              as the key bytes. Store it now; it is never returned again.
    WebhookEndpointCreate:
      type: object
      description: Body of POST /v1/webhooks. Unknown fields are a 400.
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        name:
          type: string
          maxLength: 100
        events:
          type: array
          minItems: 1
          description: Defaults to `["batch.completed", "batch.failed"]`.
          items:
            $ref: '#/components/schemas/WebhookEvent'
        format:
          $ref: '#/components/schemas/WebhookFormat'
      additionalProperties: false
    WebhookEndpointUpdate:
      type: object
      description: Body of PATCH /v1/webhooks/{webhookID}. Send at least one field. Unknown fields are a 400.
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        name:
          type: string
          maxLength: 100
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEvent'
        format:
          $ref: '#/components/schemas/WebhookFormat'
        enabled:
          type: boolean
      additionalProperties: false
    WebhookEndpointList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
    WebhookDeliveryStatus:
      type: string
      enum:
      - pending
      - delivering
      - delivered
      - failed
      - dead
    WebhookDelivery:
      type: object
      description: One event sent to one endpoint. Attempts are not listed separately.
      required:
      - id
      - event_type
      - event_id
      - status
      - attempt
      - max_attempts
      - created_at
      properties:
        id:
          type: string
          description: Delivery id. Also sent as `X-ILayer-Delivery`.
        event_type:
          type: string
          examples:
          - batch.completed
          - ping
        event_id:
          type: string
          description: Id of the object the event is about (the batch job, or the monitor event).
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempt:
          type: integer
          minimum: 0
          description: Attempts made so far.
        max_attempts:
          type: integer
          minimum: 1
          description: The first attempt plus six retries.
        next_retry_at:
          type: [string, 'null']
          format: date-time
        last_error:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    WebhookDeliveryList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
    WebhookTestResponse:
      type: object
      required:
      - delivery_id
      properties:
        delivery_id:
          type: string
    MonitorCheckOutcome:
      type: string
      description: |
        What one check found. `unchanged` and `changed` are a fetched page. `not_modified` means the target
        answered `304 Not Modified` to a conditional request, so nothing was re-read. `failed` means the page could
        not be checked; it counts toward the auto-disable limit.
      enum:
      - unchanged
      - changed
      - not_modified
      - failed
    Monitor:
      type: object
      description: 'A change monitor for one page (`scope: page`) or a whole site (`scope: site`). Never includes the content it last captured.'
      required:
      - id
      - name
      - url
      - selector
      - js_render
      - interval_seconds
      - current_interval_seconds
      - confirm_checks
      - webhook_endpoint_id
      - enabled
      - disabled_reason
      - last_error
      - last_checked_at
      - last_changed_at
      - next_check_at
      - consecutive_failures
      - scope
      - max_pages
      - include_paths
      - exclude_paths
      - max_credits_per_run
      - pages_tracked
      - last_run
      - created_at
      - updated_at
      properties:
        id:
          type: string
          examples:
          - 0190f5c4-2b7a-7e10-8d3f-6a1c9e4b2d70
        name:
          type: string
          maxLength: 100
          description: Defaults to the host of `url`.
        url:
          type: string
          format: uri
          maxLength: 2048
        selector:
          type: [string, 'null']
          maxLength: 512
          description: CSS selector. Every element it matches is watched, as its text, in document order. Null watches the main content of the page.
        js_render:
          type: boolean
          description: Render the page in a browser before reading it. Costs more credits; see the Monitors section of the API reference.
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          description: The interval you asked for. Defaults to the plan minimum.
        current_interval_seconds:
          type: integer
          description: The interval in force now. It moves between the plan minimum and `interval_seconds` as the page changes or stays put.
        confirm_checks:
          type: integer
          minimum: 1
          maximum: 10
          description: A change must be seen on this many checks in a row before it is reported. 1 reports the first change.
        webhook_endpoint_id:
          type: [string, 'null']
          description: The endpoint that receives `monitor.changed` and `monitor.failed`. Null when none is set.
        enabled:
          type: boolean
          description: 'False once the monitor was disabled, by repeated failures, by running out of credits, or by `enabled: false`.'
        disabled_reason:
          type: [string, 'null']
          description: Why the monitor is disabled, when it is. Null while enabled.
        last_error:
          type: [string, 'null']
          description: A short description of the most recent failed check. Cleared by a successful check and by re-enabling.
        last_checked_at:
          type: [string, 'null']
          format: date-time
        last_changed_at:
          type: [string, 'null']
          format: date-time
        next_check_at:
          type: [string, 'null']
          format: date-time
        consecutive_failures:
          type: integer
          minimum: 0
          description: Failed checks in a row. A success resets it. The monitor disables itself when it reaches the limit.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        scope:
          type: string
          enum:
          - page
          - site
          description: '`page` watches one URL. `site` watches every page the start URL leads to on its exact host. Set at create; it cannot be changed.'
        max_pages:
          type: [integer, 'null']
          minimum: 1
          description: Site monitors only. The most pages a run considers. Null for page monitors.
        include_paths:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: Site monitors only. Path patterns a page must match to be kept. Empty keeps every path.
        exclude_paths:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: Site monitors only. Path patterns that drop a page. Applied after `include_paths`.
        max_credits_per_run:
          type: [integer, 'null']
          minimum: 1
          description: Site monitors only. A run stops fetching when the next fetch would exceed this many credits. Null for no cap.
        pages_tracked:
          type: [integer, 'null']
          minimum: 0
          description: Site monitors only. Pages the monitor currently tracks, not counting removed ones. Null for page monitors.
        last_run:
          oneOf:
          - $ref: '#/components/schemas/MonitorRunSummary'
          - type: 'null'
          description: Site monitors only. Counts of the most recent run. Null until a run has finished, and for page monitors.
    MonitorCreate:
      type: object
      description: Body of POST /v1/monitors. Unknown fields are a 400.
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          pattern: '^https?://'
          maxLength: 2048
        name:
          type: string
          maxLength: 100
        selector:
          type: string
          maxLength: 512
          description: CSS selector. Omit to watch the main content.
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          description: Between the plan minimum and 2,592,000 (30 days). Defaults to the plan minimum.
        webhook_endpoint_id:
          type: string
          minLength: 1
          maxLength: 64
        confirm_checks:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        js_render:
          type: boolean
          default: false
        scope:
          type: string
          enum:
          - page
          - site
          default: page
          description: '`site` watches every page reachable from `url` on its exact host. Requires `max_pages`.'
        max_pages:
          type: integer
          minimum: 1
          description: Site only, and required for it. The most pages a run considers. Capped by your plan (free 25, starter 250, pro and other paid plans 2,000, enterprise and internal 10,000).
        include_paths:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: Site only. Path patterns a page must match to be kept. See the Monitors section of the API reference.
        exclude_paths:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: Site only. Path patterns that drop a page.
        max_credits_per_run:
          type: integer
          minimum: 1
          description: Site only. Optional cap on the credits one run may spend.
      additionalProperties: false
    MonitorUpdate:
      type: object
      description: Body of PATCH /v1/monitors/{monitorID}. Send at least one field. Unknown fields are a 400. `scope` cannot be changed, so sending it is a 400.
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 100
        selector:
          type: [string, 'null']
          maxLength: 512
        interval_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
        webhook_endpoint_id:
          type: [string, 'null']
          description: Null clears the endpoint.
        confirm_checks:
          type: integer
          minimum: 1
          maximum: 10
        js_render:
          type: boolean
        enabled:
          type: boolean
          description: 'True re-enables the monitor: it clears `disabled_reason` and `last_error`, resets `consecutive_failures` to 0, and sets `next_check_at` to now.'
        max_pages:
          type: integer
          minimum: 1
          description: Site monitors only. Same rule as on create, capped by the plan.
        include_paths:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: Site monitors only. Replaces the whole list.
        exclude_paths:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: Site monitors only. Replaces the whole list.
        max_credits_per_run:
          type: [integer, 'null']
          minimum: 1
          description: Site monitors only. Null removes the cap.
      additionalProperties: false
    MonitorList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Monitor'
    MonitorCheckResult:
      type: object
      description: Result of POST /v1/monitors/{monitorID}/check.
      required:
      - outcome
      - credits
      properties:
        outcome:
          $ref: '#/components/schemas/MonitorCheckOutcome'
        event_id:
          type: string
          description: The change event, present only when `outcome` is `changed`.
        credits:
          type: integer
          minimum: 0
          description: Credits this check cost. The same as the scrape that did the fetch. For a site monitor, the credits the whole run spent.
        run:
          $ref: '#/components/schemas/MonitorRunSummary'
    MonitorRunSummary:
      type: object
      description: Counts of one site run. Also the `last_run` of a site monitor, and `run` in a site check result.
      required:
      - checked
      - skipped
      - changed
      - added
      - removed
      - credits
      - truncated
      properties:
        checked:
          type: integer
          minimum: 0
          description: Pages fetched this run.
        skipped:
          type: integer
          minimum: 0
          description: Pages left out without a fetch, because their sitemap `lastmod` had not changed. They cost nothing.
        changed:
          type: integer
          minimum: 0
        added:
          type: integer
          minimum: 0
          description: Pages seen for the first time, or seen again after being removed.
        removed:
          type: integer
          minimum: 0
          description: Pages no longer found, or that answered 404 or 410.
        credits:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: True when `max_credits_per_run` stopped the run before every page was fetched.
    MonitorSiteDigest:
      type: object
      description: The digest of a site run that found a change. The `summary` of a site change, and the same lists the `monitor.changed` site event carries.
      required:
      - counts
      - truncated
      - changed
      - added
      - removed
      properties:
        counts:
          $ref: '#/components/schemas/MonitorRunSummary'
        truncated:
          type: boolean
        changed:
          type: array
          maxItems: 50
          description: Pages whose content changed. Each diff is at most 2,000 characters.
          items:
            type: object
            required:
            - url
            - diff
            properties:
              url:
                type: string
              diff:
                type: string
                maxLength: 2000
        added:
          type: array
          maxItems: 100
          items:
            type: string
        removed:
          type: array
          maxItems: 100
          items:
            type: string
    MonitorPage:
      type: object
      description: One page a site monitor tracks.
      required:
      - url
      - first_seen_at
      - last_seen_at
      - last_changed_at
      - removed_at
      properties:
        url:
          type: string
          format: uri
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        last_changed_at:
          type: [string, 'null']
          format: date-time
        removed_at:
          type: [string, 'null']
          format: date-time
          description: Set while the page is removed. Removed pages stay in the list.
    MonitorPageList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonitorPage'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page. Null on the last page.
    MonitorChange:
      type: object
      description: One confirmed change to a monitor. The customer-visible history of the monitor. A site monitor records one change per run that found something, with `summary` set and `diff` null.
      required:
      - id
      - detected_at
      - previous_hash
      - new_hash
      - diff
      - notified_at
      properties:
        id:
          type: string
        detected_at:
          type: string
          format: date-time
        previous_hash:
          type: [string, 'null']
          description: SHA-256 of the watched content before the change.
        new_hash:
          type: string
          description: SHA-256 of the watched content after the change.
        diff:
          type: [string, 'null']
          maxLength: 65536
          description: Unified line diff from the previous content to the new one. Truncated at 65,536 characters. Null for a site change, see `summary`.
        summary:
          oneOf:
          - $ref: '#/components/schemas/MonitorSiteDigest'
          - type: 'null'
          description: Site changes only. The run's digest.
        notified_at:
          type: [string, 'null']
          format: date-time
          description: When the `monitor.changed` delivery was queued. Null when the monitor had no enabled endpoint subscribed to it.
    MonitorChangeList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/MonitorChange'
    MonitorChangedEvent:
      description: The `data` of a `monitor.changed` delivery, sent inside the usual `{id, type, created, data}` envelope. A page monitor sends the page variant. A site monitor sends one site variant per run that found a change, never one per page.
      oneOf:
      - $ref: '#/components/schemas/MonitorChangedPageEvent'
      - $ref: '#/components/schemas/MonitorChangedSiteEvent'
    MonitorChangedSiteEvent:
      type: object
      description: The `data` of a site `monitor.changed` delivery. One digest per run that found a change.
      required:
      - monitor_id
      - name
      - url
      - scope
      - detected_at
      - counts
      - truncated
      - changed
      - added
      - removed
      - changes_url
      properties:
        monitor_id:
          type: string
        name:
          type: string
        url:
          type: string
          description: The start URL of the site monitor.
        scope:
          type: string
          enum:
          - site
        detected_at:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/MonitorRunSummary'
        truncated:
          type: boolean
          description: True when `max_credits_per_run` stopped the run early.
        changed:
          type: array
          maxItems: 50
          items:
            type: object
            required:
            - url
            - diff
            properties:
              url:
                type: string
              diff:
                type: string
                maxLength: 2000
        added:
          type: array
          maxItems: 100
          items:
            type: string
        removed:
          type: array
          maxItems: 100
          items:
            type: string
        changes_url:
          type: string
          example: /v1/monitors/0190f5c4-2b7a-7e10-8d3f-6a1c9e4b2d70/changes
    MonitorChangedPageEvent:
      type: object
      description: The `data` of a page `monitor.changed` delivery.
      required:
      - monitor_id
      - name
      - url
      - detected_at
      - previous_hash
      - new_hash
      - diff
      - changes_url
      properties:
        monitor_id:
          type: string
        name:
          type: string
        url:
          type: string
        detected_at:
          type: string
          format: date-time
        previous_hash:
          type: [string, 'null']
        new_hash:
          type: string
        diff:
          type: string
          maxLength: 4000
          description: The first 4,000 characters of the change's diff. The full diff is in `changes_url`.
        changes_url:
          type: string
          example: /v1/monitors/0190f5c4-2b7a-7e10-8d3f-6a1c9e4b2d70/changes
    MonitorFailedEvent:
      type: object
      description: The `data` of a `monitor.failed` delivery. Sent when a monitor is disabled after repeated failed checks.
      required:
      - monitor_id
      - name
      - url
      - reason
      - failed_at
      properties:
        monitor_id:
          type: string
        name:
          type: string
        url:
          type: string
        reason:
          type: string
          description: Why the monitor was disabled, the last check error.
        failed_at:
          type: string
          format: date-time
  responses:
    BrowserControl:
      description: 'Who drives the session, sent with Cache-Control no-store.'
      content:
        application/json:
          schema:
            type: object
            required: [session_id, status, controller, expires_at]
            properties:
              session_id:
                type: string
              status:
                type: string
                examples:
                - running
              controller:
                type: string
                description: '`agent` (your CDP connection drives) or `human` (a person in the live view drives).'
                examples:
                - agent
              expires_at:
                type: string
                format: date-time
                description: When the session ends at the latest (its `session_ttl`).
    BadRequest:
      description: The request is invalid. Not retryable; fix the request using `code` and `diagnostics.hint`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, revoked or expired key. Not retryable with the same key.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PaymentRequired:
      description: '`ERR::LIMIT::QUOTA_EXCEEDED`: the organization is out of credits. Not retryable until
        credits are added. For a partner workspace the message says its free credits are used, with the
        date they return; once the partner''s balance or the workspace''s own balance has been funded and is
        exhausted, it says the provider''s balance is exhausted and the partner must add balance. For an
        ordinary organization the `detail` ends with: To get higher limits, contact our team from the dashboard or at support@spicrawl.com about upgrading your plan.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        X-Credits-Remaining:
          description: '`/v1/scrape` only: whole credits left in the monthly allowance when the request
            was refused. Can be above 0: less than this request needed.'
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The key lacks the scope this route requires (`ERR::AUTH::INSUFFICIENT_SCOPE`), or the
        action is not permitted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource for this key's organization.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicts with the resource's current state, for example a session in use (`ERR::SESSION::BUSY`,
        retryable).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The resource existed but is past its retention window or was purged. Not retryable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate, concurrency or live-session limit reached. Retryable after `Retry-After`. For an
        ordinary organization the rate and concurrency `detail` ends with the sentence "To get higher limits, contact our team from the dashboard or at support@spicrawl.com about upgrading your plan."
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: Internal error. Retryable when `retryable` is true.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: The capability is not deployed on this host. Not retryable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: The target, the proxy or the render engine failed. Check `code` and `target_status`;
        most are retryable and cost 0 credits.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: No proxy exit or engine capacity was available. Retryable after `Retry-After`; 0 credits.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: The target did not answer in time (`ERR::UPSTREAM::TIMEOUT`). Retryable; 0 credits.
        See `diagnostics.hint`.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
paths:
  /v1/scrape:
    get:
      operationId: scrapeGet
      tags:
      - Scrape
      summary: Scrape a URL (query-string form)
      description: |-
        Fetch one URL synchronously and return it as html, markdown, text, a PDF, or a JSON envelope with extracted data.

        How a request is rendered (cheapest first). You do not choose: Spicrawl picks the cheapest path that can do what the request asks.
        - Default (plain fetch, 1 credit): plain HTTP, no JavaScript, presenting a current browser TLS/HTTP2 fingerprint (`impersonate`, on by default and free; `impersonate=false` turns it off).
        - `js_render=true` (JavaScript rendering, 3 credits): content is built by JavaScript, or you need wait/wait_for/block_resources/network_capture.
        - Screenshots, `response_format=pdf`, `actions` and `scroll_pages` use full-browser rendering (8 credits). `stealth=true` (full-browser rendering hardened against bot detection, 25 credits) is coming soon.
        - `mode=auto`: unsure - escalates through the available rendering tiers, bills only the tier that worked.
        - Managed proxy pools (`premium_proxy`) are coming soon; during the beta pass your own proxy with `proxy`.
        - The `engine` and `headless` fields are deprecated and ignored.
        Browser-only flags on the fetch tier are a 400, never silently ignored.

        Billing: failures cost 0 (errors, bot challenges, timeouts, target statuses other than 200/404/410 unless listed in allowed_status_codes, undelivered screenshots). A cache hit is billed at the same price as the fetch that stored it: the cache saves the fetch (latency and load on the target), not credits. Like any request, a hit is refused with 402 when the monthly allowance cannot cover its price. Check X-Credits-Charged.

        Bot challenges: a challenge page attributed to a named vendor (Cloudflare, DataDome, PerimeterX, Akamai) is never returned as a success. A fetch through a managed pool exit that meets one is retried once on a different exit, free (GET/HEAD/OPTIONS only, not with `sticky_key` or `session_id`, never on your own `proxy`). When you bring your own `proxy` (residential works best) and send no `mode=auto`, a request whose page is still a challenge is escalated automatically to stronger full-browser rendering on the same exit, which works through the interstitial and returns the real page; there is no flag to set. This is how Cloudflare-protected pages are supported. Automatic handling on managed premium exits is coming soon. Success is not guaranteed for every page. Only the tier that returned the page is billed (up to 25 credits, or the first tier's price), and 0 if every tier was challenged (502 ERR::UPSTREAM::CHALLENGE). On the default shared pool a challenged page may return that error; retry with your own residential `proxy`. A transport error, a refusal with no vendor marker (such as a bare 403) or a non-billable status such as 404 does not escalate. Escalation is skipped for a non-GET method, response_format=pdf, a screenshot, actions, a `proxy` that is not http://, or a max_cost below the escalated price; an allowance that covers the first attempt but not the escalation runs the request without it. X-Engine reports the rendering tier that served, each abandoned tier adds an `X-Warning: ESCALATED`, and diagnostics.attempts lists every attempt (in the JSON envelope on a successful escalation). On a successful escalation the JSON envelope's `warnings` array carries the same `ESCALATED` entries. Batch items never escalate.

        Status: the HTTP status is the platform's. A blocked or erroring site is usually still HTTP 200 - read envelope `status` or X-Target-Status for the site's answer. Errors are application/problem+json; retry only when `retryable` is true.

        Not idempotent: there is no idempotency key, and each call bills again, whether it performs a new scrape or is served from cache. GET and POST accept the same parameters and behave identically.
      security:
      - bearerAuth: []
      x-spicrawl-scope: scrape
      x-spicrawl-credits:
        unit: credits per successful request
        matrix:
          fetch:
            direct: 1
            datacenter: 1
            residential: 10
            mobile: 10
          js_rendering:
            direct: 3
            datacenter: 3
            residential: 25
            mobile: 25
          stealth_rendering:
            direct: 25
            datacenter: 25
            residential: 25
            mobile: 25
          full_browser_rendering:
            direct: 8
            datacenter: 8
            residential: 32
            mobile: 32
        custom_proxy: priced as the direct column (no proxy surcharge)
        ai_extract: 4
        ai_extract_note: added on top of the rendering price; the only additive item
        captcha_solve: 5
        captcha_solve_note: added once per request when a provider solved a captcha or blocking challenge on the rendering that served the page; not on a failed solve, a cache hit or a batch item
        failures: 0
        cache_hit: the price of the fetch that stored it
        billable_target_statuses:
        - 200
        - 404
        - 410
        billable_target_statuses_note: plus any in allowed_status_codes; other target statuses return
          the body at 0
        mode_auto: bills only the rung that succeeded; reserves the dearest rung against the monthly allowance
        challenge_escalation: with your own proxy, a vendor challenge may be escalated to stronger rendering; bills
          only the rung that returned the page, 0 if every rung was challenged; batch items never climb
        impersonate: 0
        extract_autoparse_links_network_capture: 0
      parameters:
      - name: url
        in: query
        required: true
        description: Target URL; required, must be http or https with a host. A private or reserved address
          fails with 400 ERR::SECURITY::SSRF_BLOCKED at 0 credits.
        schema:
          type: string
          format: uri
          maxLength: 8192
      - name: method
        in: query
        required: false
        description: HTTP method sent to the target (case-insensitive). There is no request-body parameter,
          so non-GET methods are sent without a body; only GET/HEAD/OPTIONS are retried on transient failure
          and only GET results are cached.
        schema:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
          - OPTIONS
          default: GET
      - name: js_render
        in: query
        required: false
        description: Run the page's JavaScript before capture (3 credits on datacenter or your own proxy; 25 on managed
          residential exits, coming soon). Required by every browser-only flag unless stealth or mode=auto is set; cannot be combined
          with mode=auto. If omitted, the project's stored default applies. Accepts true/false/1/0; a
          bare `?js_render` means true.
        schema:
          type: boolean
          default: false
      - name: stealth
        in: query
        required: false
        description: Coming soon. Render with full-browser rendering hardened against bot detection, flat 25 credits at any
          proxy tier; wins over js_render when both are set. Cannot be combined with mode=auto; returns
          503 ERR::ENGINE::UNAVAILABLE where it is not available. If omitted,
          the project's stored default applies. Accepts true/false/1/0; a bare `?stealth` means true.
        schema:
          type: boolean
          default: false
      - name: solve_captcha
        in: query
        required: false
        description: Solve the captcha widgets embedded in the page (Cloudflare Turnstile, reCAPTCHA v2, hCaptcha) before
          `actions` run. Selects full-browser rendering, as `stealth` does. Cannot be combined with mode=auto, which returns
          400 ERR::REQUEST::INCOMPATIBLE_FLAGS. Not available on batch jobs. A successful solve adds 5 credits. Accepts
          true/false/1/0; a bare `?solve_captcha` means true.
        schema:
          type: boolean
          default: false
      - name: impersonate
        in: query
        required: false
        description: Fetch tier only. Present a current browser TLS/HTTP2 fingerprint, with matching browser
          headers and Accept-Encoding, to pass passive fingerprint checks. On by default, free, no JavaScript;
          `impersonate=false` turns it off and the fetch uses a non-browser TLS handshake. Ignored on rendered
          requests.
          If omitted, the project's stored default applies, and true when the project sets none. Accepts
          true/false/1/0; a bare `?impersonate` means true.
        schema:
          type: boolean
          default: true
      - name: mode
        in: query
        required: false
        description: '`auto` escalates through the rendering tiers (plain fetch, then JavaScript rendering) until one returns a usable page,
          billing only the rung that succeeded (0 if all fail) while reserving the dearest rung against
          quota. Incompatible with js_render and stealth. If omitted, the project''s stored default
          applies.'
        schema:
          type: string
          enum:
          - auto
      - name: engine
        in: query
        required: false
        deprecated: true
        description: 'Deprecated and ignored; rendering is chosen automatically from the request''s flags and the page, and you are billed for the rendering tier actually used (`X-Engine`). Accepted so existing clients keep working. The response carries `X-Warning: ENGINE_IGNORED`.'
        schema:
          type: string
      - name: premium_proxy
        in: query
        required: false
        description: 'Coming soon; not available yet, so bring your own `proxy` (residential works best). Will use residential exits from the
          managed pool: 10 credits for a plain fetch, 25 with JavaScript rendering, 32 with full-browser rendering
          (stealth stays 25). If no residential exit is available the request fails 503 ERR::PROXY::EXHAUSTED
          rather than falling back; ignored (with X-Warning PROXY_FLAG_IGNORED) when `proxy` is set.
          See "Bot challenges" in the operation description. If omitted, the project''s stored default applies.
          Accepts true/false/1/0; a bare `?premium_proxy` means true.'
        schema:
          type: boolean
          default: false
      - name: proxy_country
        in: query
        required: false
        description: Coming soon. ISO 3166-1 alpha-2 exit country (case-insensitive), within the residential pool.
          Requires premium_proxy=true (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise) unless `proxy`
          is set, in which case it is kept as the render environment hint (browser timezone and
          locale follow it) while the custom URL stays the exit; an unavailable country is 503 ERR::PROXY::EXHAUSTED,
          never substituted. A browser render takes its timezone and locale from this country or, when
          it is omitted, from the country of the pool exit it was assigned. If omitted, the project's
          stored default applies.
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
      - name: proxy
        in: query
        required: false
        description: Your own proxy URL (http, https, socks5 or socks5h; credentials in userinfo). Takes
          precedence over premium_proxy and adds 0 proxy credits; proxy_country is kept as the render environment hint; loopback hosts are refused
          with 400 ERR::SECURITY::SSRF_BLOCKED. An unreachable proxy fails 502 ERR::PROXY::UNREACHABLE.
          A bot challenge from a named vendor is escalated automatically to stronger rendering on the same exit when the proxy is http:// (residential works best); see "Bot
          challenges" in the operation description.
        schema:
          type: string
      - name: proxy_verify
        in: query
        required: false
        description: Probe the custom `proxy` before spending the engine cost so a dead proxy fails fast.
          Requires `proxy` (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise). Accepts true/false/1/0; a
          bare `?proxy_verify` means true.
        schema:
          type: boolean
          default: false
      - name: session_id
        in: query
        required: false
        description: Reuse a session's cookies and storage (created via /v1/sessions); the request runs
          with the session's own rendering. Checked before
          any work, at 0 credits and not retryable - an unknown, malformed or other organization's id is
          404 ERR::SESSION::NOT_FOUND, a released session 410 ERR::SESSION::RELEASED, an expired one 410
          ERR::SESSION::EXPIRED. A successful request increments the session's `usage_count`, sets
          `last_used_at` and slides `expires_at`. Requests with a session are never cached.
        schema:
          type: string
      - name: sticky_key
        in: query
        required: false
        description: Coming soon. Any string; requests sharing it reuse the same pool exit. Forces a pool exit even
          on deployments whose default is direct egress, so it can fail 503 ERR::PROXY::EXHAUSTED where
          no pool exists.
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: 'Milliseconds to wait after load before capture. Browser-only: needs js_render, stealth,
          or mode=auto, else 400 ERR::REQUEST::INCOMPATIBLE_FLAGS.'
        schema:
          type: integer
          minimum: 0
          maximum: 30000
          default: 0
      - name: wait_for
        in: query
        required: false
        description: CSS selector to wait for before capture. Browser-only. If it never appears the page
          is returned as it stood with an X-Warning RENDER_DEGRADED; if the render times out waiting it
          fails 504 ERR::UPSTREAM::TIMEOUT - raise wait_for_timeout or fix the selector.
        schema:
          type: string
      - name: wait_for_timeout
        in: query
        required: false
        description: Milliseconds to wait for `wait_for`; 0 uses the engine default. Requires wait_for
          (400 ERR::REQUEST::INCOMPATIBLE_FLAGS otherwise).
        schema:
          type: integer
          minimum: 0
          maximum: 120000
          default: 0
      - name: actions
        in: query
        required: false
        description: URL-encoded JSON array. Ordered browser workflow (click, fill, scroll, ...), validated
          before anything is spent. Browser-only and makes the
          request uncacheable. A failed step ends the request at 0 credits unless that step has on_error=skip.
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/ScrapeAction'
      - name: scroll_pages
        in: query
        required: false
        description: 'Integer 0-20, default 0 (off). Scroll to the bottom up to this many times before capture, stopping early once the page stops growing. For infinite-scroll pages (feeds, search results, social timelines) where only the first screen is in the page until scrolled. Shorthand for a trailing {"scroll": {"to_bottom": true, "max_iterations": N}} step after actions. Routes like actions: full-browser rendering. With neither js_render nor mode=auto it is 400 ERR::REQUEST::INCOMPATIBLE_FLAGS. Out of range is 400 ERR::REQUEST::INVALID_PARAMETER. Refused on /v1/batch with 400 INVALID_PARAMETER. If scrolling stops early, the page is returned with the warning scroll_pages: scrolling stopped early: reason.'
        schema:
          type: integer
          minimum: 0
          maximum: 20
          default: 0
      - name: block_resources
        in: query
        required: false
        description: Comma-separated list (blank items dropped). Subresource classes the browser must
          not load (plural and short aliases accepted, case-insensitive). If omitted, full-browser rendering
          blocks nothing, so images and fonts load, including for screenshot, pdf, actions and anti-bot
          escalation. A list blocks exactly the classes named and `none` (alone) blocks nothing. Any value
          other than `none` is browser-only.
          If omitted, the project's stored default applies.
        style: form
        explode: false
        schema:
          type: array
          uniqueItems: false
          items:
            type: string
            enum:
            - none
            - document
            - documents
            - stylesheet
            - stylesheets
            - css
            - image
            - images
            - media
            - font
            - fonts
            - script
            - scripts
            - js
            - xhr
            - fetch
            - websocket
            - websockets
            - other
      - name: headless
        in: query
        required: false
        deprecated: true
        description: 'Deprecated and ignored. Rendering is chosen automatically. Accepted so existing clients keep working. The response carries `X-Warning: ENGINE_IGNORED`.'
        schema:
          type: boolean
      - name: screenshot
        in: query
        required: false
        description: Capture a screenshot; forces the JSON envelope (image base64 under `screenshots`).
          Rendered with full-browser rendering - on a deployment without it, 400 ERR::REQUEST::CAPABILITY_UNSUPPORTED
          at 0 credits. mode=auto cannot satisfy it (its fetch rung has no rasteriser). If the image is
          not delivered the page is still returned but charged 0. Accepts true/false/1/0; a bare `?screenshot`
          means true.
        schema:
          type: boolean
          default: false
      - name: screenshot_fullpage
        in: query
        required: false
        description: Capture the full scrollable page. Requires screenshot=true; mutually exclusive with
          screenshot_selector. Accepts true/false/1/0; a bare `?screenshot_fullpage` means true.
        schema:
          type: boolean
          default: false
      - name: screenshot_selector
        in: query
        required: false
        description: CSS selector of the element to capture. Requires screenshot=true; mutually exclusive
          with screenshot_fullpage.
        schema:
          type: string
      - name: screenshot_format
        in: query
        required: false
        description: Image format; omitted uses the engine default (png). Not validated by the API - an
          unrecognised value silently falls back to the engine default.
        schema:
          type: string
          enum:
          - png
          - jpeg
          - jpg
          - webp
      - name: screenshot_quality
        in: query
        required: false
        description: Lossy quality for jpeg/webp; 0 uses the engine default. A value above 0 requires
          screenshot=true.
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
      - name: custom_headers
        in: query
        required: false
        description: URL-encoded JSON object. Headers sent to the target, as name -> string value. Hop-by-hop
          headers (Connection, Keep-Alive, Proxy-Authenticate, Proxy-Authorization, TE, Trailer, Transfer-Encoding,
          Upgrade, Host, Content-Length) are refused with 400 ERR::REQUEST::INVALID_PARAMETER. If omitted,
          the project's stored default applies.
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: object
            additionalProperties:
              type: string
      - name: network_capture
        in: query
        required: false
        description: URL-encoded JSON object. Record the XHR/fetch responses the page itself made (often
          cleaner JSON than the DOM), returned under `network` in the JSON envelope. Browser-only; no
          extra credits.
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/NetworkCapture'
      - name: autoparse
        in: query
        required: false
        description: Harvest the page's own structured metadata (JSON-LD, OpenGraph, Twitter, microdata,
          RDFa, meta, embedded SPA state) into `data`, no selectors needed. Forces the JSON envelope;
          no extra credits; refused on a PDF. Accepts true/false/1/0; a bare `?autoparse` means true.
        schema:
          type: boolean
          default: false
      - name: links
        in: query
        required: false
        description: Return the page's absolute, de-duplicated <a href> targets under `links`. Forces
          the JSON envelope; no extra credits; refused on a PDF. If omitted, the project's stored default
          applies. Accepts true/false/1/0; a bare `?links` means true.
        schema:
          type: boolean
          default: false
      - name: extract
        in: query
        required: false
        description: 'URL-encoded JSON object. Selector extraction into `data`: a selector map, or a JSON
          Schema whose properties carry `selector`. Forces the JSON envelope, validated before fetching,
          no extra credits; mutually exclusive with extract_preset. Rules that match nothing are listed
          in `empty_fields`.'
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/ScrapeExtract'
      - name: extract_preset
        in: query
        required: false
        description: Coming soon. Name of a server-side extraction preset. This deployment has no preset store, so
          any value fails with 400 ERR::EXTRACT::INVALID_RULES (at 0 credits, after the fetch); use `extract`
          inline. Mutually exclusive with extract.
        schema:
          type: string
      - name: ai_extract
        in: query
        required: false
        description: Coming soon. URL-encoded JSON object. Model-driven extraction into `data`; adds 4 credits. Refused
          with 503 ERR::INTERNAL::UNAVAILABLE where no model is configured, and a model failure is 502
          ERR::EXTRACT::FAILED at 0 credits. Forces the JSON envelope.
        schema:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/AIExtract'
      - name: main_content_only
        in: query
        required: false
        description: true strips nav/footer/aside to the main article; false keeps the whole document.
          Omitted is on by default for markdown, text and json, and off for html; pass false to keep the whole page.
          Applies to markdown/text/cleaned output. A request or project value always wins. Accepts true/false/1/0;
          a bare `?main_content_only` means true.
        schema:
          type: boolean
      - name: sections
        in: query
        required: false
        description: Return `sections` (the main-content markdown split at its ATX headings) in the JSON envelope.
          Applies only to an explicit `response_format=json`; ignored for other formats. Accepts true/false/1/0;
          a bare `?sections` means true.
        schema:
          type: boolean
          default: false
      - name: include_tags
        in: query
        required: false
        description: Comma-separated list (blank items dropped). CSS selectors; keep only matching subtrees
          before extraction and markdown conversion. Applied before exclude_tags and main_content_only.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: exclude_tags
        in: query
        required: false
        description: Comma-separated list (blank items dropped). CSS selectors; remove matching elements,
          applied after include_tags and before main_content_only.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: parse_pdf
        in: query
        required: false
        description: When the target returns a PDF and markdown/text is requested, parse it to text. false
          refuses it with 502 ERR::EXTRACT::FAILED (0 credits); response_format=html always returns the
          raw bytes. If omitted, the project's stored default applies. Accepts true/false/1/0; a bare
          `?parse_pdf` means true.
        schema:
          type: boolean
          default: true
      - name: response_format
        in: query
        required: false
        description: 'Body shape: html/markdown/text return the document itself, json the envelope
          (BREAKING CHANGE: an explicit json request now gets the main-content markdown as `content` and
          heading-split `sections`, not the raw HTML), pdf a PDF printed by a real browser (needs full-browser rendering). extract, autoparse, links, ai_extract, network_capture
          or screenshot override this to the JSON envelope with X-Warning FORMAT_COERCED. A non-HTML target
          (image, binary) requested as markdown/text fails 502 ERR::EXTRACT::FAILED at 0 credits. If omitted,
          the project''s stored default applies.'
        schema:
          type: string
          enum:
          - html
          - markdown
          - text
          - json
          - pdf
          default: html
      - name: cache
        in: query
        required: false
        description: 'Serve a stored result younger than cache_ttl (Cache-State: hit). A hit is billed at
          the same price as the fetch that stored it: the cache saves the fetch (latency and load on the
          target), not credits. Only billable successes of GET-method requests without session_id or
          actions are stored. Set false for time-sensitive data; cache=false with cache_ttl>0 is 400
          ERR::REQUEST::INCOMPATIBLE_FLAGS. Accepts true/false/1/0; a bare `?cache` means true.'
        schema:
          type: boolean
          default: true
      - name: cache_ttl
        in: query
        required: false
        description: Maximum acceptable age of a cached result, in seconds. Default and cap are deployment
          settings (48h by default); larger values are clamped with X-Warning CACHE_TTL_CLAMPED. 0 disables
          caching for this request.
        schema:
          type: integer
          minimum: 0
          default: 172800
      - name: max_cost
        in: query
        required: false
        description: Credit ceiling; 0 means none. Checked against the dearest reachable outcome (the
          top rung under mode=auto) before anything runs, failing 400 ERR::LIMIT::MAX_COST_EXCEEDED at
          0 credits.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: original_status
        in: query
        required: false
        description: 'On success, use the target''s status as this response''s HTTP status instead of
          200. Leave off unless you need it: it makes a target 404 indistinguishable from an API error
          by status alone. Accepts true/false/1/0; a bare `?original_status` means true.'
        schema:
          type: boolean
          default: false
      - name: allowed_status_codes
        in: query
        required: false
        description: Comma-separated list (blank items dropped). Extra target statuses to treat as billable
          successes (200, 404 and 410 always are). Other statuses return the target's body at 0 credits,
          and under mode=auto trigger escalation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            minimum: 100
            maximum: 599
      - name: apikey
        in: query
        required: false
        deprecated: true
        description: 'Accepted by the query parser but NOT honoured for authentication on this route (only
          /v1/browser reads a query key); a request relying on it gets 401 ERR::AUTH::MISSING_KEY. Send
          `Authorization: Bearer <key>` instead.'
        schema:
          type: string
      - name: api_key
        in: query
        required: false
        deprecated: true
        description: 'Accepted by the query parser but NOT honoured for authentication on this route (only
          /v1/browser reads a query key); a request relying on it gets 401 ERR::AUTH::MISSING_KEY. Send
          `Authorization: Bearer <key>` instead.'
        schema:
          type: string
      responses:
        '200':
          description: 'Scrape completed. The HTTP status is the platform''s: the site''s status is envelope
            `status` / X-Target-Status, and a non-billable target status (e.g. 403, 500) still returns
            200 with the site''s body at 0 credits. With original_status=true this status line carries
            the target''s status instead.'
          headers:
            X-Request-Id:
              description: Request id (ULID). Quote it in support requests.
              schema:
                type: string
            X-Credits-Charged:
              description: Credits actually billed; 0 on any failure or non-billable target status. A
                cache hit is billed at the same price as the fetch that stored it.
              schema:
                type: integer
            X-Request-Cost:
              description: Price of the rendering/proxy tier that ran (on a cache hit, the tier that fetched
                the stored copy). Differs from X-Credits-Charged exactly when nothing was billed.
              schema:
                type: integer
            X-Credits-Remaining:
              description: Whole credits (rounded down) left in the organization's monthly allowance after
                this request's charge. Read from the enforced counter, so it also counts credits held
                for in-flight work (running batch jobs, open browser sessions). Never negative. Sent only
                when the request was paid from the organization's free monthly credits or its own balance;
                not sent for a request paid from a partner wallet. Absent when the organization has no
                ceiling or the counter could not be read.
              schema:
                type: integer
                minimum: 0
            X-Engine:
              description: The rendering tier used, or the last one attempted - `fetch` (HTTP only), `js`
                (JavaScript rendering) or `browser` (full-browser rendering). After an escalation (mode=auto,
                or a bot challenge escalated to stronger rendering), the tier that served the page.
              schema:
                type: string
                enum:
                - fetch
                - js
                - browser
            X-Proxy-Source:
              description: Whose exit carried the request.
              schema:
                type: string
                enum:
                - pool
                - custom
                - direct
            X-Target-Status:
              description: The site's HTTP status. Absent when no document was retrieved.
              schema:
                type: integer
            X-Proxy-Endpoint:
              description: Identifier of the pool exit that served (not an IP). Absent for custom and
                direct exits.
              schema:
                type: string
            X-Final-Url:
              description: URL after redirects, when known.
              schema:
                type: string
            X-RateLimit-Limit:
              description: Size of the key's rate-limit bucket, the most requests that can be sent back to back.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in that bucket. Never above `X-RateLimit-Limit`.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Seconds until the bucket has one request available again; only sent when the limiter imposed a wait.
              schema:
                type: integer
            Concurrency-Limit:
              description: Concurrent in-flight requests allowed for the organization.
              schema:
                type: integer
            Concurrency-Remaining:
              description: Concurrent slots left.
              schema:
                type: integer
            Cache-State:
              description: Result-cache outcome.
              schema:
                type: string
                enum:
                - hit
                - miss
                - bypass
            X-Warning:
              description: 'Repeated, one per advisory, formatted `CODE: message`. Codes: PROXY_FLAG_IGNORED,
                FORMAT_COERCED, CACHE_TTL_CLAMPED, ENGINE_SUBSTITUTED (`served by JavaScript rendering` or `browser rendering`), ENGINE_IGNORED, RENDER_DEGRADED, EMPTY_RENDER (the render found no visible content and nothing was charged), ESCALATED (one per abandoned tier, naming the tier, its price and why: `ESCALATED: JavaScript rendering (3 credits): blocked by challenge page (Cloudflare …)`).'
              schema:
                type: string
            X-Note:
              description: 'Repeated, one per note: advice for the caller, not a problem. Message only. Also in the envelope''s `notes` array. Currently sent to suggest `js_render` for a plain fetch of a page that loads scripts, and `premium_proxy`, `proxy` or `stealth` when the site refuses with 403, 429 or 503 (not sent for a status listed in `allowed_status_codes`). On a failed scrape, the same text as `diagnostics.hint`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeEnvelope'
              examples:
                extracted:
                  summary: Selector extraction
                  value:
                    url: https://example.com/product/1
                    final_url: https://example.com/product/1
                    status: 200
                    content: <html><head><title>Walnut Desk</title></head><body>...</body></html>
                    headers:
                      content-type: text/html; charset=utf-8
                    truncated: false
                    credits: 1
                    proxy_source: pool
                    warnings: []
                    data:
                      title: Walnut Desk
                      price: $349.00
                      images:
                      - https://example.com/img/desk-1.jpg
                screenshot:
                  summary: Rendered with a screenshot
                  value:
                    url: https://example.com/pricing
                    final_url: https://example.com/pricing
                    status: 200
                    content: |-
                      # Pricing

                      | Plan | Price |
                      |---|---|
                      | Starter | $29 |
                    headers:
                      content-type: text/html
                    truncated: false
                    credits: 8
                    proxy_source: pool
                    warnings:
                    - '`screenshot` returns an image, which has no representation in a markdown body,
                      so the response is the JSON envelope with the rendering under `content` and the
                      image under `screenshots`.'
                    screenshots:
                    - label: final
                      encoding: base64
                      data: iVBORw0KGgoAAAANSUhEUg...
                      size_bytes: 184233
                      format: png
                      width: 1280
                      height: 3400
            text/html:
              schema:
                type: string
                description: The document itself (non-JSON response_format with no envelope-forcing flag);
                  metadata is in the headers.
            text/markdown:
              schema:
                type: string
                description: The document itself (non-JSON response_format with no envelope-forcing flag);
                  metadata is in the headers.
            text/plain:
              schema:
                type: string
                description: The document itself (non-JSON response_format with no envelope-forcing flag);
                  metadata is in the headers.
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
                description: Browser-printed PDF (response_format=pdf).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
