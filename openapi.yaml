        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/browser:
    get:
      tags:
      - Browser
      operationId: browserConnect
      summary: Open a DevTools Protocol (CDP) WebSocket to a cloud browser
      description: |
        A WebSocket upgrade, not a JSON endpoint. Connect with any CDP client, using the URL as its browser WebSocket endpoint. Authenticate with, in order of preference: `Authorization: Bearer <key>`
        on the upgrade; a single-use `token` from `POST /v1/browser/token` (60 s, one connection, bound to its
        options — the URL the CLI and MCP return); or the `apikey` query parameter (`api_key` alias), kept for
        ZenRows-style URLs. When `token` is present it is the only credential consulted. Requires the
        `browser` scope.

        Every refusal happens before the upgrade and is an RFC 7807 problem. After the 101 there is no HTTP
        response left; the session ends by closing the TCP connection, never with a close frame or error
        message.

        Why a session ends (recorded server-side, not sent to you):
        `client_closed` (you disconnected, or stopped answering WebSocket pings: the API pings every 15 s and
        closes after 2 unanswered, so a half-open client frees its slot within about 30 s),
        `ttl_expired` (`session_ttl` elapsed; a hard wall, not idle),
        `idle_timeout` (no CDP messages in either direction for the deployment idle timeout, 2 minutes by
        default, measured from the last message; pings and pongs do not count),
        `byte_limit` (the deployment's per-session traffic cap was reached, if configured),
        `upstream_closed` (the browser went away).

        Pricing: a session costs 8 credits per started minute, the same as one full-browser-rendered page. At
        admission the session HOLDS the price of its whole `session_ttl` against the monthly credit
        allowance (default `session_ttl` 180 s = 24 credits; 60–900 s range = 8–120 credits). At close it
        is charged for the minutes it actually held (rounded up, capped at `session_ttl`'s minutes) and
        the unused part of the hold is returned immediately. A session the platform ends (upstream closed,
        or API shutdown) costs 0; a session that never opens costs 0 and returns its hold.
        While the operator has switched billing off, sessions hold and cost 0.

        Admission, before the upgrade, in this order:
        - Rate limit on session opens per key: 429 `ERR::LIMIT::RATE_LIMITED`, with `X-RateLimit-*` and `Retry-After`.
        - Monthly credit allowance cannot cover the whole `session_ttl` hold: 402 `ERR::LIMIT::QUOTA_EXCEEDED`,
          refused before any browser is leased. A shorter `session_ttl` may fit.
        - Simultaneous sessions per organization (`browser_concurrency`, default 2): 429
          `ERR::LIMIT::CONCURRENCY_EXCEEDED`, `Retry-After: 5`, `Concurrency-Limit`/`Concurrency-Remaining: 0`.
          The slot is held until the socket closes, so always close your browser.
        - If the limiter store is unreachable the session is refused (fail closed): 503
          `ERR::INTERNAL::UNAVAILABLE`, `Retry-After: 10`.
        - No CDP backend on this deployment: 501 `ERR::ENGINE::UNAVAILABLE`, `retryable: false`. Do not retry.

        Rate and concurrency headers appear only on refusals; the 101 is the browser backend's handshake
        forwarded verbatim.
      security:
      - bearerAuth: []
      - apiKeyQuery: []
      x-spicrawl-scope: browser
      parameters:
      - name: token
        in: query
        description: A single-use browser token from `POST /v1/browser/token`. Consumed on arrival, whatever
          happens next; expires 60 s after issue; revoked with the key that minted it. The session options
          are the ones bound into the token; an option in the URL that differs from (or was not part of) the
          binding is refused with 400 `ERR::REQUEST::INVALID_PARAMETER`. A used, expired or unknown token is
          401 `ERR::AUTH::INVALID_KEY`.
        schema:
          type: string
          examples:
          - wbt_Q2hhbmdlTWVJbkEtVGVzdC1Ub2tlbi1FeGFtcGxlLVZhbHVlMDE
      - name: apikey
        in: query
        description: The API key, for WebSocket clients that cannot set headers. `api_key` is accepted
          as an alias. Ignored when an `Authorization` Bearer header is present. Keep the URL out of logs
          you do not control.
        schema:
          type: string
          examples:
          - spicrawl_live_…
      - name: api_key
        in: query
        description: Alias for `apikey`, consulted only when `apikey` is absent or blank.
        schema:
          type: string
      - name: engine
        in: query
        description: Optional. The rendering tier of the cloud browser - `browser` (default; full browser,
          full protocol) or `js` (lighter JavaScript rendering with a smaller protocol surface).
          `fetch` runs no browser and is refused with 400. A tier the plan does not include is 403
          `ERR::AUTH::ENGINE_NOT_ENTITLED`; one the deployment lacks is 501 `ERR::ENGINE::UNAVAILABLE`.
        schema:
          type: string
          enum:
          - browser
          - js
          default: browser
      - name: proxy_region
        in: query
        description: Broad exit region such as `eu`. Case-insensitive. `global` means no constraint and
          is the same as omitting it. Cannot be combined with `proxy_country`.
        schema:
          type: string
          default: global
          examples:
          - eu
      - name: proxy_country
        in: query
        description: Exit country as a two-letter ISO 3166-1 alpha-2 code (case-insensitive, normalised
          to lowercase). Combining it with a non-`global` `proxy_region` is refused with 400 `ERR::REQUEST::INCOMPATIBLE_FLAGS`.
        schema:
          type: string
          pattern: ^[A-Za-z]{2}$
          examples:
          - de
      - name: session_ttl
        in: query
        description: Hard session lifetime in whole seconds. Out-of-range values are refused, not clamped.
          When it elapses the socket is closed even mid-command.
        schema:
          type: integer
          minimum: 60
          maximum: 900
          default: 180
      - name: headless
        in: query
        description: 'Optional and legacy. The display mode is chosen automatically; leave it out. If sent,
          it is `true`/`1` or `false`/`0` (case-insensitive); anything else is 400.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - '1'
          - '0'
      - name: sticky_key
        in: query
        description: Pins the exit for the session. 2-64 letters, digits and hyphens; no underscores.
          Omitted means the exit rotates, the opposite of `/v1/sessions`.
        schema:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[A-Za-z0-9-]{2,64}$
      - name: Upgrade
        in: header
        required: true
        description: Must be `websocket` (case-insensitive). A plain HTTP GET is refused with 400 `ERR::REQUEST::INVALID`.
        schema:
          type: string
          const: websocket
      - name: Connection
        in: header
        required: true
        description: Must contain the token `Upgrade`.
        schema:
          type: string
          examples:
          - Upgrade
      - name: Sec-WebSocket-Key
        in: header
        required: true
        description: Forwarded to the browser backend unchanged; the returned `Sec-WebSocket-Accept` is
          computed from it. Your WebSocket library sets it.
        schema:
          type: string
      - name: Sec-WebSocket-Version
        in: header
        required: true
        description: Forwarded unchanged. Normally `13`.
        schema:
          type: string
          examples:
          - '13'
      responses:
        '101':
          description: Switching Protocols. The socket now carries raw CDP JSON messages in both directions,
            spliced to the browser without inspection.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          description: |
            The browser backend could not be reached or refused the session (`ERR::UPSTREAM::ERROR`), or the
            worker reported another upstream-class code. Not caused by your request; retry with backoff and
            quote the `request_id` if it persists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/browser/token:
    post:
      tags:
      - Browser
      operationId: browserToken
      summary: Mint a single-use connect URL for /v1/browser
      description: |
        Returns a `/v1/browser` URL that carries a short-lived token instead of the API key, for CDP clients
        that accept only a URL. The key goes in the `Authorization` header of THIS request only (a query key
        is refused). The token is single-use, expires after 60 s, and is bound to the options in the body:
        connect with the URL unchanged. `path` is authoritative: the URL relative to the API base. `url` is
        built from the deployment's SPICRAWL_BROWSER_PUBLIC_URL when set, otherwise from this request's scheme and
        Host header (caller-controlled, a convenience only). The token is
        never logged and never stored in plaintext. Requires the `browser` scope.
      security:
      - bearerAuth: []
      x-spicrawl-scope: browser
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: The options `GET /v1/browser` accepts, validated the same way. All optional.
              properties:
                engine:
                  type: string
                  enum:
                  - browser
                  - js
                  default: browser
                proxy_country:
                  type: string
                  pattern: '^[a-z]{2}$'
                proxy_region:
                  type: string
                sticky_key:
                  type: string
                  pattern: '^[A-Za-z0-9-]{2,64}$'
                session_ttl:
                  type: integer
                  minimum: 60
                  maximum: 900
                headless:
                  type: boolean
      responses:
        '200':
          description: 'The connect URL, sent with Cache-Control no-store.'
          content:
            application/json:
              schema:
                type: object
                required: [url, path, expires_at, expires_in, single_use]
                properties:
                  url:
                    type: string
                    examples:
                    - wss://api.spicrawl.com/v1/browser?proxy_country=de&token=wbt_Q2hhbmdlTWVJbkEtVGVzdC1Ub2tlbi1FeGFtcGxlLVZhbHVlMDE
                  path:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  expires_in:
                    type: integer
                    examples:
                    - 60
                  single_use:
                    type: boolean
                  session_id:
                    type: string
                    pattern: '^bs[0-9a-f]{24}$'
                    description: Names the session this token opens, once connected. Pass it to the
                      `/v1/browser/sessions/{id}` routes for a live view and to hand control to a person.
                    examples:
                    - bs4f0c2a9e1d7b38c65a0e9f12
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/browser/sessions/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: The `session_id` that `POST /v1/browser/token` returned for this connection. An unknown,
        closed or other organization's session answers 404 `ERR::REQUEST::NOT_FOUND`.
      schema:
        type: string
        pattern: '^bs[0-9a-f]{24}$'
        examples:
        - bs4f0c2a9e1d7b38c65a0e9f12
    get:
      tags:
      - Browser
      operationId: browserSessionGet
      summary: Who controls a connected cloud browser
      description: |
        The control state of a cloud browser session that is connected now. A session exists from its
        connect until its socket closes; after that, and for another organization's session, this is 404.
        Poll it after sending a person a live view, and continue once `controller` is `agent` again.
        Requires the `browser` scope; the key in the `Authorization` header.
      security:
      - bearerAuth: []
      x-spicrawl-scope: browser
      responses:
        '200':
          $ref: '#/components/responses/BrowserControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/browser/sessions/{id}/live:
    parameters:
    - name: id
      in: path
      required: true
      description: The `session_id` that `POST /v1/browser/token` returned for this connection. An unknown,
        closed or other organization's session answers 404 `ERR::REQUEST::NOT_FOUND`.
      schema:
        type: string
        pattern: '^bs[0-9a-f]{24}$'
        examples:
        - bs4f0c2a9e1d7b38c65a0e9f12
    post:
      tags:
      - Browser
      operationId: browserLiveView
      summary: Get a live view link for a connected cloud browser
      description: |
        A link a person opens to watch the cloud browser your CDP connection is driving and take control
        of it: the same tabs, cookies and page. Use it when a page needs a human, such as a login, a
        one-time code or a captcha. `live_view_url` is a page; `live_url` is its WebSocket, for building
        your own viewer. Both carry a viewer token (`wbv_` and 64 hex characters) that works once and
        expires 60 s after this call if unused; ask again for a new one.

        While the person has control, your connection's input commands (`Input.*`), navigation
        (`Page.navigate`, `Page.reload`, `Page.navigateToHistoryEntry`) and tab changes
        (`Target.createTarget`, `Target.closeTarget`, `Target.activateTarget`) are answered with CDP error
        -32001 instead of reaching the browser; reading the page keeps working. The viewer streams the
        page and sends input only while it holds control. Watching is not billed beyond the session's
        own per-minute price, and the live view ends when the session does. A browser that cannot take a
        second viewer answers the live view's WebSocket with 409 `ERR::REQUEST::CONFLICT`.
      security:
      - bearerAuth: []
      x-spicrawl-scope: browser
      responses:
        '200':
          description: 'The live view links, sent with Cache-Control no-store.'
          content:
            application/json:
              schema:
                type: object
                required: [session_id, live_url, live_view_url, expires_in, single_use]
                properties:
                  session_id:
                    type: string
                  live_view_url:
                    type: string
                    description: The viewer page. The WebSocket URL rides in its fragment, which a browser never sends to a server.
                    examples:
                    - https://api.spicrawl.com/v1/browser/live#wss%3A%2F%2Fapi.spicrawl.com%2Fv1%2Fbrowser%2Fsessions%2Fbs4f0c2a9e1d7b38c65a0e9f12%2Flive%3Ftoken%3Dwbv_...
                  live_url:
                    type: string
                    examples:
                    - wss://api.spicrawl.com/v1/browser/sessions/bs4f0c2a9e1d7b38c65a0e9f12/live?token=wbv_...
                  expires_in:
                    type: integer
                    examples:
                    - 60
                  single_use:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/browser/sessions/{id}/takeover:
    parameters:
    - name: id
      in: path
      required: true
      description: The `session_id` that `POST /v1/browser/token` returned for this connection. An unknown,
        closed or other organization's session answers 404 `ERR::REQUEST::NOT_FOUND`.
      schema:
        type: string
        pattern: '^bs[0-9a-f]{24}$'
        examples:
        - bs4f0c2a9e1d7b38c65a0e9f12
    post:
      tags:
      - Browser
      operationId: browserTakeover
      summary: Hand a connected cloud browser to a person
      description: |
        Gives control to the person in the live view before they take it themselves. Your connection's
        input, navigation and tab changes then fail with CDP error -32001 until control is released.
        The person can also take and give back control from the live view.
      security:
      - bearerAuth: []
      x-spicrawl-scope: browser
      responses:
        '200':
          $ref: '#/components/responses/BrowserControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/browser/sessions/{id}/release:
    parameters:
    - name: id
      in: path
      required: true
      description: The `session_id` that `POST /v1/browser/token` returned for this connection. An unknown,
        closed or other organization's session answers 404 `ERR::REQUEST::NOT_FOUND`.
      schema:
        type: string
        pattern: '^bs[0-9a-f]{24}$'
        examples:
        - bs4f0c2a9e1d7b38c65a0e9f12
    post:
      tags:
      - Browser
      operationId: browserRelease
      summary: Give a connected cloud browser back to the agent
      description: |
        Gives control back to your CDP connection; its input and navigation reach the browser again.
      security:
      - bearerAuth: []
      x-spicrawl-scope: browser
      responses:
        '200':
          $ref: '#/components/responses/BrowserControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/requests:
    get:
      tags:
      - Requests
      operationId: requestsList
      summary: List recent requests in the key's project, or in every project of its organization
      description: |
        Per-request records from the ephemeral request log, newest first, for the API key's project (every
        key in that project, not only this key). With `all_projects=true` and a key carrying the `read`
        scope, the records of every project in the key's organization (archived projects included), merged
        into one newest-first list under the same cursor. Every record carries `project_id`. Records expire
        after `page.retention_hours`; for durable billing totals use `GET /v1/usage`. Totals here will not
        match an invoice.

        Pitfalls:
        - Page with BOTH `before` and `before_id` copied from `page.next_before` / `page.next_before_id`.
          `before` alone re-returns the boundary record and cannot break same-millisecond ties; `before_id`
          alone does not bound the page at all.
        - A cursor older than the retention window returns 410 `ERR::REQUEST::BEYOND_RETENTION`. Restart
          from the first page.
        - An empty `data` means "nothing in the last `retention_hours`", not "never". Check `retained_since`.
        - A page can be shorter than `limit` while `has_more` is true. Keep paging until `has_more` is false.
        - `limit` is clamped silently: missing, non-numeric or non-positive gives 50, above 200 gives 200.
        - `all_projects=true` without the `read` scope is 403 `ERR::AUTH::INSUFFICIENT_SCOPE`, naming `read`.
          The default list needs no scope beyond a valid key. The organization is always the key's own;
          no parameter names another.
        - Keep `all_projects=true` on every page of one walk: the cursor pages whichever list it came from.
      security:
      - bearerAuth: []
      x-spicrawl-scope: none
      parameters:
      - name: all_projects
        in: query
        description: When `true`, lists every project in the key's organization instead of only the key's
          project. Requires the `read` scope (403 `ERR::AUTH::INSUFFICIENT_SCOPE` without it). Only `true` and
          `false` are accepted; any other value is 400.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: limit
        in: query
        description: Page size. Never refused; invalid values fall back to 50 and values above 200 become
          200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: status
        in: query
        description: Only records with exactly this status. Not validated; an unknown value returns an
          empty page. Ignored when `only_errors=true`.
        schema:
          type: string
          enum:
          - success
          - failed
          - timeout
          - blocked
          - rejected
          - cancelled
      - name: only_errors
        in: query
        description: When exactly `true`, returns every record whose status is not `success`. Any other
          value (including `1`) is treated as false.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'false'
      - name: before
        in: query
        description: Cursor time, RFC 3339 with optional fractional seconds, copied from `page.next_before`.
          Must be sent together with `before_id`.
        schema:
          type: string
          format: date-time
      - name: before_id
        in: query
        description: Cursor id, copied from `page.next_before_id`. Must be sent together with `before`.
        schema:
          type: string
          examples:
          - 01M0FK1EP2E7FBMWAR7W10SMXW
      responses:
        '200':
          description: One page of request records plus the retention facts needed to interpret it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogPage'
              examples:
                page:
                  value:
                    data:
                    - id: 01M0FK1EP2E7FBMWAR7W10SMXW
                      created_at: '2026-09-22T12:41:22.183Z'
                      project_id: 01M0FJZ8Q3W4B5T8J2V9K6X1RD
                      status: blocked
                      http_status: 403
                      error_code: ERR::UPSTREAM::CHALLENGE
                      error_detail: The target served an Akamai challenge page.
                      attempts: 2
                      url: https://shop.example.com/p/123
                      url_host: shop.example.com
                      proxy:
                        source: pool
                        endpoint_id: dc-198.51.100.7-6646
                        requested_tier: datacenter
                        requested_country: de
                        country: de
                        endpoints:
                        - dc-198.51.100.9-6646
                        - dc-198.51.100.7-6646
                      spans:
                        admission_ms: 2
                        dispatch_ms: 4731
                        worker_ms: 4718
                        queue_ms: 0
                        engine_ms: 4706
                        upstream_ms: null
                        extract_ms: null
                        total_ms: 4735
                      blocked:
                        vendor: akamai
                        signal: '"Access Denied"'
                        rule: body_marker
                      bytes_in: 18231
                      credits_micro: 0
                    page:
                      retention_hours: 24
                      retained_since: '2026-09-21T12:45:00Z'
                      has_more: true
                      next_before: '2026-09-22T12:41:22.183Z'
                      next_before_id: 01M0FK1EP2E7FBMWAR7W10SMXW
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`all_projects=true` from a key without the `read` scope (`ERR::AUTH::INSUFFICIENT_SCOPE`,
            naming `read`).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/requests/{id}:
    get:
      tags:
      - Requests
      operationId: requestsGet
      summary: Get one request record
      description: |
        Returns one record by request id (the `X-Request-Id` / `request_id` you received). Scoped to the key's
        organization: a record made in the key's own project needs no scope, and one made in another project
        of the organization needs the `read` scope, the same rule as `all_projects=true` on the list (this
        route takes no parameter for it). Expired, never-existed, another project's without `read`, and
        unreadable records all answer 404 `ERR::REQUEST::NOT_FOUND`; a malformed id answers 400.
      security:
      - bearerAuth: []
      x-spicrawl-scope: none
      parameters:
      - name: id
        in: path
        required: true
        description: Request id, as a 26-character ULID or a UUID.
        schema:
          type: string
          examples:
          - 01M0FK1EP2E7FBMWAR7W10SMXW
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/usage:
    get:
      tags:
      - Usage
      operationId: usageGet
      summary: Billed usage over a window, broken down by one dimension
      description: |
        Reads the durable billing rollup (`usage_daily`) for the key's organization. `totals` is the billed
        quantity; `groups` plus `unattributed` equals `totals` per metric. If they do not, a `warnings` entry
        says so; trust `totals`.

        Pitfalls:
        - `to` is EXCLUSIVE. One day 2026-08-01 is `from=2026-08-01&to=2026-08-02`. Days are UTC.
        - Default window: the last 30 UTC days including today. Maximum 400 days per call.
        - A key filed under a project is pinned to it: `project_id` naming another project is 404, and
          omitting it reads only the key's project. A key with no project may name any project in the org.
        - `group_by=key` returns a different body, `UsageByKey`: per API key (`key_id`, `name`, `prefix`,
          `project_id`, `revoked`), counters per metric per UTC day, from the per-key rollup. Requests made
          without a key (the dashboard) are not in it. No caller IPs or countries are returned.
        - `group_by=engine`: the per-engine table is often empty today, so the whole quantity may appear in
          `unattributed` with a warning. That is missing attribution, not missing usage.
        - `group_by=feature` cannot attribute `requests`, `engine_ms`, byte counters or the non-batch part of
          `credits`; they land in `unattributed`. Batch spend is attributed to the `batch` group.
        - `credits` is total credit spend, batch items included, in every grouping.
        - Check `stale_seconds`: a large value means the rollup is behind.
      security:
      - bearerAuth: []
      x-spicrawl-scope: read
      parameters:
      - name: from
        in: query
        description: First UTC day, inclusive, `YYYY-MM-DD`. Defaults to 29 days before today.
        schema:
          type: string
          format: date
          examples:
          - '2026-08-01'
      - name: to
        in: query
        description: End UTC day, EXCLUSIVE, `YYYY-MM-DD`. Defaults to tomorrow. Must be after `from`,
          and the span must be at most 400 days.
        schema:
          type: string
          format: date
          examples:
          - '2026-09-01'
      - name: group_by
        in: query
        description: Breakdown dimension.
        schema:
          type: string
          enum:
          - day
          - project
          - engine
          - feature
          - key
          default: day
      - name: project_id
        in: query
        description: Restrict to one project in the organization (ULID or UUID). Omitted means every project.
        schema:
          type: string
      - name: metrics
        in: query
        description: Comma-separated metric names to include. Omitted means all. An unknown name is refused
          with 400.
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UsageMetric'
      responses:
        '200':
          description: The breakdown.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/UsageBreakdown'
                - $ref: '#/components/schemas/UsageByKey'
              examples:
                byKey:
                  value:
                    period:
                      start: '2026-09-01'
                      end: '2026-09-03'
                      days: 2
                      bounds: '[start, end)'
                    group_by: key
                    keys:
                    - key_id: 01J9Z3K6V1Q2W3E4R5T6Y7U8I9
                      name: ci-pipeline
                      prefix: spicrawl_live_a1b2
                      project_id: 01J9Z3K6V1Q2W3E4R5T6Y7U8P0
                      revoked: false
                      days:
                      - day: '2026-09-01'
                        metrics:
                          requests: 120
                          client_cli: 120
                          feature_screenshot: 4
                      totals:
                        requests: 120
                        client_cli: 120
                        feature_screenshot: 4
                byDay:
                  value:
                    period:
                      start: '2026-09-01'
                      end: '2026-09-03'
                      days: 2
                      bounds: '[start, end)'
                    group_by: day
                    groups:
                    - key: '2026-09-01'
                      metrics:
                        requests: 1200
                        credits: 4800000000
                    - key: '2026-09-02'
                      metrics:
                        requests: 800
                        credits: 3100000000
                    totals:
                      requests: 2000
                      credits: 7900000000
                    unattributed:
                      requests: 0
                      credits: 0
                    usage_as_of: '2026-09-22T11:55:00Z'
                    stale_seconds: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/usage/summary:
    get:
      tags:
      - Usage
      operationId: usageSummary
      summary: Current-period usage against the plan allowance
      description: |
        Usage for the current period, with credit allowance arithmetic in micro-credits (1 credit =
        1000000), plus the monthly allowance the API enforces. Takes no parameters.

        Every organization has a monthly credit allowance (1,000 credits unless an operator set a
        different limit for the organization), counted per allowance month: from 00:00 UTC on the day of
        the month the organization was created to the same day of the next month. When it is used up,
        requests are refused with 402 `ERR::LIMIT::QUOTA_EXCEEDED` until `allowance.resets_at`.

        - `allowance` is the number the API enforces, and the one to show as "credits left":
          `allowance.remaining_micro`. Its `used_micro` is the enforcement counter, which includes
          credits currently HELD for in-flight work (an open browser session holds its whole
          `session_ttl` price, a batch job holds the price of its unfinished items) as well as credits
          spent. It is omitted when the deployment has no allowance counter, or when the counter or the
          extra credits could not be read (a warning then says so).
        - `credits` is METERED usage from the usage rollup for the period: spent credits only, batch
          items included, but not credits held for work still running. It can therefore be lower than
          `allowance.used_micro`.
        - With no subscription (the usual case), the organization is on the free plan: `plan` names the
          current `free` plan, `plan.subscription_status` is `none`, `plan.period_source` is
          `allowance_month`, and `credits.included_micro` is the enforced monthly limit. The period is
          the allowance month, not a billing period.
        - With a subscription, `period_source` is `subscription`, the period is the billing period and
          `credits.included_micro` is the plan's included credits. The enforced limit is still
          `allowance.limit_micro`.

        Pitfalls:
        - There is no money figure. Overage pricing is computed only at invoicing.
        - `unattributed` usually equals `metrics` today because per-engine attribution is not populated.
      security:
