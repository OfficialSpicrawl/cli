      tags:
      - Sessions
      operationId: sessionsGetContext
      summary: Dump the session's cookies and storage
      description: |
        The only endpoint that returns credentials. Works only while the session is `active`. The response is
        marked `Cache-Control: no-store, private`. Reading does not slide the TTL.

        Pitfalls:
        - After release, delete, or TTL expiry the context is purged immediately and permanently. A released
          session answers 410 `ERR::SESSION::RELEASED`; an expired one 410 `ERR::SESSION::EXPIRED`. Do not
          retry a 410: create a new session and log in again.
        - Store this object yourself if you need it later. You can POST its `session_context` back to
          `POST /v1/sessions` to clone the session.
